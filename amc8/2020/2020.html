  <style>
:root {
  --bg:#f7f4ee; --panel:#fff; --ink:#1e2832; --muted:#66727f;
  --line:#d8ddd8; --blue:#2166a5; --green:#4f7d48; --amber:#c58a1d;
  --red:#b3564a; --chip:#eef3f7; --navy:#17324a;
}
* { box-sizing:border-box; }
html,body { max-width:100%; overflow-x:hidden; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif; }
header { background:var(--navy); color:#fff; padding:28px 32px 20px; }
h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; }
header p { margin:0; color:#d7e4ef; }
main { padding:24px 32px 40px; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; min-width:0; }
.stat strong { display:block; font-size:26px; }
.stat span,.muted { color:var(--muted); }
.grid { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(360px,1.2fr); gap:16px; margin-bottom:16px; }
button,select,input { font:inherit; }
button { cursor:pointer; }
.controls { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)) minmax(120px,.7fr); gap:10px; margin-bottom:14px; }
label { display:grid; gap:6px; font-size:12px; color:var(--muted); }
select,input { min-height:38px; min-width:0; border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:#fff; color:var(--ink); }
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible { outline:3px solid rgba(33,102,165,.22); outline-offset:2px; }
.clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; min-width:0; }
.problem-link { color:inherit; text-decoration:none; transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease; }
.problem-link:hover { border-color:#9ab7ce; box-shadow:0 5px 16px rgba(23,50,74,.10); transform:translateY(-1px); }
.problem-link:focus-visible { outline:3px solid #6f9fc3; outline-offset:2px; }
.detail-cta { color:var(--blue); font-weight:700; font-size:13px; }
.top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; min-width:0; }
.source { font-weight:750; margin-right:auto; }
.badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; }
.badge.major { background:#e8f0dc; color:#35592f; }
.badge.answer { background:#f5e3df; color:#863f35; font-weight:750; }
.statement,.idea { line-height:1.55; font-size:14px; white-space:pre-wrap; }
.idea { border-left:3px solid var(--blue); padding-left:10px; color:#33414e; font-size:13px; }
.source,.statement,.idea,.badge,.muted { overflow-wrap:anywhere; word-break:break-word; }
.empty { border:1px dashed var(--line); border-radius:8px; padding:24px; color:var(--muted); text-align:center; background:#fff; }
.home-link { display:inline-block; margin-bottom:10px; color:#fff; text-underline-offset:3px; }
.summary { margin:2px 0 6px; color:#33414e; }
@media (max-width:980px) {
  main { padding:18px; }
  header { padding:24px 18px 18px; }
  .stats,.grid,.controls,.compare-head,.bar-row { grid-template-columns:1fr; }
  .compare-head { display:none; }
  .bar-row [data-label]::before { content:attr(data-label); display:block; margin-bottom:4px; color:var(--muted); font-size:11px; font-weight:600; }
}
@media (max-width:480px) {
  main { padding:14px 10px 28px; }
  header { padding:20px 12px 16px; }
  h1 { font-size:25px; }
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .stat,.panel { padding:13px; }
  .cards { grid-template-columns:minmax(0,1fr); }
}

.grid { grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr); }
.controls { grid-template-columns:repeat(3,minmax(130px,1fr)) minmax(120px,.7fr); }
.bar-row { width:100%; display:grid; grid-template-columns:minmax(110px,.7fr) minmax(140px,1fr) 60px; gap:10px; align-items:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:7px; margin:7px 0; text-align:left; }
.bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
.track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; }
.track span { display:block; height:100%; background:var(--blue); }
.quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:8px; }
.quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; min-width:0; }
.year-nav { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:10px; }
@media (max-width:980px) {
  .grid,.controls,.bar-row { grid-template-columns:minmax(0,1fr); }
}
</style>

<script>
const problems=[{"year":2020,"contest":"AMC 8","form":"","problem_no":1,"source":"2020 AMC 8 Problem 1","statement":"Luka is making lemonade to sell at a school fundraiser. His recipe requires 4 times as much water as sugar and twice as much sugar as lemon juice. He uses 3 cups of lemon juice. How many cups of water does he need? (A) 6 (B) 8 (C) 12 (D) 18 (E) 24","answer":"E","major_category":"算术与数感","minor_category":"比例","tags":"比例;AMC 8","key_idea":"设共同份数或比例参数，将各数量写成同一参数的倍数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-1"},{"year":2020,"contest":"AMC 8","form":"","problem_no":2,"source":"2020 AMC 8 Problem 2","statement":"Four friends do yardwork for their neighbors over the weekend, earning 15, 20, 25, and 40, respectively. They decide to split their earnings equally among themselves. In total, how much will the friend who earned 40 give to the others? (A) 5 (B) 10 (C) 15 (D) 20 (E) 25","answer":"C","major_category":"算术与数感","minor_category":"应用题","tags":"应用题;AMC 8","key_idea":"提取数量、速度、时间或费用关系并分步计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-2"},{"year":2020,"contest":"AMC 8","form":"","problem_no":3,"source":"2020 AMC 8 Problem 3","statement":"Carrie has a rectangular garden that measures 6 feet by 8 feet. She plants the entire garden with strawberry plants. Carrie is able to plant 4 strawberry plants per square foot, and she harvests an average of 10 strawberries per plant. How many strawberries can she expect to harvest? (A) 560 (B) 960 (C) 1120 (D) 1920 (E) 3840","answer":"D","major_category":"算术与数感","minor_category":"应用题","tags":"应用题;正方形;平均数","key_idea":"提取数量、速度、时间或费用关系并分步计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-3"},{"year":2020,"contest":"AMC 8","form":"","problem_no":4,"source":"2020 AMC 8 Problem 4","statement":"Three hexagons of increasing size are shown below. Suppose the dot pattern continues so that each successive hexagon contains one more band of dots. How many dots are in the next hexagonal? [图形] (A) 35 (B) 37 (C) 39 (D) 43 (E) 49","answer":"B","major_category":"代数","minor_category":"模式规律","tags":"模式规律;AMC 8","key_idea":"从重复或递推结构中确定周期和增长规律。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-4"},{"year":2020,"contest":"AMC 8","form":"","problem_no":5,"source":"2020 AMC 8 Problem 5","statement":"Three fourths of a pitcher is filled with pineapple juice. The pitcher is emptied by pouring an equal amount of juice into each of 5 cups. What percent of the total capacity of the pitcher did each cup receive? (A) 5 (B) 10 (C) 15 (D) 20 (E) 25","answer":"C","major_category":"算术与数感","minor_category":"百分比","tags":"百分比;AMC 8","key_idea":"把百分比转成乘法关系，追踪基准量的变化。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-5"},{"year":2020,"contest":"AMC 8","form":"","problem_no":6,"source":"2020 AMC 8 Problem 6","statement":"Aaron, Darren, Karen, Maren, and Sharon rode on a small train that has five cars that seat one person each. Maren sat in the last car. Aaron sat directly behind Sharon. Darren sat in one of the cars in front of Aaron. At least one person sat between Karen and Darren. Who sat in the middle car? (A) Aaron (B) Darren (C) Karen (D) Maren (E) Sharon","answer":"A","major_category":"组合数学","minor_category":"排列组合","tags":"排列组合;AMC 8","key_idea":"按位置或对象分组，处理相邻、捆绑等排列限制。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-6"},{"year":2020,"contest":"AMC 8","form":"","problem_no":7,"source":"2020 AMC 8 Problem 7","statement":"How many integers between 2020 and 2400 have four distinct digits arranged in increasing order? (For example, 2347 is one integer.) (A) 9 (B) 10 (C) 15 (D) 21 (E) 28","answer":"C","major_category":"组合数学","minor_category":"计数","tags":"计数;数字;排列","key_idea":"建立不重不漏的分类或递推计数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-7"},{"year":2020,"contest":"AMC 8","form":"","problem_no":8,"source":"2020 AMC 8 Problem 8","statement":"Ricardo has 2020 coins, some of which are pennies ( 1 -cent coins) and the rest of which are nickels ( 5 -cent coins). He has at least one penny and at least one nickel. What is the difference in cents between the greatest possible and least possible amounts of money that Ricardo can have? (A) 8062 (B) 8068 (C) 8072 (D) 8076 (E) 8082","answer":"C","major_category":"代数","minor_category":"方程","tags":"方程;AMC 8","key_idea":"设未知数，把题目条件翻译成方程并筛选符合条件的解。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-8"},{"year":2020,"contest":"AMC 8","form":"","problem_no":9,"source":"2020 AMC 8 Problem 9","statement":"Akash's birthday cake is in the form of a 4 × 4 × 4 inch cube. The cake has icing on the top and the four side faces, and no icing on the bottom. Suppose the cake is cut into 64 smaller cubes, each measuring 1 × 1 × 1 inch, as shown below. How many small pieces will have icing on exactly two sides? [图形] (A) 12 (B) 16 (C) 18 (D) 20 (E) 24","answer":"D","major_category":"几何与测量","minor_category":"空间几何","tags":"空间几何;立方体","key_idea":"根据立体的面、棱、截面或展开图分析空间关系。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-9"},{"year":2020,"contest":"AMC 8","form":"","problem_no":10,"source":"2020 AMC 8 Problem 10","statement":"Zara has a collection of 4 marbles: an Aggie, a Bumblebee, a Steelie, and a Tiger. She wants to display them in a row on a shelf, but does not want to put the Steelie and the Tiger next to one another. In how many ways can she do this? (A) 6 (B) 8 (C) 12 (D) 18 (E) 24","answer":"C","major_category":"组合数学","minor_category":"排列组合","tags":"排列组合;AMC 8","key_idea":"按位置或对象分组，处理相邻、捆绑等排列限制。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-10"},{"year":2020,"contest":"AMC 8","form":"","problem_no":11,"source":"2020 AMC 8 Problem 11","statement":"After school, Maya and Naomi headed to the beach, 6 miles away. Maya decided to bike while Naomi took a bus. The graph below shows their journeys, indicating the time and distance traveled. What was the difference, in miles per hour, between Naomi's and Maya's average speeds? [图形] (A) 6 (B) 12 (C) 18 (D) 20 (E) 24","answer":"E","major_category":"概率与统计","minor_category":"图表与数据","tags":"图表与数据;平均数;图表;速度","key_idea":"准确读取图表或数据结构，再计算所求统计量。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-11"},{"year":2020,"contest":"AMC 8","form":"","problem_no":12,"source":"2020 AMC 8 Problem 12","statement":"For a positive integer n, the factorial notation n! represents the product of the integers from n to 1. (For example, 6! = 6 · 5 · 4 · 3 · 2 · 1.) What value of N satisfies the following equation? 5! · 9! = 12 · N! (A) 10 (B) 11 (C) 12 (D) 13 (E) 14","answer":"A","major_category":"数论","minor_category":"因数与倍数","tags":"因数与倍数;因数","key_idea":"进行质因数分解，利用因数、倍数或最小公倍数结构。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-12"},{"year":2020,"contest":"AMC 8","form":"","problem_no":13,"source":"2020 AMC 8 Problem 13","statement":"Jamal has a drawer containing 6 green socks, 18 purple socks, and 12 orange socks. After adding more purple socks, Jamal noticed that there is now a 60% chance that a sock randomly selected from the drawer is purple. How many purple socks did Jamal add? (A) 6 (B) 9 (C) 12 (D) 18 (E) 24","answer":"B","major_category":"代数","minor_category":"方程","tags":"方程;AMC 8","key_idea":"设未知数，把题目条件翻译成方程并筛选符合条件的解。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-13"},{"year":2020,"contest":"AMC 8","form":"","problem_no":14,"source":"2020 AMC 8 Problem 14","statement":"There are 20 cities in the County of Newton. Their populations are shown in the bar chart below. The average population of all the cities is indicated by the horizontal dashed line. Which of the following is closest to the total population of all 20 cities? [图形] (A) 65,000 (B) 75,000 (C) 85,000 (D) 95,000 (E) 105,000","answer":"D","major_category":"概率与统计","minor_category":"图表与数据","tags":"图表与数据;平均数","key_idea":"准确读取图表或数据结构，再计算所求统计量。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-14"},{"year":2020,"contest":"AMC 8","form":"","problem_no":15,"source":"2020 AMC 8 Problem 15","statement":"Suppose 15% of x equals 20% of y. What percentage of x is y? (A) 5 (B) 35 (C) 75 (D) 133 13 (E) 300","answer":"C","major_category":"算术与数感","minor_category":"百分比","tags":"百分比;AMC 8","key_idea":"把百分比转成乘法关系，追踪基准量的变化。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-15"},{"year":2020,"contest":"AMC 8","form":"","problem_no":16,"source":"2020 AMC 8 Problem 16","statement":"Each of the points A,B,C,D,E, and F in the figure below represents a different digit from 1 to 6. Each of the five lines shown passes through some of these points. The digits along each line are added to produce five sums, one for each line. The total of the five sums is 47. What is the digit represented by B? [图形] (A) 1 (B) 2 (C) 3 (D) 4 (E) 5","answer":"E","major_category":"组合数学","minor_category":"计数","tags":"计数;数字","key_idea":"建立不重不漏的分类或递推计数。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-16"},{"year":2020,"contest":"AMC 8","form":"","problem_no":17,"source":"2020 AMC 8 Problem 17","statement":"How many factors of 2020 have more than 3 factors? (As an example, 12 has 6 factors, namely 1, 2, 3, 4, 6, and 12. ) (A) 6 (B) 7 (C) 8 (D) 9 (E) 10","answer":"B","major_category":"数论","minor_category":"因数与倍数","tags":"因数与倍数;因数","key_idea":"进行质因数分解，利用因数、倍数或最小公倍数结构。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-17"},{"year":2020,"contest":"AMC 8","form":"","problem_no":18,"source":"2020 AMC 8 Problem 18","statement":"Rectangle ABCD is inscribed in a semicircle with diameter FE, as shown in the figure. Let DA=16, and let FD=AE=9. What is the area of ABCD? [图形] (A) 240 (B) 248 (C) 256 (D) 264 (E) 272","answer":"A","major_category":"几何与测量","minor_category":"圆","tags":"圆;矩形;面积","key_idea":"利用半径、弧、扇形或圆与多边形的面积关系。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-18"},{"year":2020,"contest":"AMC 8","form":"","problem_no":19,"source":"2020 AMC 8 Problem 19","statement":"A number is called flippy if its digits alternate between two distinct digits. For example, 2020 and 37373 are flippy, but 3883 and 123123 are not. How many five-digit flippy numbers are divisible by 15? (A) 3 (B) 4 (C) 5 (D) 6 (E) 8","answer":"B","major_category":"数论","minor_category":"数字问题","tags":"数字问题;数字","key_idea":"按位值、数字和或末位条件分析整数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-19"},{"year":2020,"contest":"AMC 8","form":"","problem_no":20,"source":"2020 AMC 8 Problem 20","statement":"A scientist recorded the integer heights of 5 trees in a row. Each tree was either twice or half as tall as the tree immediately to its right. Her damaged table shows Tree 2 is 11 meters and the average height is a number ending in .2 meters; the other entries are blank. What was the average height? [图形] (A) 22.2 (B) 24.2 (C) 33.2 (D) 35.2 (E) 37.2","answer":"B","major_category":"概率与统计","minor_category":"平均数","tags":"平均数;AMC 8","key_idea":"利用总和等于平均数乘数据个数建立关系。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-20"},{"year":2020,"contest":"AMC 8","form":"","problem_no":21,"source":"2020 AMC 8 Problem 21","statement":"A game board consists of 64 squares that alternate in color between black and white. The figure below shows square P in the bottom row and square Q in the top row. A marker is placed at P. A step consists of moving the marker onto one of the adjoining white squares in the row above. How many 7 -step paths are there from P to Q? (The figure shows a sample path.) [图形] (A) 28 (B) 30 (C) 32 (D) 33 (E) 35","answer":"A","major_category":"组合数学","minor_category":"计数","tags":"计数;正方形","key_idea":"建立不重不漏的分类或递推计数。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-21"},{"year":2020,"contest":"AMC 8","form":"","problem_no":22,"source":"2020 AMC 8 Problem 22","statement":"A machine sends an even positive integer N to N/2 and an odd positive integer N to 3N+1. Starting from 7, six applications give 7 → 22 → 11 → 34 → 17 → 52 → 26. For every positive integer N whose sixth output is 1, what is the sum of all possible starting values N? [图形] (A) 73 (B) 74 (C) 75 (D) 82 (E) 83","answer":"E","major_category":"代数","minor_category":"函数初步","tags":"函数初步;AMC 8","key_idea":"把输入输出规则写成函数并顺向或逆向追踪。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-22"},{"year":2020,"contest":"AMC 8","form":"","problem_no":23,"source":"2020 AMC 8 Problem 23","statement":"Five different awards are to be given to three students. Each student will receive at least one award. In how many different ways can the awards be distributed? (A) 120 (B) 150 (C) 180 (D) 210 (E) 240","answer":"B","major_category":"组合数学","minor_category":"计数","tags":"计数;AMC 8","key_idea":"建立不重不漏的分类或递推计数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-23"},{"year":2020,"contest":"AMC 8","form":"","problem_no":24,"source":"2020 AMC 8 Problem 24","statement":"A large square region is paved with n^2 gray square tiles, each measuring s inches on a side. A border d inches wide surrounds each tile. The figure below shows the case for n=3. When n=24, the 576 gray tiles cover 64% of the area of the large square region. What is the ratio (d)/(s) for this larger value of n? [图形] (A) 625 (B) 14 (C) 925 (D) 716 (E) 916","answer":"A","major_category":"几何与测量","minor_category":"面积","tags":"面积;正方形;比例","key_idea":"分割、补形或作差，将目标区域化为基本图形面积。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-24"},{"year":2020,"contest":"AMC 8","form":"","problem_no":25,"source":"2020 AMC 8 Problem 25","statement":"Rectangles R_1 and R_2, and squares S_1, S_2, and S_3, shown below, combine to form a rectangle that is 3322 units wide and 2020 units high. What is the side length of S_2 in units? [图形] (A) 651 (B) 655 (C) 656 (D) 662 (E) 666","answer":"A","major_category":"几何与测量","minor_category":"面积","tags":"面积;正方形;矩形","key_idea":"分割、补形或作差，将目标区域化为基本图形面积。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2020-amc-8-problem-25"}];
const filters={major:document.querySelector("#majorFilter"),minor:document.querySelector("#minorFilter"),search:document.querySelector("#searchInput")};
const cards=document.querySelector("#cards"),resultCount=document.querySelector("#resultCount"),currentSummary=document.querySelector("#currentSummary"),clearFilters=document.querySelector("#clearFilters");
const statTotal=document.querySelector("#statTotal"),statPart1=document.querySelector("#statPart1"),statPart2=document.querySelector("#statPart2"),statPart3=document.querySelector("#statPart3");
const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
function fill(select,values,current=select.value){select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");if(values.includes(current))select.value=current;}
function refreshOptions(){const cm=filters.major.value,cn=filters.minor.value;fill(filters.major,unique(problems.map(p=>p.major_category)),cm);const minorBase=problems.filter(p=>!filters.major.value||p.major_category===filters.major.value);fill(filters.minor,unique(minorBase.map(p=>p.minor_category)),cn);}
function matches(p){const q=filters.search.value.trim().toLowerCase();const hay=[p.problem_no,p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase();return(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q));}
function syncButtons(){document.querySelectorAll("[data-filter-major]").forEach(button=>{const major=button.dataset.filterMajor||"",minor=button.dataset.filterMinor||"";const active=filters.major.value===major&&(!minor||filters.minor.value===minor);button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active));});}
function render(){
  refreshOptions();
  const shown=problems.filter(matches).sort((a,b)=>Number(a.problem_no)-Number(b.problem_no));
  const partCounts=[shown.filter(p=>Number(p.problem_no)<=10).length,shown.filter(p=>Number(p.problem_no)>=11&&Number(p.problem_no)<=20).length,shown.filter(p=>Number(p.problem_no)>=21).length];
  statTotal.textContent=shown.length;statPart1.textContent=partCounts[0];statPart2.textContent=partCounts[1];statPart3.textContent=partCounts[2];
  resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`;
  const terms=[];if(filters.major.value)terms.push(filters.major.value);if(filters.minor.value)terms.push(filters.minor.value);if(filters.search.value.trim())terms.push(`搜索“${filters.search.value.trim()}”`);
  currentSummary.textContent=`当前筛选：${terms.length?terms.join(" · "):"全部分类"}`;
  syncButtons();
  cards.innerHTML=shown.length?shown.map(p=>`<a class="card problem-link" data-source="${esc(p.source)}" href="../problems/${esc(p.detail_slug)}/index.html" aria-label="查看 ${esc(p.source)} 的详细解答"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge answer">答案 ${esc(p.answer)}</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea"><strong>核心思路：</strong>${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").filter(Boolean).map(tag=>`<span class="badge">${esc(tag)}</span>`).join(" ")}</div><span class="detail-cta">查看解答 →</span></a>`).join(""):'<div class="empty">没有匹配的题目</div>';
  window.__AMC8_STATE__={year:String(problems[0]?.year??""),major:filters.major.value,minor:filters.minor.value,query:filters.search.value.trim(),visible:shown.length,partCounts};
}
Object.values(filters).forEach(control=>control.addEventListener("input",render));
document.addEventListener("click",event=>{const action=event.target.closest("[data-filter-major]");if(!action)return;filters.major.value=action.dataset.filterMajor||"";refreshOptions();filters.minor.value=action.dataset.filterMinor||"";filters.search.value="";render();});
clearFilters.addEventListener("click",()=>{Object.values(filters).forEach(control=>control.value="");render();});
render();
</script>
