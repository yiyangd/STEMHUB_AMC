  <style>
:root {
  --bg:#f7f4ee; --panel:#fff; --ink:#1e2832; --muted:#66727f;
  --line:#d8ddd8; --blue:#2166a5; --green:#4f7d48; --amber:#c58a1d;
  --red:#b3564a; --chip:#eef3f7; --navy:#17324a;
}
* { box-sizing:border-box; }
html,body { max-width:100%; overflow-x:hidden; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif; }
header { background:var(--navy); color:#fff; padding:28px 32px 20px; }
h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; }
header p { margin:0; color:#d7e4ef; }
main { padding:24px 32px 40px; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; min-width:0; }
.stat strong { display:block; font-size:26px; }
.stat span,.muted { color:var(--muted); }
.grid { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(360px,1.2fr); gap:16px; margin-bottom:16px; }
button,select,input { font:inherit; }
button { cursor:pointer; }
.controls { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)) minmax(120px,.7fr); gap:10px; margin-bottom:14px; }
label { display:grid; gap:6px; font-size:12px; color:var(--muted); }
select,input { min-height:38px; min-width:0; border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:#fff; color:var(--ink); }
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible { outline:3px solid rgba(33,102,165,.22); outline-offset:2px; }
.clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; min-width:0; }
.problem-link { color:inherit; text-decoration:none; transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease; }
.problem-link:hover { border-color:#9ab7ce; box-shadow:0 5px 16px rgba(23,50,74,.10); transform:translateY(-1px); }
.problem-link:focus-visible { outline:3px solid #6f9fc3; outline-offset:2px; }
.detail-cta { color:var(--blue); font-weight:700; font-size:13px; }
.top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; min-width:0; }
.source { font-weight:750; margin-right:auto; }
.badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; }
.badge.major { background:#e8f0dc; color:#35592f; }
.badge.answer { background:#f5e3df; color:#863f35; font-weight:750; }
.statement,.idea { line-height:1.55; font-size:14px; white-space:pre-wrap; }
.idea { border-left:3px solid var(--blue); padding-left:10px; color:#33414e; font-size:13px; }
.source,.statement,.idea,.badge,.muted { overflow-wrap:anywhere; word-break:break-word; }
.empty { border:1px dashed var(--line); border-radius:8px; padding:24px; color:var(--muted); text-align:center; background:#fff; }
.home-link { display:inline-block; margin-bottom:10px; color:#fff; text-underline-offset:3px; }
.summary { margin:2px 0 6px; color:#33414e; }
@media (max-width:980px) {
  main { padding:18px; }
  header { padding:24px 18px 18px; }
  .stats,.grid,.controls,.compare-head,.bar-row { grid-template-columns:1fr; }
  .compare-head { display:none; }
  .bar-row [data-label]::before { content:attr(data-label); display:block; margin-bottom:4px; color:var(--muted); font-size:11px; font-weight:600; }
}
@media (max-width:480px) {
  main { padding:14px 10px 28px; }
  header { padding:20px 12px 16px; }
  h1 { font-size:25px; }
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .stat,.panel { padding:13px; }
  .cards { grid-template-columns:minmax(0,1fr); }
}

.grid { grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr); }
.controls { grid-template-columns:repeat(3,minmax(130px,1fr)) minmax(120px,.7fr); }
.bar-row { width:100%; display:grid; grid-template-columns:minmax(110px,.7fr) minmax(140px,1fr) 60px; gap:10px; align-items:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:7px; margin:7px 0; text-align:left; }
.bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
.track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; }
.track span { display:block; height:100%; background:var(--blue); }
.quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:8px; }
.quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; min-width:0; }
.year-nav { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:10px; }
@media (max-width:980px) {
  .grid,.controls,.bar-row { grid-template-columns:minmax(0,1fr); }
}
</style>

<script>
const problems=[{"year":2025,"contest":"AMC 8","form":"","problem_no":1,"source":"2025 AMC 8 Problem 1","statement":"The eight-pointed star shown in a 4-by-4 grid covers what percent of the grid? (A) 40 (B) 50 (C) 60 (D) 75 (E) 80","answer":"B","major_category":"几何与测量","minor_category":"面积","tags":"网格;面积;百分比","key_idea":"把星形分割为单位三角形并与 16 个单位方格比较。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 未嵌入题图；按 AoPS Wiki 同年题页核验","detail_slug":"2025-amc-8-problem-1"},{"year":2025,"contest":"AMC 8","form":"","problem_no":2,"source":"2025 AMC 8 Problem 2","statement":"Ancient Egyptian hieroglyphs represent powers of ten. What number is represented by the shown combination? (A) 1,423 (B) 10,423 (C) 14,023 (D) 14,203 (E) 14,230","answer":"B","major_category":"数论","minor_category":"数字问题","tags":"位值;古埃及数字","key_idea":"按每种象形符号的位值计数并相加。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 未收录本题；题面和选项由 AoPS Wiki 同年题页补全","detail_slug":"2025-amc-8-problem-2"},{"year":2025,"contest":"AMC 8","form":"","problem_no":3,"source":"2025 AMC 8 Problem 3","statement":"Annika and 3 friends share 60 cards equally, 15 each. If 2 more friends join, how many cards does each of the 6 players receive? (A) 8 (B) 9 (C) 10 (D) 11 (E) 12","answer":"C","major_category":"算术与数感","minor_category":"比例","tags":"平均分配;比例","key_idea":"先由原人数和每人张数求总牌数，再按新人数平均分。","notes":"","detail_slug":"2025-amc-8-problem-3"},{"year":2025,"contest":"AMC 8","form":"","problem_no":4,"source":"2025 AMC 8 Problem 4","statement":"Lucius counts backward by 7: 100, 93, 86, ... What is his 10th number? (A) 30 (B) 37 (C) 42 (D) 44 (E) 47","answer":"B","major_category":"代数","minor_category":"数列","tags":"等差数列","key_idea":"第十项比第一项少九个公差。","notes":"","detail_slug":"2025-amc-8-problem-4"},{"year":2025,"contest":"AMC 8","form":"","problem_no":5,"source":"2025 AMC 8 Problem 5","statement":"On a unit street grid, B=(0,0), C=(2,4), A=(7,3), and factory F=(6,5). Betty drives F to A to B to C to F. What is the shortest total distance in blocks? (A) 20 (B) 22 (C) 24 (D) 26 (E) 28","answer":"C","major_category":"几何与测量","minor_category":"路径与距离","tags":"网格距离;曼哈顿距离","key_idea":"逐段使用横向与纵向位移绝对值之和。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 未收录本题；题面和选项由 AoPS Wiki 同年题页补全","detail_slug":"2025-amc-8-problem-5"},{"year":2025,"contest":"AMC 8","form":"","problem_no":6,"source":"2025 AMC 8 Problem 6","statement":"Sekou writes 15, 16, 17, 18, and 19. He erases one number so the sum of the remaining four is a multiple of 4. Which number is erased? (A) 15 (B) 16 (C) 17 (D) 18 (E) 19","answer":"C","major_category":"数论","minor_category":"整除","tags":"整除;余数","key_idea":"先求总和的模 4 余数，再匹配要删去的数。","notes":"源 PDF 未收录本题；题面和选项由 AoPS Wiki 同年题页补全","detail_slug":"2025-amc-8-problem-6"},{"year":2025,"contest":"AMC 8","form":"","problem_no":7,"source":"2025 AMC 8 Problem 7","statement":"On an exam, 5 students scored at least 95%, 13 at least 90%, 27 at least 85%, and 50 at least 80%. How many scored at least 80% but less than 90%? (A) 8 (B) 14 (C) 22 (D) 37 (E) 45","answer":"D","major_category":"概率与统计","minor_category":"图表与数据","tags":"累计频数;区间人数","key_idea":"用至少 80% 的累计人数减去至少 90% 的人数。","notes":"","detail_slug":"2025-amc-8-problem-7"},{"year":2025,"contest":"AMC 8","form":"","problem_no":8,"source":"2025 AMC 8 Problem 8","statement":"A cube net has area 18 square centimeters. What is the cube's volume in cubic centimeters? (A) 3sqrt(3) (B) 6 (C) 9 (D) 6sqrt(3) (E) 9sqrt(3)","answer":"A","major_category":"几何与测量","minor_category":"体积","tags":"立方体;表面积;体积","key_idea":"由六个正方形总面积求棱长，再求棱长的三次方。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 未收录本题；题面和选项由 AoPS Wiki 同年题页补全","detail_slug":"2025-amc-8-problem-8"},{"year":2025,"contest":"AMC 8","form":"","problem_no":9,"source":"2025 AMC 8 Problem 9","statement":"For the six pairs of numbers directly opposite on a clock, take each pair's average. What is the average of those six results? (A) 5 (B) 6.5 (C) 8 (D) 9.5 (E) 12","answer":"B","major_category":"概率与统计","minor_category":"平均数","tags":"平均数;对称配对","key_idea":"每个对面数对的和相同，因此六个平均数相同。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2025-amc-8-problem-9"},{"year":2025,"contest":"AMC 8","form":"","problem_no":10,"source":"2025 AMC 8 Problem 10","statement":"A 5-by-3 rectangle is rotated 90 degrees clockwise about the midpoint of a length-5 side, overlapping the original. What total area is covered by the union? (A) 21 (B) 22.25 (C) 23 (D) 23.75 (E) 25","answer":"D","major_category":"几何与测量","minor_category":"面积","tags":"旋转;重叠面积;并集","key_idea":"用两矩形面积之和减去重叠区域面积。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 仅保留外链而未嵌入题图；图形按 AoPS Wiki 同年题页核验","detail_slug":"2025-amc-8-problem-10"},{"year":2025,"contest":"AMC 8","form":"","problem_no":11,"source":"2025 AMC 8 Problem 11","statement":"Three tetrominoes tile a 3-by-4 rectangle. At least one is an S tetromino. Which are the other two tiles? (A) I and L (B) I and T (C) L and L (D) L and S (E) O and T","answer":"C","major_category":"组合数学","minor_category":"构造","tags":"四连方;铺砖","key_idea":"根据 S 块放置后的边界缺口尝试可行拼法并排除其余组合。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2025-amc-8-problem-11"},{"year":2025,"contest":"AMC 8","form":"","problem_no":12,"source":"2025 AMC 8 Problem 12","statement":"A 24-unit-square cross-shaped region is shown. What is the area of the largest circle that fits inside it? (A) 3pi (B) 4pi (C) 5pi (D) 6pi (E) 8pi","answer":"C","major_category":"几何与测量","minor_category":"圆","tags":"内切圆;半径;网格","key_idea":"由最窄方向上的边界距离确定最大半径。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2025-amc-8-problem-12"},{"year":2025,"contest":"AMC 8","form":"","problem_no":13,"source":"2025 AMC 8 Problem 13","statement":"Each even number 2,4,6,...,50 is divided by 7. Which histogram gives counts for remainders 0 through 6? (A) [3,4,4,3,4,3,4] (B) [3,4,4,4,3,3,4] (C) [3,4,4,4,4,3,3] (D) [4,3,4,3,4,3,4] (E) [4,4,3,4,3,4,3]","answer":"A","major_category":"数论","minor_category":"余数","tags":"模 7;周期;直方图","key_idea":"按偶数模 7 的七项周期统计 25 个数的余数频数。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 只有题图链接；直方图频数已按 AoPS Wiki 图形转写","detail_slug":"2025-amc-8-problem-13"},{"year":2025,"contest":"AMC 8","form":"","problem_no":14,"source":"2025 AMC 8 Problem 14","statement":"A number N is inserted into 2, 6, 7, 7, 28. The new mean is twice the median. What is N? (A) 7 (B) 14 (C) 20 (D) 28 (E) 34","answer":"E","major_category":"概率与统计","minor_category":"中位数","tags":"平均数;中位数;分类","key_idea":"按 N 在有序表中的位置判断中位数，再用平均数条件求 N。","notes":"","detail_slug":"2025-amc-8-problem-14"},{"year":2025,"contest":"AMC 8","form":"","problem_no":15,"source":"2025 AMC 8 Problem 15","statement":"In a 6-by-6 grid, 13 cells are silver and the rest gold. Fold vertically to form 18 overlapping pairs. Let m and M be the least and greatest possible numbers of gold-gold pairs. What is m+M? (A) 12 (B) 14 (C) 16 (D) 18 (E) 20","answer":"C","major_category":"组合数学","minor_category":"构造","tags":"配对;极值;构造","key_idea":"把 13 个银格分配到 18 对中，分别最大化和最小化含银的格对数。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2025-amc-8-problem-15"},{"year":2025,"contest":"AMC 8","form":"","problem_no":16,"source":"2025 AMC 8 Problem 16","statement":"Choose five distinct integers from 1 to 10 and five from 11 to 20, with no two chosen numbers differing by 10. What is the sum of the ten chosen numbers? (A) 95 (B) 100 (C) 105 (D) 110 (E) 115","answer":"C","major_category":"组合数学","minor_category":"分类讨论","tags":"配对;不变量","key_idea":"把 k 与 k+10 配成十对；条件迫使每对恰选一个，再求总和不变量。","notes":"","detail_slug":"2025-amc-8-problem-16"},{"year":2025,"contest":"AMC 8","form":"","problem_no":17,"source":"2025 AMC 8 Problem 17","statement":"Cities A, B, C have populations 100, 120, 160. Commuting fractions are A->B=1/4, A->C=1/5, B->A=1/3, B->C=1/6, C->A=1/8, C->B=1/10; everyone else works where they live. How many people work in A? (A) 55 (B) 60 (C) 85 (D) 115 (E) 160","answer":"D","major_category":"算术与数感","minor_category":"比例","tags":"比例;流量;应用题","key_idea":"分别计算来自三座城市而在 A 工作的人数并相加。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 未收录本题；图中箭头数据由 AoPS Wiki 同年题页转写","detail_slug":"2025-amc-8-problem-17"},{"year":2025,"contest":"AMC 8","form":"","problem_no":18,"source":"2025 AMC 8 Problem 18","statement":"A radius-1 circle has all four corner regions between it and an inscribed square shaded. A radius-R circle has one quarter of the corresponding region shaded. The shaded areas are equal. What is R? (A) sqrt(2) (B) 2 (C) 2sqrt(2) (D) 4 (E) 4sqrt(2)","answer":"B","major_category":"几何与测量","minor_category":"圆","tags":"相似;面积缩放","key_idea":"对应区域面积按半径平方缩放；四分之一面积相等确定缩放倍数。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 未收录本题；题面和选项由 AoPS Wiki 同年题页补全","detail_slug":"2025-amc-8-problem-18"},{"year":2025,"contest":"AMC 8","form":"","problem_no":19,"source":"2025 AMC 8 Problem 19","statement":"A 15-mile road has consecutive 5-mile speed limits 25, 40, and 20 mph from A to B. Cars start simultaneously at A and B and drive toward each other at the local limit. How far from A do they meet? (A) 7.75 (B) 8 (C) 8.25 (D) 8.5 (E) 8.75","answer":"D","major_category":"代数","minor_category":"方程","tags":"分段速度;相遇问题","key_idea":"按分段行驶时间确定相遇时所在路段，再建立同时到达方程。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2025-amc-8-problem-19"},{"year":2025,"contest":"AMC 8","form":"","problem_no":20,"source":"2025 AMC 8 Problem 20","statement":"Sarika, Dev, and Rajiv repeatedly take turns eating half of the cheese that remains, starting with Sarika. About what fraction of the original cheese does Sarika eat in total? (A) 4/7 (B) 3/5 (C) 2/3 (D) 3/4 (E) 7/8","answer":"A","major_category":"代数","minor_category":"数列","tags":"等比数列;无限和","key_idea":"Sarika 吃到的份额构成首项 1/2、公比 1/8 的等比级数。","notes":"","detail_slug":"2025-amc-8-problem-20"},{"year":2025,"contest":"AMC 8","form":"","problem_no":21,"source":"2025 AMC 8 Problem 21","statement":"Grades 1 through 7 are assigned once each to pods A-G. Connected pods must differ by at least 2. Edges are AB, AC, AG, AF, BC, BF, CD, CE, CF, DE, EF, and FG. What is the sum of grades at C, E, and F? (A) 12 (B) 13 (C) 14 (D) 15 (E) 16","answer":"A","major_category":"组合数学","minor_category":"构造","tags":"图标号;约束满足","key_idea":"从度数最高的节点和相邻差值限制入手构造唯一可行标号。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 未嵌入题图；连边由 AoPS Wiki 图形转写","detail_slug":"2025-amc-8-problem-21"},{"year":2025,"contest":"AMC 8","form":"","problem_no":22,"source":"2025 AMC 8 Problem 22","statement":"There are 35 coat hooks. Coats are equally spaced with the same positive number of empty hooks before, after, and between coats. How many different positive numbers of coats are possible? (A) 2 (B) 4 (C) 5 (D) 7 (E) 9","answer":"D","major_category":"数论","minor_category":"因数与倍数","tags":"整除;等间隔","key_idea":"若有 c 件外套、每段 e 个空钩，则 35=c+(c+1)e，转化为因数分解。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 的示意图为占位文本；题面和选项经 AoPS Wiki 核验","detail_slug":"2025-amc-8-problem-22"},{"year":2025,"contest":"AMC 8","form":"","problem_no":23,"source":"2025 AMC 8 Problem 23","statement":"How many four-digit numbers end in 99, are one less than a perfect square, and are the product of exactly two primes? (A) 0 (B) 1 (C) 2 (D) 3 (E) 4","answer":"B","major_category":"数论","minor_category":"质数","tags":"平方数;半素数;数字条件","key_idea":"由末两位 99 推出相邻平方的末两位，再检查候选数的质因数分解。","notes":"","detail_slug":"2025-amc-8-problem-23"},{"year":2025,"contest":"AMC 8","form":"","problem_no":24,"source":"2025 AMC 8 Problem 24","statement":"In trapezoid ABCD, base angles B and C are 60 degrees, legs AB and DC are equal, all side lengths are positive integers, and the perimeter is 30. How many non-congruent trapezoids satisfy the conditions? (A) 0 (B) 1 (C) 2 (D) 3 (E) 4","answer":"E","major_category":"几何与测量","minor_category":"四边形","tags":"等腰梯形;整数边;计数","key_idea":"把较长底边写成较短底边加两条腿的水平投影，再枚举整数周长解。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 未收录本题；题面和选项由 AoPS Wiki 同年题页补全","detail_slug":"2025-amc-8-problem-24"},{"year":2025,"contest":"AMC 8","form":"","problem_no":25,"source":"2025 AMC 8 Problem 25","statement":"In a 5-by-5 diamond grid, paths go from bottom to top using northeast or northwest steps. For every possible path, take the area between the path and the right boundary. What is the sum of all these areas? (A) 2520 (B) 3150 (C) 3840 (D) 4730 (E) 5050","answer":"B","major_category":"组合数学","minor_category":"计数","tags":"格路径;对称;面积总和","key_idea":"利用左右反射把每条路径与镜像配对，使每对面积和固定。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 末页未呈现 A-E 选项；题面、图形与选项按 AoPS Wiki 同年题页核验","detail_slug":"2025-amc-8-problem-25"}];
const filters={major:document.querySelector("#majorFilter"),minor:document.querySelector("#minorFilter"),search:document.querySelector("#searchInput")};
const cards=document.querySelector("#cards"),resultCount=document.querySelector("#resultCount"),currentSummary=document.querySelector("#currentSummary"),clearFilters=document.querySelector("#clearFilters");
const statTotal=document.querySelector("#statTotal"),statPart1=document.querySelector("#statPart1"),statPart2=document.querySelector("#statPart2"),statPart3=document.querySelector("#statPart3");
const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
function fill(select,values,current=select.value){select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");if(values.includes(current))select.value=current;}
function refreshOptions(){const cm=filters.major.value,cn=filters.minor.value;fill(filters.major,unique(problems.map(p=>p.major_category)),cm);const minorBase=problems.filter(p=>!filters.major.value||p.major_category===filters.major.value);fill(filters.minor,unique(minorBase.map(p=>p.minor_category)),cn);}
function matches(p){const q=filters.search.value.trim().toLowerCase();const hay=[p.problem_no,p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase();return(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q));}
function syncButtons(){document.querySelectorAll("[data-filter-major]").forEach(button=>{const major=button.dataset.filterMajor||"",minor=button.dataset.filterMinor||"";const active=filters.major.value===major&&(!minor||filters.minor.value===minor);button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active));});}
function render(){
  refreshOptions();
  const shown=problems.filter(matches).sort((a,b)=>Number(a.problem_no)-Number(b.problem_no));
  const partCounts=[shown.filter(p=>Number(p.problem_no)<=10).length,shown.filter(p=>Number(p.problem_no)>=11&&Number(p.problem_no)<=20).length,shown.filter(p=>Number(p.problem_no)>=21).length];
  statTotal.textContent=shown.length;statPart1.textContent=partCounts[0];statPart2.textContent=partCounts[1];statPart3.textContent=partCounts[2];
  resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`;
  const terms=[];if(filters.major.value)terms.push(filters.major.value);if(filters.minor.value)terms.push(filters.minor.value);if(filters.search.value.trim())terms.push(`搜索“${filters.search.value.trim()}”`);
  currentSummary.textContent=`当前筛选：${terms.length?terms.join(" · "):"全部分类"}`;
  syncButtons();
  cards.innerHTML=shown.length?shown.map(p=>`<a class="card problem-link" data-source="${esc(p.source)}" href="../problems/${esc(p.detail_slug)}/index.html" aria-label="查看 ${esc(p.source)} 的详细解答"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge answer">答案 ${esc(p.answer)}</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea"><strong>核心思路：</strong>${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").filter(Boolean).map(tag=>`<span class="badge">${esc(tag)}</span>`).join(" ")}</div><span class="detail-cta">查看解答 →</span></a>`).join(""):'<div class="empty">没有匹配的题目</div>';
  window.__AMC8_STATE__={year:String(problems[0]?.year??""),major:filters.major.value,minor:filters.minor.value,query:filters.search.value.trim(),visible:shown.length,partCounts};
}
Object.values(filters).forEach(control=>control.addEventListener("input",render));
document.addEventListener("click",event=>{const action=event.target.closest("[data-filter-major]");if(!action)return;filters.major.value=action.dataset.filterMajor||"";refreshOptions();filters.minor.value=action.dataset.filterMinor||"";filters.search.value="";render();});
clearFilters.addEventListener("click",()=>{Object.values(filters).forEach(control=>control.value="");render();});
render();
</script>
