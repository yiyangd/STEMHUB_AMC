  <style>
:root {
  --bg:#f7f4ee; --panel:#fff; --ink:#1e2832; --muted:#66727f;
  --line:#d8ddd8; --blue:#2166a5; --green:#4f7d48; --amber:#c58a1d;
  --red:#b3564a; --chip:#eef3f7; --navy:#17324a;
}
* { box-sizing:border-box; }
html,body { max-width:100%; overflow-x:hidden; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif; }
header { background:var(--navy); color:#fff; padding:28px 32px 20px; }
h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; }
header p { margin:0; color:#d7e4ef; }
main { padding:24px 32px 40px; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; min-width:0; }
.stat strong { display:block; font-size:26px; }
.stat span,.muted { color:var(--muted); }
.grid { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(360px,1.2fr); gap:16px; margin-bottom:16px; }
button,select,input { font:inherit; }
button { cursor:pointer; }
.controls { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)) minmax(120px,.7fr); gap:10px; margin-bottom:14px; }
label { display:grid; gap:6px; font-size:12px; color:var(--muted); }
select,input { min-height:38px; min-width:0; border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:#fff; color:var(--ink); }
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible { outline:3px solid rgba(33,102,165,.22); outline-offset:2px; }
.clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; min-width:0; }
.problem-link { color:inherit; text-decoration:none; transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease; }
.problem-link:hover { border-color:#9ab7ce; box-shadow:0 5px 16px rgba(23,50,74,.10); transform:translateY(-1px); }
.problem-link:focus-visible { outline:3px solid #6f9fc3; outline-offset:2px; }
.detail-cta { color:var(--blue); font-weight:700; font-size:13px; }
.top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; min-width:0; }
.source { font-weight:750; margin-right:auto; }
.badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; }
.badge.major { background:#e8f0dc; color:#35592f; }
.badge.answer { background:#f5e3df; color:#863f35; font-weight:750; }
.statement,.idea { line-height:1.55; font-size:14px; white-space:pre-wrap; }
.idea { border-left:3px solid var(--blue); padding-left:10px; color:#33414e; font-size:13px; }
.source,.statement,.idea,.badge,.muted { overflow-wrap:anywhere; word-break:break-word; }
.empty { border:1px dashed var(--line); border-radius:8px; padding:24px; color:var(--muted); text-align:center; background:#fff; }
.home-link { display:inline-block; margin-bottom:10px; color:#fff; text-underline-offset:3px; }
.summary { margin:2px 0 6px; color:#33414e; }
@media (max-width:980px) {
  main { padding:18px; }
  header { padding:24px 18px 18px; }
  .stats,.grid,.controls,.compare-head,.bar-row { grid-template-columns:1fr; }
  .compare-head { display:none; }
  .bar-row [data-label]::before { content:attr(data-label); display:block; margin-bottom:4px; color:var(--muted); font-size:11px; font-weight:600; }
}
@media (max-width:480px) {
  main { padding:14px 10px 28px; }
  header { padding:20px 12px 16px; }
  h1 { font-size:25px; }
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .stat,.panel { padding:13px; }
  .cards { grid-template-columns:minmax(0,1fr); }
}

.grid { grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr); }
.controls { grid-template-columns:repeat(3,minmax(130px,1fr)) minmax(120px,.7fr); }
.bar-row { width:100%; display:grid; grid-template-columns:minmax(110px,.7fr) minmax(140px,1fr) 60px; gap:10px; align-items:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:7px; margin:7px 0; text-align:left; }
.bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
.track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; }
.track span { display:block; height:100%; background:var(--blue); }
.quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:8px; }
.quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; min-width:0; }
.year-nav { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:10px; }
@media (max-width:980px) {
  .grid,.controls,.bar-row { grid-template-columns:minmax(0,1fr); }
}
</style>

const problems=[{"year":2016,"contest":"AMC 8","form":"","problem_no":1,"source":"2016 AMC 8 Problem 1","statement":"The longest professional tennis match lasted a total of 11 hours and 5 minutes. How many minutes is that? (A) 605 (B) 655 (C) 665 (D) 1005 (E) 1105","answer":"C","major_category":"算术与数感","minor_category":"单位换算","tags":"单位换算;AMC 8","key_idea":"先统一单位，再进行数量计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-1"},{"year":2016,"contest":"AMC 8","form":"","problem_no":2,"source":"2016 AMC 8 Problem 2","statement":"In rectangle ABCD, AB=6 and AD=8. Point M is the midpoint of AD. What is the area of triangle AMC? [图形] (A) 12 (B) 15 (C) 18 (D) 20 (E) 24","answer":"A","major_category":"几何与测量","minor_category":"面积","tags":"面积;三角形;矩形","key_idea":"分割、补形或作差，将目标区域化为基本图形面积。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-2"},{"year":2016,"contest":"AMC 8","form":"","problem_no":3,"source":"2016 AMC 8 Problem 3","statement":"Four students take an exam. Three of their scores are 70, 80, and 90. If the average of their four scores is 70, then what is the remaining score? (A) 40 (B) 50 (C) 55 (D) 60 (E) 70","answer":"A","major_category":"概率与统计","minor_category":"平均数","tags":"平均数;AMC 8","key_idea":"利用总和等于平均数乘数据个数建立关系。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-3"},{"year":2016,"contest":"AMC 8","form":"","problem_no":4,"source":"2016 AMC 8 Problem 4","statement":"When Cheenu was a boy, he could run 15 miles in 3 hours and 30 minutes. As an old man, he can now walk 10 miles in 4 hours. How many minutes longer does it take for him to travel a mile now compared to when he was a boy? (A) 6 (B) 10 (C) 15 (D) 18 (E) 30","answer":"B","major_category":"算术与数感","minor_category":"应用题","tags":"应用题;AMC 8","key_idea":"提取数量、速度、时间或费用关系并分步计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-4"},{"year":2016,"contest":"AMC 8","form":"","problem_no":5,"source":"2016 AMC 8 Problem 5","statement":"The number N is a two-digit number. • When N is divided by 9, the remainder is 1. • When N is divided by 10, the remainder is 3. What is the remainder when N is divided by 11? (A) 0 (B) 2 (C) 4 (D) 5 (E) 7","answer":"E","major_category":"数论","minor_category":"余数","tags":"余数;数字","key_idea":"在适当模数下计算并利用余数周期。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-5"},{"year":2016,"contest":"AMC 8","form":"","problem_no":6,"source":"2016 AMC 8 Problem 6","statement":"The following bar graph represents the length (in letters) of the names of 19 people. What is the median length of these names? [图形] (A) 3 (B) 4 (C) 5 (D) 6 (E) 7","answer":"B","major_category":"概率与统计","minor_category":"中位数","tags":"中位数;图表","key_idea":"先排序并确定中间位置，再结合其他统计量约束。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-6"},{"year":2016,"contest":"AMC 8","form":"","problem_no":7,"source":"2016 AMC 8 Problem 7","statement":"Which of the following numbers is not a perfect square? (A) 1^2016 (B) 2^2017 (C) 3^2018 (D) 4^2019 (E) 5^2020","answer":"B","major_category":"数论","minor_category":"因数与倍数","tags":"因数与倍数;正方形","key_idea":"进行质因数分解，利用因数、倍数或最小公倍数结构。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-7"},{"year":2016,"contest":"AMC 8","form":"","problem_no":8,"source":"2016 AMC 8 Problem 8","statement":"Find the value of the expression: 100-98+96-94+92-90+...+8-6+4-2. (A) 20 (B) 40 (C) 50 (D) 80 (E) 100","answer":"C","major_category":"算术与数感","minor_category":"四则运算","tags":"四则运算;AMC 8","key_idea":"按运算顺序化简数值表达式，并用选项回代核对。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-8"},{"year":2016,"contest":"AMC 8","form":"","problem_no":9,"source":"2016 AMC 8 Problem 9","statement":"What is the sum of the distinct prime integer divisors of 2016? (A) 9 (B) 12 (C) 16 (D) 49 (E) 63","answer":"B","major_category":"数论","minor_category":"质数","tags":"质数;AMC 8","key_idea":"用质数定义和质因数分解排除合数情形。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-9"},{"year":2016,"contest":"AMC 8","form":"","problem_no":10,"source":"2016 AMC 8 Problem 10","statement":"Suppose that a * b means 3a-b. What is the value of x if 2 * (5 * x)=1 (A) (1)/(10) (B) 2 (C) (10)/(3) (D) 10 (E) 14","answer":"D","major_category":"代数","minor_category":"方程","tags":"方程;AMC 8","key_idea":"设未知数，把题目条件翻译成方程并筛选符合条件的解。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-10"},{"year":2016,"contest":"AMC 8","form":"","problem_no":11,"source":"2016 AMC 8 Problem 11","statement":"Determine how many two-digit numbers satisfy the following property: when the number is added to the number obtained by reversing its digits, the sum is 132. (A) 5 (B) 7 (C) 9 (D) 11 (E) 12","answer":"B","major_category":"数论","minor_category":"数字问题","tags":"数字问题;数字","key_idea":"按位值、数字和或末位条件分析整数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-11"},{"year":2016,"contest":"AMC 8","form":"","problem_no":12,"source":"2016 AMC 8 Problem 12","statement":"Jefferson Middle School has the same number of boys and girls. (3)/(4) of the girls and (2)/(3) of the boys went on a field trip. What fraction of the students on the field trip were girls? (A) (1)/(2) (B) (9)/(17) (C) (7)/(13) (D) (2)/(3) (E) (14)/(15)","answer":"B","major_category":"算术与数感","minor_category":"比例","tags":"比例;AMC 8","key_idea":"设共同份数或比例参数，将各数量写成同一参数的倍数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-12"},{"year":2016,"contest":"AMC 8","form":"","problem_no":13,"source":"2016 AMC 8 Problem 13","statement":"Two different numbers are randomly selected from the set - 2, -1, 0, 3, 4, 5 and multiplied together. What is the probability that the product is 0? (A) (1)/(6) (B) (1)/(5) (C) (1)/(4) (D) (1)/(3) (E) (1)/(2)","answer":"D","major_category":"概率与统计","minor_category":"概率","tags":"概率;AMC 8","key_idea":"确定等可能样本空间，计数有利结果并求比值。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-13"},{"year":2016,"contest":"AMC 8","form":"","problem_no":14,"source":"2016 AMC 8 Problem 14","statement":"Karl's car uses a gallon of gas every 35 miles, and his gas tank holds 14 gallons when it is full. One day, Karl started with a full tank of gas, drove 350 miles, bought 8 gallons of gas, and continued driving to his destination. When he arrived, his gas tank was half full. How many miles did Karl drive that day? (A) 525 (B) 560 (C) 595 (D) 665 (E) 735","answer":"A","major_category":"算术与数感","minor_category":"应用题","tags":"应用题;AMC 8","key_idea":"提取数量、速度、时间或费用关系并分步计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-14"},{"year":2016,"contest":"AMC 8","form":"","problem_no":15,"source":"2016 AMC 8 Problem 15","statement":"What is the largest power of 2 that is a divisor of 13^4 - 11^4? (A) 8 (B) 16 (C) 32 (D) 64 (E) 128","answer":"C","major_category":"数论","minor_category":"因数与倍数","tags":"因数与倍数;AMC 8","key_idea":"进行质因数分解，利用因数、倍数或最小公倍数结构。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-15"},{"year":2016,"contest":"AMC 8","form":"","problem_no":16,"source":"2016 AMC 8 Problem 16","statement":"Annie and Bonnie are running laps around a 400 -meter oval track. They started at the same time, at the same place, but Annie has pulled ahead because she runs 25% faster than Bonnie. How many laps will Annie have run when she first passes Bonnie? (A) 1(1)/(4) (B) 3(1)/(3) (C) 4 (D) 5 (E) 25","answer":"D","major_category":"算术与数感","minor_category":"百分比","tags":"百分比;AMC 8","key_idea":"把百分比转成乘法关系，追踪基准量的变化。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-16"},{"year":2016,"contest":"AMC 8","form":"","problem_no":17,"source":"2016 AMC 8 Problem 17","statement":"An ATM password at Fred's Bank is composed of four digits from 0 to 9, with repeated digits allowable. If no password may begin with the sequence 9,1,1, then how many passwords are possible? (A) 30 (B) 7290 (C) 9000 (D) 9990 (E) 9999","answer":"D","major_category":"组合数学","minor_category":"计数","tags":"计数;数字;数列","key_idea":"建立不重不漏的分类或递推计数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-17"},{"year":2016,"contest":"AMC 8","form":"","problem_no":18,"source":"2016 AMC 8 Problem 18","statement":"In an All-Area track meet, 216 sprinters enter a 100- meter dash competition. The track has 6 lanes, so only 6 sprinters can compete at a time. At the end of each race, the five non-winners are eliminated, and the winner will compete again in a later race. How many races are needed to determine the champion sprinter? (A) 36 (B) 42 (C) 43 (D) 60 (E) 72","answer":"C","major_category":"组合数学","minor_category":"计数","tags":"计数;面积","key_idea":"建立不重不漏的分类或递推计数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-18"},{"year":2016,"contest":"AMC 8","form":"","problem_no":19,"source":"2016 AMC 8 Problem 19","statement":"The sum of 25 consecutive even integers is 10,000. What is the largest of these 25 consecutive integers? (A) 360 (B) 388 (C) 412 (D) 416 (E) 424","answer":"E","major_category":"代数","minor_category":"方程","tags":"方程;AMC 8","key_idea":"设未知数，把题目条件翻译成方程并筛选符合条件的解。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-19"},{"year":2016,"contest":"AMC 8","form":"","problem_no":20,"source":"2016 AMC 8 Problem 20","statement":"The least common multiple of a and b is 12, and the least common multiple of b and c is 15. What is the least possible value of the least common multiple of a and c? (A) 20 (B) 30 (C) 60 (D) 120 (E) 180","answer":"A","major_category":"数论","minor_category":"因数与倍数","tags":"因数与倍数;AMC 8","key_idea":"进行质因数分解，利用因数、倍数或最小公倍数结构。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-20"},{"year":2016,"contest":"AMC 8","form":"","problem_no":21,"source":"2016 AMC 8 Problem 21","statement":"A top hat contains 3 red chips and 2 green chips. Chips are drawn randomly, one at a time without replacement, until all 3 of the reds are drawn or until both green chips are drawn. What is the probability that the 3 reds are drawn? (A) (3)/(10) (B) (2)/(5) (C) (1)/(2) (D) (3)/(5) (E) (7)/(10)","answer":"B","major_category":"概率与统计","minor_category":"概率","tags":"概率;AMC 8","key_idea":"确定等可能样本空间，计数有利结果并求比值。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-21"},{"year":2016,"contest":"AMC 8","form":"","problem_no":22,"source":"2016 AMC 8 Problem 22","statement":"Rectangle DEFA below is a 3 × 4 rectangle with DC=CB=BA=1. What is the area of the \"bat wings\" (shaded region)? [图形] (A) 2 (B) 2 (1)/(2) (C) 3 (D) 3 (1)/(2) (E) 4","answer":"C","major_category":"几何与测量","minor_category":"面积","tags":"面积;矩形","key_idea":"分割、补形或作差，将目标区域化为基本图形面积。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-22"},{"year":2016,"contest":"AMC 8","form":"","problem_no":23,"source":"2016 AMC 8 Problem 23","statement":"Two congruent circles centered at points A and B each pass through the other circle's center. The line containing both A and B is extended to intersect the circles at points C and D. The circles intersect at two points, one of which is E. What is the degree measure of ∠ CED? (A) 90 (B) 105 (C) 120 (D) 135 (E) 150","answer":"C","major_category":"几何与测量","minor_category":"角度","tags":"角度;圆","key_idea":"利用角和、平行线或圆中角关系建立角度等式。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-23"},{"year":2016,"contest":"AMC 8","form":"","problem_no":24,"source":"2016 AMC 8 Problem 24","statement":"The digits 1, 2, 3, 4, and 5 are each used once to write a five-digit number PQRST. The three-digit number PQR is divisible by 4, the three-digit number QRS is divisible by 5, and the three-digit number RST is divisible by 3. What is P? (A) 1 (B) 2 (C) 3 (D) 4 (E) 5","answer":"A","major_category":"数论","minor_category":"数字问题","tags":"数字问题;数字","key_idea":"按位值、数字和或末位条件分析整数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-24"},{"year":2016,"contest":"AMC 8","form":"","problem_no":25,"source":"2016 AMC 8 Problem 25","statement":"A semicircle is inscribed in an isosceles triangle with base 16 and height 15 so that the diameter of the semicircle is contained in the base of the triangle as shown. What is the radius of the semicircle? [图形] (A) 4 sqrt(3) (B) (120)/(17) (C) 10 (D) 17sqrt(2)2 (E) 17sqrt(3)2","answer":"B","major_category":"几何与测量","minor_category":"圆","tags":"圆;三角形","key_idea":"利用半径、弧、扇形或圆与多边形的面积关系。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2016-amc-8-problem-25"}];
const filters={major:document.querySelector("#majorFilter"),minor:document.querySelector("#minorFilter"),search:document.querySelector("#searchInput")};
const cards=document.querySelector("#cards"),resultCount=document.querySelector("#resultCount"),currentSummary=document.querySelector("#currentSummary"),clearFilters=document.querySelector("#clearFilters");
const statTotal=document.querySelector("#statTotal"),statPart1=document.querySelector("#statPart1"),statPart2=document.querySelector("#statPart2"),statPart3=document.querySelector("#statPart3");
const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
function fill(select,values,current=select.value){select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");if(values.includes(current))select.value=current;}
function refreshOptions(){const cm=filters.major.value,cn=filters.minor.value;fill(filters.major,unique(problems.map(p=>p.major_category)),cm);const minorBase=problems.filter(p=>!filters.major.value||p.major_category===filters.major.value);fill(filters.minor,unique(minorBase.map(p=>p.minor_category)),cn);}
function matches(p){const q=filters.search.value.trim().toLowerCase();const hay=[p.problem_no,p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase();return(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q));}
function syncButtons(){document.querySelectorAll("[data-filter-major]").forEach(button=>{const major=button.dataset.filterMajor||"",minor=button.dataset.filterMinor||"";const active=filters.major.value===major&&(!minor||filters.minor.value===minor);button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active));});}
function render(){
  refreshOptions();
  const shown=problems.filter(matches).sort((a,b)=>Number(a.problem_no)-Number(b.problem_no));
  const partCounts=[shown.filter(p=>Number(p.problem_no)<=10).length,shown.filter(p=>Number(p.problem_no)>=11&&Number(p.problem_no)<=20).length,shown.filter(p=>Number(p.problem_no)>=21).length];
  statTotal.textContent=shown.length;statPart1.textContent=partCounts[0];statPart2.textContent=partCounts[1];statPart3.textContent=partCounts[2];
  resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`;
  const terms=[];if(filters.major.value)terms.push(filters.major.value);if(filters.minor.value)terms.push(filters.minor.value);if(filters.search.value.trim())terms.push(`搜索“${filters.search.value.trim()}”`);
  currentSummary.textContent=`当前筛选：${terms.length?terms.join(" · "):"全部分类"}`;
  syncButtons();
  cards.innerHTML=shown.length?shown.map(p=>`<a class="card problem-link" data-source="${esc(p.source)}" href="../problems/${esc(p.detail_slug)}/index.html" aria-label="查看 ${esc(p.source)} 的详细解答"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge answer">答案 ${esc(p.answer)}</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea"><strong>核心思路：</strong>${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").filter(Boolean).map(tag=>`<span class="badge">${esc(tag)}</span>`).join(" ")}</div><span class="detail-cta">查看解答 →</span></a>`).join(""):'<div class="empty">没有匹配的题目</div>';
  window.__AMC8_STATE__={year:String(problems[0]?.year??""),major:filters.major.value,minor:filters.minor.value,query:filters.search.value.trim(),visible:shown.length,partCounts};
}
Object.values(filters).forEach(control=>control.addEventListener("input",render));
document.addEventListener("click",event=>{const action=event.target.closest("[data-filter-major]");if(!action)return;filters.major.value=action.dataset.filterMajor||"";refreshOptions();filters.minor.value=action.dataset.filterMinor||"";filters.search.value="";render();});
clearFilters.addEventListener("click",()=>{Object.values(filters).forEach(control=>control.value="");render();});
render();
</script>
