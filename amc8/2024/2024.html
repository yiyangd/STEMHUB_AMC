  <style>
:root {
  --bg:#f7f4ee; --panel:#fff; --ink:#1e2832; --muted:#66727f;
  --line:#d8ddd8; --blue:#2166a5; --green:#4f7d48; --amber:#c58a1d;
  --red:#b3564a; --chip:#eef3f7; --navy:#17324a;
}
* { box-sizing:border-box; }
html,body { max-width:100%; overflow-x:hidden; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif; }
header { background:var(--navy); color:#fff; padding:28px 32px 20px; }
h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; }
header p { margin:0; color:#d7e4ef; }
main { padding:24px 32px 40px; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; min-width:0; }
.stat strong { display:block; font-size:26px; }
.stat span,.muted { color:var(--muted); }
.grid { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(360px,1.2fr); gap:16px; margin-bottom:16px; }
button,select,input { font:inherit; }
button { cursor:pointer; }
.controls { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)) minmax(120px,.7fr); gap:10px; margin-bottom:14px; }
label { display:grid; gap:6px; font-size:12px; color:var(--muted); }
select,input { min-height:38px; min-width:0; border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:#fff; color:var(--ink); }
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible { outline:3px solid rgba(33,102,165,.22); outline-offset:2px; }
.clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; min-width:0; }
.problem-link { color:inherit; text-decoration:none; transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease; }
.problem-link:hover { border-color:#9ab7ce; box-shadow:0 5px 16px rgba(23,50,74,.10); transform:translateY(-1px); }
.problem-link:focus-visible { outline:3px solid #6f9fc3; outline-offset:2px; }
.detail-cta { color:var(--blue); font-weight:700; font-size:13px; }
.top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; min-width:0; }
.source { font-weight:750; margin-right:auto; }
.badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; }
.badge.major { background:#e8f0dc; color:#35592f; }
.badge.answer { background:#f5e3df; color:#863f35; font-weight:750; }
.statement,.idea { line-height:1.55; font-size:14px; white-space:pre-wrap; }
.idea { border-left:3px solid var(--blue); padding-left:10px; color:#33414e; font-size:13px; }
.source,.statement,.idea,.badge,.muted { overflow-wrap:anywhere; word-break:break-word; }
.empty { border:1px dashed var(--line); border-radius:8px; padding:24px; color:var(--muted); text-align:center; background:#fff; }
.home-link { display:inline-block; margin-bottom:10px; color:#fff; text-underline-offset:3px; }
.summary { margin:2px 0 6px; color:#33414e; }
@media (max-width:980px) {
  main { padding:18px; }
  header { padding:24px 18px 18px; }
  .stats,.grid,.controls,.compare-head,.bar-row { grid-template-columns:1fr; }
  .compare-head { display:none; }
  .bar-row [data-label]::before { content:attr(data-label); display:block; margin-bottom:4px; color:var(--muted); font-size:11px; font-weight:600; }
}
@media (max-width:480px) {
  main { padding:14px 10px 28px; }
  header { padding:20px 12px 16px; }
  h1 { font-size:25px; }
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .stat,.panel { padding:13px; }
  .cards { grid-template-columns:minmax(0,1fr); }
}

.grid { grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr); }
.controls { grid-template-columns:repeat(3,minmax(130px,1fr)) minmax(120px,.7fr); }
.bar-row { width:100%; display:grid; grid-template-columns:minmax(110px,.7fr) minmax(140px,1fr) 60px; gap:10px; align-items:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:7px; margin:7px 0; text-align:left; }
.bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
.track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; }
.track span { display:block; height:100%; background:var(--blue); }
.quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:8px; }
.quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; min-width:0; }
.year-nav { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:10px; }
@media (max-width:980px) {
  .grid,.controls,.bar-row { grid-template-columns:minmax(0,1fr); }
}
</style>

const problems=[{"year":2024,"contest":"AMC 8","form":"","problem_no":1,"source":"2024 AMC 8 Problem 1","statement":"What is the ones digit of 222,222 - 22,222 - 2,222 - 222 - 22 - 2? (A) 0 (B) 2 (C) 4 (D) 6 (E) 8","answer":"B","major_category":"数论","minor_category":"数字问题","tags":"个位数;位值","key_idea":"只追踪各项的个位数并在模 10 下计算。","notes":"","detail_slug":"2024-amc-8-problem-1"},{"year":2024,"contest":"AMC 8","form":"","problem_no":2,"source":"2024 AMC 8 Problem 2","statement":"What is the value of 44/11 + 110/44 + 44/1100 in decimal form? (A) 6.4 (B) 6.504 (C) 6.54 (D) 6.9 (E) 6.94","answer":"C","major_category":"算术与数感","minor_category":"分数与小数","tags":"分数;小数;化简","key_idea":"先约分各分数，再统一用小数相加。","notes":"","detail_slug":"2024-amc-8-problem-2"},{"year":2024,"contest":"AMC 8","form":"","problem_no":3,"source":"2024 AMC 8 Problem 3","statement":"Four squares of side length 4, 7, 9, and 10 are arranged in increasing size order so that their left and bottom edges align. They alternate white-gray-white-gray. What is the visible gray area? (A) 42 (B) 45 (C) 49 (D) 50 (E) 52","answer":"E","major_category":"几何与测量","minor_category":"面积","tags":"正方形;重叠面积","key_idea":"把可见灰色区域写成两个正方形面积差之和。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2024-amc-8-problem-3"},{"year":2024,"contest":"AMC 8","form":"","problem_no":4,"source":"2024 AMC 8 Problem 4","statement":"Yunji added the integers from 1 to 9 but left out one number. Her incorrect sum was a square. Which number was omitted? (A) 5 (B) 6 (C) 7 (D) 8 (E) 9","answer":"E","major_category":"数论","minor_category":"数字问题","tags":"平方数;整数和","key_idea":"先求 1 到 9 的总和，再检查与相邻平方数的差。","notes":"","detail_slug":"2024-amc-8-problem-4"},{"year":2024,"contest":"AMC 8","form":"","problem_no":5,"source":"2024 AMC 8 Problem 5","statement":"Aaliyah rolls two standard six-sided dice. Their product is a multiple of 6. Which integer cannot be their sum? (A) 5 (B) 6 (C) 7 (D) 8 (E) 9","answer":"B","major_category":"数论","minor_category":"整除","tags":"骰子;整除;枚举","key_idea":"按乘积同时含因子 2 和 3 的条件枚举可行点数对。","notes":"","detail_slug":"2024-amc-8-problem-5"},{"year":2024,"contest":"AMC 8","form":"","problem_no":6,"source":"2024 AMC 8 Problem 6","statement":"Four skating paths P, Q, R, and S are shown. What is their order from shortest to longest? (A) P, Q, R, S (B) P, R, S, Q (C) Q, S, P, R (D) R, P, S, Q (E) R, S, P, Q","answer":"D","major_category":"几何与测量","minor_category":"周长与长度","tags":"路径;弧长;比较","key_idea":"把每条路径分解为可直接比较的线段或圆弧。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2024-amc-8-problem-6"},{"year":2024,"contest":"AMC 8","form":"","problem_no":7,"source":"2024 AMC 8 Problem 7","statement":"A 3-by-7 rectangle is tiled without overlap using 2-by-2, 1-by-4, and 1-by-1 tiles. What is the minimum possible number of 1-by-1 tiles? (A) 1 (B) 2 (C) 3 (D) 4 (E) 5","answer":"E","major_category":"组合数学","minor_category":"构造","tags":"铺砖;奇偶性;构造","key_idea":"先用面积和行列限制给出下界，再展示达到下界的铺法。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2024-amc-8-problem-7"},{"year":2024,"contest":"AMC 8","form":"","problem_no":8,"source":"2024 AMC 8 Problem 8","statement":"On Monday Taye has $2. Each day he either gains $3 or doubles the previous amount. How many different amounts could he have on Thursday? (A) 3 (B) 4 (C) 5 (D) 6 (E) 7","answer":"D","major_category":"代数","minor_category":"模式规律","tags":"状态枚举;重复值","key_idea":"逐日列出可达金额并合并重复结果。","notes":"","detail_slug":"2024-amc-8-problem-8"},{"year":2024,"contest":"AMC 8","form":"","problem_no":9,"source":"2024 AMC 8 Problem 9","statement":"Maria's marbles are red, green, or blue. She has half as many red as green and twice as many blue as green. Which could be the total number of marbles? (A) 24 (B) 25 (C) 26 (D) 27 (E) 28","answer":"E","major_category":"算术与数感","minor_category":"比例","tags":"比例;整数约束","key_idea":"把三种数量写成同一整数参数的倍数。","notes":"","detail_slug":"2024-amc-8-problem-9"},{"year":2024,"contest":"AMC 8","form":"","problem_no":10,"source":"2024 AMC 8 Problem 10","statement":"Carbon dioxide was 338 ppm in January 1980 and increases about 1.515 ppm per year. What is the expected January 2030 level, rounded to the nearest integer? (A) 399 (B) 414 (C) 420 (D) 444 (E) 459","answer":"B","major_category":"代数","minor_category":"函数初步","tags":"线性增长;估算","key_idea":"用初值加上年数乘年增长率建立线性模型。","notes":"","detail_slug":"2024-amc-8-problem-10"},{"year":2024,"contest":"AMC 8","form":"","problem_no":11,"source":"2024 AMC 8 Problem 11","statement":"Triangle ABC has A(5,7), B(11,7), and C(3,y), where y > 7. Its area is 12. What is y? (A) 8 (B) 9 (C) 10 (D) 11 (E) 12","answer":"D","major_category":"几何与测量","minor_category":"坐标","tags":"坐标;三角形面积","key_idea":"把 AB 作为水平底边，由面积求点 C 到底边的高。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2024-amc-8-problem-11"},{"year":2024,"contest":"AMC 8","form":"","problem_no":12,"source":"2024 AMC 8 Problem 12","statement":"Rohan has 90 guppies in four tanks. Tank 2 has 1 more than tank 1, tank 3 has 2 more than tank 2, and tank 4 has 3 more than tank 3. How many are in tank 4? (A) 20 (B) 21 (C) 23 (D) 24 (E) 26","answer":"E","major_category":"代数","minor_category":"方程","tags":"一元方程;应用题","key_idea":"设第一缸数量为未知数，用总数建立一次方程。","notes":"","detail_slug":"2024-amc-8-problem-12"},{"year":2024,"contest":"AMC 8","form":"","problem_no":13,"source":"2024 AMC 8 Problem 13","statement":"Buzz Bunny starts on the ground, makes six one-step hops up or down a staircase, never going below the ground, and ends on the ground. How many hop sequences are possible? (A) 4 (B) 5 (C) 6 (D) 8 (E) 12","answer":"B","major_category":"组合数学","minor_category":"计数","tags":"路径计数;上下步","key_idea":"枚举含三个上步和三个下步且前缀不低于地面的序列。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2024-amc-8-problem-13"},{"year":2024,"contest":"AMC 8","form":"","problem_no":14,"source":"2024 AMC 8 Problem 14","statement":"The directed routes have lengths A->M=8, A->X=5, X->M=2, X->Y=10, M->Y=6, M->C=14, Y->C=5, C->Z=10, Y->Z=17, and M->Z=25. What is the shortest distance from A to Z? (A) 28 (B) 29 (C) 30 (D) 31 (E) 32","answer":"A","major_category":"组合数学","minor_category":"分类讨论","tags":"有向图;最短路","key_idea":"按可达节点逐层比较到达该节点的最短累计距离。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2024-amc-8-problem-14"},{"year":2024,"contest":"AMC 8","form":"","problem_no":15,"source":"2024 AMC 8 Problem 15","statement":"F, L, Y, B, U, and G are distinct digits. FLYFLY is the largest number satisfying 8 x FLYFLY = BUGBUG. What is FLY + BUG? (A) 1089 (B) 1098 (C) 1107 (D) 1116 (E) 1125","answer":"C","major_category":"数论","minor_category":"数字问题","tags":"位值;重复数字","key_idea":"利用 FLYFLY=1001*FLY 和 BUGBUG=1001*BUG 化简。","notes":"","detail_slug":"2024-amc-8-problem-15"},{"year":2024,"contest":"AMC 8","form":"","problem_no":16,"source":"2024 AMC 8 Problem 16","statement":"Minh places the integers 1 through 81 in a 9-by-9 grid. What is the least number of rows and columns whose product could be divisible by 3? (A) 8 (B) 9 (C) 10 (D) 11 (E) 12","answer":"D","major_category":"组合数学","minor_category":"构造","tags":"网格;覆盖;倍数","key_idea":"把 3 的倍数集中放置，比较覆盖它们所需的最少行列数。","notes":"","detail_slug":"2024-amc-8-problem-16"},{"year":2024,"contest":"AMC 8","form":"","problem_no":17,"source":"2024 AMC 8 Problem 17","statement":"A white king and a black king are placed on different squares of a 3-by-3 chessboard so that they do not attack each other. In how many ordered placements can this be done? (A) 20 (B) 24 (C) 27 (D) 28 (E) 32","answer":"E","major_category":"组合数学","minor_category":"计数","tags":"棋盘;补集计数","key_idea":"按角、边、中心位置分类统计不能相邻的第二个位置。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2024-amc-8-problem-17"},{"year":2024,"contest":"AMC 8","form":"","problem_no":18,"source":"2024 AMC 8 Problem 18","statement":"Three concentric circles have radii 1, 2, and 3. The annulus from radius 1 to 2 is shaded, and a sector of the annulus from radius 2 to 3 is shaded. If shaded and unshaded areas are equal, what is the sector angle BOC? (A) 108 (B) 120 (C) 135 (D) 144 (E) 150","answer":"A","major_category":"几何与测量","minor_category":"圆","tags":"圆环;扇形;面积","key_idea":"用圆环面积和扇形占整圆比例建立等面积关系。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2024-amc-8-problem-18"},{"year":2024,"contest":"AMC 8","form":"","problem_no":19,"source":"2024 AMC 8 Problem 19","statement":"Jordan owns 15 pairs of sneakers. Nine pairs are red, six are white, ten are high-top, and five are low-top. What is the least possible fraction of the collection that is red high-top? (A) 0 (B) 1/5 (C) 4/15 (D) 1/3 (E) 2/5","answer":"C","major_category":"组合数学","minor_category":"容斥","tags":"集合交集;最小值","key_idea":"用两类数量之和减去总数得到交集的最小值。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2024-amc-8-problem-19"},{"year":2024,"contest":"AMC 8","form":"","problem_no":20,"source":"2024 AMC 8 Problem 20","statement":"Any three vertices of cube PQRSTUVW form a triangle. How many equilateral triangles contain P? (A) 0 (B) 1 (C) 2 (D) 3 (E) 6","answer":"D","major_category":"几何与测量","minor_category":"空间几何","tags":"立方体;空间距离","key_idea":"比较从 P 到其余顶点的距离并寻找三边相等的顶点组三元组。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2024-amc-8-problem-20"},{"year":2024,"contest":"AMC 8","form":"","problem_no":21,"source":"2024 AMC 8 Problem 21","statement":"Initially green and yellow frogs were in the ratio 3:1. Then 3 green frogs moved to the sunny side and 5 yellow frogs moved to the shady side, producing ratio 4:1. What is the current difference between green and yellow frogs? (A) 10 (B) 12 (C) 16 (D) 20 (E) 24","answer":"E","major_category":"算术与数感","minor_category":"比例","tags":"比例变化;应用题","key_idea":"用初始比例参数表示两类数量并代入交换后的比例。","notes":"","detail_slug":"2024-amc-8-problem-21"},{"year":2024,"contest":"AMC 8","form":"","problem_no":22,"source":"2024 AMC 8 Problem 22","statement":"A tape roll has outer diameter 4 inches, inner diameter 2 inches, and tape thickness 0.015 inches. If completely unrolled, approximately how long is it, to the nearest 100 inches? (A) 300 (B) 600 (C) 1200 (D) 1500 (E) 1800","answer":"B","major_category":"几何与测量","minor_category":"面积","tags":"圆环;体积守恒;近似","key_idea":"令卷起胶带的截面积等于展开后长度乘厚度。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2024-amc-8-problem-22"},{"year":2024,"contest":"AMC 8","form":"","problem_no":23,"source":"2024 AMC 8 Problem 23","statement":"A segment from (0,4) to (2,0) intersects the interiors of 4 grid cells. How many grid cells have interiors intersected by the segment from (2000,3000) to (5000,8000)? (A) 6000 (B) 6500 (C) 7000 (D) 7500 (E) 8000","answer":"C","major_category":"几何与测量","minor_category":"坐标","tags":"格点线段;网格计数","key_idea":"用横跨竖线数、横线数和穿过格点的重复计数修正。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2024-amc-8-problem-23"},{"year":2024,"contest":"AMC 8","form":"","problem_no":24,"source":"2024 AMC 8 Problem 24","statement":"Two 45-45-90 mountain shapes have peak heights 8 and 12 feet and overlap. Their union area is 183 square feet. Their sides meet at height h. What is h? (A) 4 (B) 5 (C) 4sqrt(2) (D) 6 (E) 5sqrt(2)","answer":"B","major_category":"几何与测量","minor_category":"三角形","tags":"等腰直角三角形;重叠面积","key_idea":"用两座山的面积和减去重叠三角形面积。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2024-amc-8-problem-24"},{"year":2024,"contest":"AMC 8","form":"","problem_no":25,"source":"2024 AMC 8 Problem 25","statement":"An airplane has 4 rows of 3 seats. Eight passengers occupy random seats. A couple boards next. What is the probability that two adjacent seats in one row remain for them? (A) 8/15 (B) 32/55 (C) 20/33 (D) 34/55 (E) 8/11","answer":"C","major_category":"概率与统计","minor_category":"概率","tags":"随机座位;补集;计数","key_idea":"等价为随机留下四个空座时至少含一对同排相邻座，按补集计数。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 末页未呈现 A-E 选项；题面、图形与选项按 AoPS Wiki 同年题页核验","detail_slug":"2024-amc-8-problem-25"}];
const filters={major:document.querySelector("#majorFilter"),minor:document.querySelector("#minorFilter"),search:document.querySelector("#searchInput")};
const cards=document.querySelector("#cards"),resultCount=document.querySelector("#resultCount"),currentSummary=document.querySelector("#currentSummary"),clearFilters=document.querySelector("#clearFilters");
const statTotal=document.querySelector("#statTotal"),statPart1=document.querySelector("#statPart1"),statPart2=document.querySelector("#statPart2"),statPart3=document.querySelector("#statPart3");
const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
function fill(select,values,current=select.value){select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");if(values.includes(current))select.value=current;}
function refreshOptions(){const cm=filters.major.value,cn=filters.minor.value;fill(filters.major,unique(problems.map(p=>p.major_category)),cm);const minorBase=problems.filter(p=>!filters.major.value||p.major_category===filters.major.value);fill(filters.minor,unique(minorBase.map(p=>p.minor_category)),cn);}
function matches(p){const q=filters.search.value.trim().toLowerCase();const hay=[p.problem_no,p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase();return(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q));}
function syncButtons(){document.querySelectorAll("[data-filter-major]").forEach(button=>{const major=button.dataset.filterMajor||"",minor=button.dataset.filterMinor||"";const active=filters.major.value===major&&(!minor||filters.minor.value===minor);button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active));});}
function render(){
  refreshOptions();
  const shown=problems.filter(matches).sort((a,b)=>Number(a.problem_no)-Number(b.problem_no));
  const partCounts=[shown.filter(p=>Number(p.problem_no)<=10).length,shown.filter(p=>Number(p.problem_no)>=11&&Number(p.problem_no)<=20).length,shown.filter(p=>Number(p.problem_no)>=21).length];
  statTotal.textContent=shown.length;statPart1.textContent=partCounts[0];statPart2.textContent=partCounts[1];statPart3.textContent=partCounts[2];
  resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`;
  const terms=[];if(filters.major.value)terms.push(filters.major.value);if(filters.minor.value)terms.push(filters.minor.value);if(filters.search.value.trim())terms.push(`搜索“${filters.search.value.trim()}”`);
  currentSummary.textContent=`当前筛选：${terms.length?terms.join(" · "):"全部分类"}`;
  syncButtons();
  cards.innerHTML=shown.length?shown.map(p=>`<a class="card problem-link" data-source="${esc(p.source)}" href="../problems/${esc(p.detail_slug)}/index.html" aria-label="查看 ${esc(p.source)} 的详细解答"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge answer">答案 ${esc(p.answer)}</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea"><strong>核心思路：</strong>${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").filter(Boolean).map(tag=>`<span class="badge">${esc(tag)}</span>`).join(" ")}</div><span class="detail-cta">查看解答 →</span></a>`).join(""):'<div class="empty">没有匹配的题目</div>';
  window.__AMC8_STATE__={year:String(problems[0]?.year??""),major:filters.major.value,minor:filters.minor.value,query:filters.search.value.trim(),visible:shown.length,partCounts};
}
Object.values(filters).forEach(control=>control.addEventListener("input",render));
document.addEventListener("click",event=>{const action=event.target.closest("[data-filter-major]");if(!action)return;filters.major.value=action.dataset.filterMajor||"";refreshOptions();filters.minor.value=action.dataset.filterMinor||"";filters.search.value="";render();});
clearFilters.addEventListener("click",()=>{Object.values(filters).forEach(control=>control.value="");render();});
render();
</script>
