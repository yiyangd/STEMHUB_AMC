  <style>
:root {
  --bg:#f7f4ee; --panel:#fff; --ink:#1e2832; --muted:#66727f;
  --line:#d8ddd8; --blue:#2166a5; --green:#4f7d48; --amber:#c58a1d;
  --red:#b3564a; --chip:#eef3f7; --navy:#17324a;
}
* { box-sizing:border-box; }
html,body { max-width:100%; overflow-x:hidden; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif; }
header { background:var(--navy); color:#fff; padding:28px 32px 20px; }
h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; }
header p { margin:0; color:#d7e4ef; }
main { padding:24px 32px 40px; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; min-width:0; }
.stat strong { display:block; font-size:26px; }
.stat span,.muted { color:var(--muted); }
.grid { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(360px,1.2fr); gap:16px; margin-bottom:16px; }
button,select,input { font:inherit; }
button { cursor:pointer; }
.controls { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)) minmax(120px,.7fr); gap:10px; margin-bottom:14px; }
label { display:grid; gap:6px; font-size:12px; color:var(--muted); }
select,input { min-height:38px; min-width:0; border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:#fff; color:var(--ink); }
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible { outline:3px solid rgba(33,102,165,.22); outline-offset:2px; }
.clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; min-width:0; }
.problem-link { color:inherit; text-decoration:none; transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease; }
.problem-link:hover { border-color:#9ab7ce; box-shadow:0 5px 16px rgba(23,50,74,.10); transform:translateY(-1px); }
.problem-link:focus-visible { outline:3px solid #6f9fc3; outline-offset:2px; }
.detail-cta { color:var(--blue); font-weight:700; font-size:13px; }
.top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; min-width:0; }
.source { font-weight:750; margin-right:auto; }
.badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; }
.badge.major { background:#e8f0dc; color:#35592f; }
.badge.answer { background:#f5e3df; color:#863f35; font-weight:750; }
.statement,.idea { line-height:1.55; font-size:14px; white-space:pre-wrap; }
.idea { border-left:3px solid var(--blue); padding-left:10px; color:#33414e; font-size:13px; }
.source,.statement,.idea,.badge,.muted { overflow-wrap:anywhere; word-break:break-word; }
.empty { border:1px dashed var(--line); border-radius:8px; padding:24px; color:var(--muted); text-align:center; background:#fff; }
.home-link { display:inline-block; margin-bottom:10px; color:#fff; text-underline-offset:3px; }
.summary { margin:2px 0 6px; color:#33414e; }
@media (max-width:980px) {
  main { padding:18px; }
  header { padding:24px 18px 18px; }
  .stats,.grid,.controls,.compare-head,.bar-row { grid-template-columns:1fr; }
  .compare-head { display:none; }
  .bar-row [data-label]::before { content:attr(data-label); display:block; margin-bottom:4px; color:var(--muted); font-size:11px; font-weight:600; }
}
@media (max-width:480px) {
  main { padding:14px 10px 28px; }
  header { padding:20px 12px 16px; }
  h1 { font-size:25px; }
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .stat,.panel { padding:13px; }
  .cards { grid-template-columns:minmax(0,1fr); }
}

.grid { grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr); }
.controls { grid-template-columns:repeat(3,minmax(130px,1fr)) minmax(120px,.7fr); }
.bar-row { width:100%; display:grid; grid-template-columns:minmax(110px,.7fr) minmax(140px,1fr) 60px; gap:10px; align-items:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:7px; margin:7px 0; text-align:left; }
.bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
.track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; }
.track span { display:block; height:100%; background:var(--blue); }
.quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:8px; }
.quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; min-width:0; }
.year-nav { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:10px; }
@media (max-width:980px) {
  .grid,.controls,.bar-row { grid-template-columns:minmax(0,1fr); }
}
</style>

<script>
const problems=[{"year":2023,"contest":"AMC 8","form":"","problem_no":1,"source":"2023 AMC 8 Problem 1","statement":"What is the value of (8 × 4 + 2) - (8 + 4 × 2)? (A) 0 (B) 6 (C) 10 (D) 18 (E) 24","answer":"D","major_category":"算术与数感","minor_category":"四则运算","tags":"四则运算;AMC 8","key_idea":"按运算顺序化简数值表达式，并用选项回代核对。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-1"},{"year":2023,"contest":"AMC 8","form":"","problem_no":2,"source":"2023 AMC 8 Problem 2","statement":"A square piece of paper is folded twice into four equal quarters, as shown below, then cut along the dashed line. When unfolded, the paper will match which of the following figures? [图形] (A) 图形选项 A (B) 图形选项 B (C) 图形选项 C (D) 图形选项 D (E) 图形选项 E","answer":"E","major_category":"几何与测量","minor_category":"图形变换","tags":"图形变换;正方形","key_idea":"逐步追踪反射、折叠、旋转后的对应位置。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；A-E 为图形选项；文本保留选项标签，具体图形见原题 PDF 或 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-2"},{"year":2023,"contest":"AMC 8","form":"","problem_no":3,"source":"2023 AMC 8 Problem 3","statement":"Wind chill is a measure of how cold people feel when exposed to wind outside. A good estimate for wind chill can be found using this calculation (wind chill) = (air temperature) - 0.7 × (wind speed), where temperature is measured in degrees Fahrenheit (°F) and the wind speed is measured in miles per hour (mph). Suppose the air temperature is 36°F and the wind speed is 18 mph. Which of the following is closest to the approximate wind chill? (A) 18 (B) 23 (C) 28 (D) 32 (E) 35","answer":"B","major_category":"算术与数感","minor_category":"应用题","tags":"应用题;速度","key_idea":"提取数量、速度、时间或费用关系并分步计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-3"},{"year":2023,"contest":"AMC 8","form":"","problem_no":4,"source":"2023 AMC 8 Problem 4","statement":"The numbers from 1 to 49 are arranged in a spiral pattern on a square grid, beginning at the center. The first few numbers have been entered into the grid below. Consider the four numbers that will appear in the shaded squares, on the same diagonal as the number 7. How many of these four numbers are prime? [图形] (A) 0 (B) 1 (C) 2 (D) 3 (E) 4","answer":"D","major_category":"数论","minor_category":"质数","tags":"质数;正方形;网格;排列","key_idea":"用质数定义和质因数分解排除合数情形。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-4"},{"year":2023,"contest":"AMC 8","form":"","problem_no":5,"source":"2023 AMC 8 Problem 5","statement":"A lake contains 250 trout, along with a variety of other fish. When a marine biologist catches and releases a sample of 180 fish from the lake, 30 are identified as trout. Assume that the ratio of trout to the total number of fish is the same in both the sample and the lake. How many fish are there in the lake? (A) 1250 (B) 1500 (C) 1750 (D) 1800 (E) 2000","answer":"B","major_category":"算术与数感","minor_category":"比例","tags":"比例;AMC 8","key_idea":"设共同份数或比例参数，将各数量写成同一参数的倍数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-5"},{"year":2023,"contest":"AMC 8","form":"","problem_no":6,"source":"2023 AMC 8 Problem 6","statement":"The digits 2, 0, 2, and 3 are placed in the expression □^□ × □^□, one digit per box. What is the maximum possible value of the expression? [图形] (A) 0 (B) 8 (C) 9 (D) 16 (E) 18","answer":"C","major_category":"代数","minor_category":"表达式","tags":"表达式;数字","key_idea":"按定义代入并利用代数结构化简表达式。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-6"},{"year":2023,"contest":"AMC 8","form":"","problem_no":7,"source":"2023 AMC 8 Problem 7","statement":"A rectangle, with sides parallel to the x -axis and y -axis, has opposite vertices located at (15, 3) and (16, 5). A line is drawn through points A(0, 0) and B(3, 1). Another line is drawn through points C(0, 10) and D(2, 9). How many points on the rectangle lie on at least one of the two lines? [图形] (A) 0 (B) 1 (C) 2 (D) 3 (E) 4","answer":"B","major_category":"几何与测量","minor_category":"坐标","tags":"坐标;矩形","key_idea":"把图形条件转成坐标差、斜率、距离或面积。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-7"},{"year":2023,"contest":"AMC 8","form":"","problem_no":8,"source":"2023 AMC 8 Problem 8","statement":"Lola, Lolo, Tiya, and Tiyo participated in a ping pong tournament. Each player competed against each of the other three players exactly twice. Shown below are the win-loss records for the players. The numbers 1 and 0 represent a win or loss, respectively. For example, Lola won five matches and lost the fourth match. What was Tiyo’s win-loss record? c | c Player Result Lola 111011 Lolo 101010 Tiya 010100 Tiyo?????? (A) 000101 (B) 001001 (C) 010000 (D) 010101 (E) 011000","answer":"A","major_category":"概率与统计","minor_category":"图表与数据","tags":"图表与数据;AMC 8","key_idea":"准确读取图表或数据结构，再计算所求统计量。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-8"},{"year":2023,"contest":"AMC 8","form":"","problem_no":9,"source":"2023 AMC 8 Problem 9","statement":"Malaika is skiing on a mountain. The graph below shows her elevation, in meters, above the base of the mountain as she skis along a trail. In total, how many seconds does she spend at an elevation between 4 and 7 meters? [图形] (A) 6 (B) 8 (C) 10 (D) 12 (E) 14","answer":"B","major_category":"概率与统计","minor_category":"图表与数据","tags":"图表与数据;图表","key_idea":"准确读取图表或数据结构，再计算所求统计量。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-9"},{"year":2023,"contest":"AMC 8","form":"","problem_no":10,"source":"2023 AMC 8 Problem 10","statement":"Harold made a plum pie to take on a picnic. He was able to eat only (1)/(4) of the pie, and he left the rest for his friends. A moose came by and ate (1)/(3) of what Harold left behind. After that, a porcupine ate (1)/(3) of what the moose left behind. How much of the original pie still remained after the porcupine left? (A) (1)/(12) (B) (1)/(6) (C) (1)/(4) (D) (1)/(3) (E) (5)/(12)","answer":"D","major_category":"算术与数感","minor_category":"分数与小数","tags":"分数与小数;AMC 8","key_idea":"统一分数或小数表示后约分、比较或计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-10"},{"year":2023,"contest":"AMC 8","form":"","problem_no":11,"source":"2023 AMC 8 Problem 11","statement":"NASA’s Perseverance Rover was launched on July 30, 2020. After traveling 292,526,838 miles, it landed on Mars in Jezero Crater about 6.5 months later. Which of the following is closest to the Rover’s average interplanetary speed in miles per hour? (A) 6,000 (B) 12,000 (C) 60,000 (D) 120,000 (E) 600,000","answer":"C","major_category":"算术与数感","minor_category":"估算与取整","tags":"估算与取整;平均数;速度","key_idea":"先控制数量级，再按题意选择最接近值或取整。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-11"},{"year":2023,"contest":"AMC 8","form":"","problem_no":12,"source":"2023 AMC 8 Problem 12","statement":"The figure below shows a large white circle with a number of smaller white and shaded circles in its interior. What fraction of the interior of the large white circle is shaded? [图形] (A) (1)/(4) (B) (11)/(36) (C) (1)/(3) (D) (19)/(36) (E) (5)/(9)","answer":"B","major_category":"几何与测量","minor_category":"圆","tags":"圆;AMC 8","key_idea":"利用半径、弧、扇形或圆与多边形的面积关系。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-12"},{"year":2023,"contest":"AMC 8","form":"","problem_no":13,"source":"2023 AMC 8 Problem 13","statement":"Along the route of a bicycle race, 7 water stations are evenly spaced between the start and finish lines, as shown in the figure below. There are also 2 repair stations evenly spaced between the start and finish lines. The 3 rd water station is located 2 miles after the 1 st repair station. How long is the race in miles? [图形] (A) 8 (B) 16 (C) 24 (D) 48 (E) 96","answer":"D","major_category":"几何与测量","minor_category":"路径与距离","tags":"路径与距离;AMC 8","key_idea":"把路线分段并比较或累加各段距离。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-13"},{"year":2023,"contest":"AMC 8","form":"","problem_no":14,"source":"2023 AMC 8 Problem 14","statement":"Nicolas is planning to send a package to his friend Anton, who is a stamp collector. To pay for the postage, Nicolas would like to cover the package with a large number of stamps. Suppose he has a collection of 5 -cent, 10 -cent, and 25 -cent stamps, with exactly 20 of each type. What is the greatest number of stamps Nicolas can use to make exactly 7.10 in postage? (Note: The amount 7.10 corresponds to 7 dollars and 10 cents. One dollar is worth 100 cents.) (A) 45 (B) 46 (C) 51 (D) 54 (E) 55","answer":"E","major_category":"组合数学","minor_category":"构造","tags":"构造;AMC 8","key_idea":"先找必要限制，再构造达到限制的可行方案。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-14"},{"year":2023,"contest":"AMC 8","form":"","problem_no":15,"source":"2023 AMC 8 Problem 15","statement":"Viswam walks half a mile to get to school each day. His route consists of 10 city blocks of equal length and he takes 1 minute to walk each block. Today, after walking 5 blocks, Viswam discovers he has to make a detour, walking 3 blocks of equal length instead of 1 block to reach the next corner. From the time he starts his detour, at what speed, in mph, must he walk, in order to get to school at his usual time? [图形] (A) 4 (B) 4.2 (C) 4.5 (D) 4.8 (E) 5","answer":"B","major_category":"算术与数感","minor_category":"应用题","tags":"应用题;速度","key_idea":"提取数量、速度、时间或费用关系并分步计算。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-15"},{"year":2023,"contest":"AMC 8","form":"","problem_no":16,"source":"2023 AMC 8 Problem 16","statement":"The letters P, Q, and R are entered into a 20×20 table according to the pattern shown below. How many P s, Q s, and R s will appear in the completed table? [图形] (A) 132 Ps, 134 Qs, 134 Rs (B) 133 Ps, 133 Qs, 134 Rs (C) 133 Ps, 134 Qs, 133 Rs (D) 134 Ps, 132 Qs, 134 Rs (E) 134 Ps, 133 Qs, 133 Rs","answer":"C","major_category":"代数","minor_category":"模式规律","tags":"模式规律;AMC 8","key_idea":"从重复或递推结构中确定周期和增长规律。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-16"},{"year":2023,"contest":"AMC 8","form":"","problem_no":17,"source":"2023 AMC 8 Problem 17","statement":"A regular octahedron has eight equilateral triangle faces with four faces meeting at each vertex. Jun will make the regular octahedron shown on the right by folding the piece of paper shown on the left. Which numbered face will end up to the right of Q? [图形] (A) 1 (B) 2 (C) 3 (D) 4 (E) 5","answer":"A","major_category":"几何与测量","minor_category":"空间几何","tags":"空间几何;三角形","key_idea":"根据立体的面、棱、截面或展开图分析空间关系。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-17"},{"year":2023,"contest":"AMC 8","form":"","problem_no":18,"source":"2023 AMC 8 Problem 18","statement":"Greta Grasshopper sits on a long line of lily pads in a pond. From any lily pad, Greta can jump 5 pads to the right or 3 pads to the left. What is the fewest number of jumps Greta must make to reach the lily pad located 2023 pads to the right of her starting point? (A) 405 (B) 407 (C) 409 (D) 411 (E) 413","answer":"D","major_category":"代数","minor_category":"方程","tags":"方程;AMC 8","key_idea":"设未知数，把题目条件翻译成方程并筛选符合条件的解。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-18"},{"year":2023,"contest":"AMC 8","form":"","problem_no":19,"source":"2023 AMC 8 Problem 19","statement":"An equilateral triangle is placed inside a larger equilateral triangle so that the region between them can be divided into three congruent trapezoids, as shown below. The side length of the inner triangle is 23 the side length of the larger triangle. What is the ratio of the area of one trapezoid to the area of the inner triangle? [图形] (A) 1: 3 (B) 3: 8 (C) 5: 12 (D) 7: 16 (E) 4: 9","answer":"C","major_category":"几何与测量","minor_category":"三角形","tags":"三角形;比例;面积","key_idea":"利用三角形的边、角、相似或面积关系求解。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-19"},{"year":2023,"contest":"AMC 8","form":"","problem_no":20,"source":"2023 AMC 8 Problem 20","statement":"Two integers are inserted into the list 3,3,8,11,28 to double its range. The mode and median remain unchanged. What is the maximum possible sum of the two additional numbers? (A) 56 (B) 57 (C) 58 (D) 60 (E) 61","answer":"D","major_category":"概率与统计","minor_category":"中位数","tags":"中位数;AMC 8","key_idea":"先排序并确定中间位置，再结合其他统计量约束。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-20"},{"year":2023,"contest":"AMC 8","form":"","problem_no":21,"source":"2023 AMC 8 Problem 21","statement":"Alina writes the numbers 1, 2,..., 9 on separate cards, one number per card. She wishes to divide the cards into 3 groups of 3 cards so that the sum of the numbers in each group will be the same. In how many ways can this be done? (A) 0 (B) 1 (C) 2 (D) 3 (E) 4","answer":"C","major_category":"组合数学","minor_category":"计数","tags":"计数;AMC 8","key_idea":"建立不重不漏的分类或递推计数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-21"},{"year":2023,"contest":"AMC 8","form":"","problem_no":22,"source":"2023 AMC 8 Problem 22","statement":"In a sequence of positive integers, each term after the second is the product of the previous two terms. The sixth term is 4000. What is the first term? (A) 1 (B) 2 (C) 4 (D) 5 (E) 10","answer":"D","major_category":"代数","minor_category":"数列","tags":"数列;AMC 8","key_idea":"识别相邻项或项号之间的规律，再求指定项或总和。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-22"},{"year":2023,"contest":"AMC 8","form":"","problem_no":23,"source":"2023 AMC 8 Problem 23","statement":"Each square in a 3 × 3 grid is randomly filled with one of the 4 gray and white tiles shown below on the right. [图形] What is the probability that the tiling will contain a large gray diamond in one of the smaller 2 × 2 grids? Below is an example of such tiling. [图形] (A) (1)/(1024) (B) (1)/(256) (C) (1)/(64) (D) (1)/(16) (E) (1)/(4)","answer":"C","major_category":"概率与统计","minor_category":"概率","tags":"概率;正方形;网格","key_idea":"确定等可能样本空间，计数有利结果并求比值。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-23"},{"year":2023,"contest":"AMC 8","form":"","problem_no":24,"source":"2023 AMC 8 Problem 24","statement":"Isosceles triangle ABC has equal side lengths AB and BC. In the figures below, segments are drawn parallel to AC so that the shaded portions of triangle ABC have the same area. The heights of the two unshaded portions are 11 and 5 units, respectively. What is the height h of triangle ABC? [图形] (A) 14.6 (B) 14.8 (C) 15 (D) 15.2 (E) 15.4","answer":"A","major_category":"几何与测量","minor_category":"三角形","tags":"三角形;面积","key_idea":"利用三角形的边、角、相似或面积关系求解。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-24"},{"year":2023,"contest":"AMC 8","form":"","problem_no":25,"source":"2023 AMC 8 Problem 25","statement":"Fifteen integers a_1, a_2, a_3,..., a_15 are arranged in order on a number line. The integers are equally spaced and have the property that 1 ≤ a_1 ≤ 10, 13 ≤ a_2 ≤ 20, and 241 ≤ a_15≤ 250. What is the sum of digits of a_14? (A) 8 (B) 9 (C) 10 (D) 11 (E) 12","answer":"A","major_category":"代数","minor_category":"数列","tags":"数列;数字;排列","key_idea":"识别相邻项或项号之间的规律，再求指定项或总和。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2023-amc-8-problem-25"}];
const filters={major:document.querySelector("#majorFilter"),minor:document.querySelector("#minorFilter"),search:document.querySelector("#searchInput")};
const cards=document.querySelector("#cards"),resultCount=document.querySelector("#resultCount"),currentSummary=document.querySelector("#currentSummary"),clearFilters=document.querySelector("#clearFilters");
const statTotal=document.querySelector("#statTotal"),statPart1=document.querySelector("#statPart1"),statPart2=document.querySelector("#statPart2"),statPart3=document.querySelector("#statPart3");
const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
function fill(select,values,current=select.value){select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");if(values.includes(current))select.value=current;}
function refreshOptions(){const cm=filters.major.value,cn=filters.minor.value;fill(filters.major,unique(problems.map(p=>p.major_category)),cm);const minorBase=problems.filter(p=>!filters.major.value||p.major_category===filters.major.value);fill(filters.minor,unique(minorBase.map(p=>p.minor_category)),cn);}
function matches(p){const q=filters.search.value.trim().toLowerCase();const hay=[p.problem_no,p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase();return(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q));}
function syncButtons(){document.querySelectorAll("[data-filter-major]").forEach(button=>{const major=button.dataset.filterMajor||"",minor=button.dataset.filterMinor||"";const active=filters.major.value===major&&(!minor||filters.minor.value===minor);button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active));});}
function render(){
  refreshOptions();
  const shown=problems.filter(matches).sort((a,b)=>Number(a.problem_no)-Number(b.problem_no));
  const partCounts=[shown.filter(p=>Number(p.problem_no)<=10).length,shown.filter(p=>Number(p.problem_no)>=11&&Number(p.problem_no)<=20).length,shown.filter(p=>Number(p.problem_no)>=21).length];
  statTotal.textContent=shown.length;statPart1.textContent=partCounts[0];statPart2.textContent=partCounts[1];statPart3.textContent=partCounts[2];
  resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`;
  const terms=[];if(filters.major.value)terms.push(filters.major.value);if(filters.minor.value)terms.push(filters.minor.value);if(filters.search.value.trim())terms.push(`搜索“${filters.search.value.trim()}”`);
  currentSummary.textContent=`当前筛选：${terms.length?terms.join(" · "):"全部分类"}`;
  syncButtons();
  cards.innerHTML=shown.length?shown.map(p=>`<a class="card problem-link" data-source="${esc(p.source)}" href="../problems/${esc(p.detail_slug)}/index.html" aria-label="查看 ${esc(p.source)} 的详细解答"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge answer">答案 ${esc(p.answer)}</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea"><strong>核心思路：</strong>${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").filter(Boolean).map(tag=>`<span class="badge">${esc(tag)}</span>`).join(" ")}</div><span class="detail-cta">查看解答 →</span></a>`).join(""):'<div class="empty">没有匹配的题目</div>';
  window.__AMC8_STATE__={year:String(problems[0]?.year??""),major:filters.major.value,minor:filters.minor.value,query:filters.search.value.trim(),visible:shown.length,partCounts};
}
Object.values(filters).forEach(control=>control.addEventListener("input",render));
document.addEventListener("click",event=>{const action=event.target.closest("[data-filter-major]");if(!action)return;filters.major.value=action.dataset.filterMajor||"";refreshOptions();filters.minor.value=action.dataset.filterMinor||"";filters.search.value="";render();});
clearFilters.addEventListener("click",()=>{Object.values(filters).forEach(control=>control.value="");render();});
render();
</script>
