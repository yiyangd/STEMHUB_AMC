  <style>
:root {
  --bg:#f7f4ee; --panel:#fff; --ink:#1e2832; --muted:#66727f;
  --line:#d8ddd8; --blue:#2166a5; --green:#4f7d48; --amber:#c58a1d;
  --red:#b3564a; --chip:#eef3f7; --navy:#17324a;
}
* { box-sizing:border-box; }
html,body { max-width:100%; overflow-x:hidden; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif; }
header { background:var(--navy); color:#fff; padding:28px 32px 20px; }
h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; }
header p { margin:0; color:#d7e4ef; }
main { padding:24px 32px 40px; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; min-width:0; }
.stat strong { display:block; font-size:26px; }
.stat span,.muted { color:var(--muted); }
.grid { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(360px,1.2fr); gap:16px; margin-bottom:16px; }
button,select,input { font:inherit; }
button { cursor:pointer; }
.controls { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)) minmax(120px,.7fr); gap:10px; margin-bottom:14px; }
label { display:grid; gap:6px; font-size:12px; color:var(--muted); }
select,input { min-height:38px; min-width:0; border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:#fff; color:var(--ink); }
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible { outline:3px solid rgba(33,102,165,.22); outline-offset:2px; }
.clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; min-width:0; }
.problem-link { color:inherit; text-decoration:none; transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease; }
.problem-link:hover { border-color:#9ab7ce; box-shadow:0 5px 16px rgba(23,50,74,.10); transform:translateY(-1px); }
.problem-link:focus-visible { outline:3px solid #6f9fc3; outline-offset:2px; }
.detail-cta { color:var(--blue); font-weight:700; font-size:13px; }
.top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; min-width:0; }
.source { font-weight:750; margin-right:auto; }
.badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; }
.badge.major { background:#e8f0dc; color:#35592f; }
.badge.answer { background:#f5e3df; color:#863f35; font-weight:750; }
.statement,.idea { line-height:1.55; font-size:14px; white-space:pre-wrap; }
.idea { border-left:3px solid var(--blue); padding-left:10px; color:#33414e; font-size:13px; }
.source,.statement,.idea,.badge,.muted { overflow-wrap:anywhere; word-break:break-word; }
.empty { border:1px dashed var(--line); border-radius:8px; padding:24px; color:var(--muted); text-align:center; background:#fff; }
.home-link { display:inline-block; margin-bottom:10px; color:#fff; text-underline-offset:3px; }
.summary { margin:2px 0 6px; color:#33414e; }
@media (max-width:980px) {
  main { padding:18px; }
  header { padding:24px 18px 18px; }
  .stats,.grid,.controls,.compare-head,.bar-row { grid-template-columns:1fr; }
  .compare-head { display:none; }
  .bar-row [data-label]::before { content:attr(data-label); display:block; margin-bottom:4px; color:var(--muted); font-size:11px; font-weight:600; }
}
@media (max-width:480px) {
  main { padding:14px 10px 28px; }
  header { padding:20px 12px 16px; }
  h1 { font-size:25px; }
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .stat,.panel { padding:13px; }
  .cards { grid-template-columns:minmax(0,1fr); }
}

.grid { grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr); }
.controls { grid-template-columns:repeat(3,minmax(130px,1fr)) minmax(120px,.7fr); }
.bar-row { width:100%; display:grid; grid-template-columns:minmax(110px,.7fr) minmax(140px,1fr) 60px; gap:10px; align-items:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:7px; margin:7px 0; text-align:left; }
.bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
.track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; }
.track span { display:block; height:100%; background:var(--blue); }
.quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:8px; }
.quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; min-width:0; }
.year-nav { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:10px; }
@media (max-width:980px) {
  .grid,.controls,.bar-row { grid-template-columns:minmax(0,1fr); }
}
</style>

<script>
const problems=[{"year":2019,"contest":"AMC 8","form":"","problem_no":1,"source":"2019 AMC 8 Problem 1","statement":"Ike and Mike go into a sandwich shop with a total of 30.00 to spend. Sandwiches cost 4.50 each and soft drinks cost 1.00 each. Ike and Mike plan to buy as many sandwiches as they can, and use any remaining money to buy soft drinks. Counting both sandwiches and soft drinks, how many items will they buy? (A) 6 (B) 7 (C) 8 (D) 9 (E) 10","answer":"D","major_category":"算术与数感","minor_category":"应用题","tags":"应用题;AMC 8","key_idea":"提取数量、速度、时间或费用关系并分步计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-1"},{"year":2019,"contest":"AMC 8","form":"","problem_no":2,"source":"2019 AMC 8 Problem 2","statement":"Three identical rectangles are put together to form rectangle ABCD, as shown in the figure below. Given that the length of the shorter side of each of the rectangles is 5 feet, what is the area in square feet of rectangle ABCD? [图形] (A) 45 (B) 75 (C) 100 (D) 125 (E) 150","answer":"E","major_category":"几何与测量","minor_category":"面积","tags":"面积;正方形;矩形","key_idea":"分割、补形或作差，将目标区域化为基本图形面积。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-2"},{"year":2019,"contest":"AMC 8","form":"","problem_no":3,"source":"2019 AMC 8 Problem 3","statement":"Which of the following is the correct order of the fractions (15)/(11),(19)/(15), and (17)/(13), from least to greatest? (A) (15)/(11)< (17)/(13)< (19)/(15) (B) (15)/(11)< (19)/(15)<(17)/(13) (C) (17)/(13)<(19)/(15)<(15)/(11) (D) (19)/(15)<(15)/(11)<(17)/(13) (E) (19)/(15)<(17)/(13)<(15)/(11)","answer":"E","major_category":"算术与数感","minor_category":"分数与小数","tags":"分数与小数;AMC 8","key_idea":"统一分数或小数表示后约分、比较或计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-3"},{"year":2019,"contest":"AMC 8","form":"","problem_no":4,"source":"2019 AMC 8 Problem 4","statement":"Quadrilateral ABCD is a rhombus with perimeter 52 meters. The length of diagonal AC is 24 meters. What is the area in square meters of rhombus ABCD? [图形] (A) 60 (B) 90 (C) 105 (D) 120 (E) 144","answer":"D","major_category":"几何与测量","minor_category":"四边形","tags":"四边形;正方形;面积","key_idea":"利用特殊四边形的边、对角线和面积性质。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-4"},{"year":2019,"contest":"AMC 8","form":"","problem_no":5,"source":"2019 AMC 8 Problem 5","statement":"A tortoise challenges a hare to a race. The hare eagerly agrees and quickly runs ahead, leaving the slow-moving tortoise behind, believing that he will win, the hare stops to take a nap. Meanwhile, the tortoise walks at a slow, steady pace for the entire race. The hare wakes up and runs to the finish line, only to find the tortoise already there. Which of the following graphs matches the description of the race, showing the distance d traveled by the two animals over time t from start to finish? (A) 图形选项 A (B) 图形选项 B (C) 图形选项 C (D) 图形选项 D (E) 图形选项 E","answer":"B","major_category":"概率与统计","minor_category":"图表与数据","tags":"图表与数据;图表","key_idea":"准确读取图表或数据结构，再计算所求统计量。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；A-E 为图形选项；文本保留选项标签，具体图形见原题 PDF 或 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-5"},{"year":2019,"contest":"AMC 8","form":"","problem_no":6,"source":"2019 AMC 8 Problem 6","statement":"There are 81 grid points (uniformly spaced) in the square shown in the diagram below, including the points on the edges. Point P is in the center of the square. Given that point Q is randomly chosen among the other 80 points, what is the probability that the line PQ is a line of symmetry for the square? [图形] (A) (1)/(5) (B) (1)/(4) (C) (2)/(5) (D) (9)/(20) (E) (1)/(2)","answer":"C","major_category":"概率与统计","minor_category":"概率","tags":"概率;正方形;网格","key_idea":"确定等可能样本空间，计数有利结果并求比值。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-6"},{"year":2019,"contest":"AMC 8","form":"","problem_no":7,"source":"2019 AMC 8 Problem 7","statement":"Shauna takes five tests, each worth a maximum of 100 points. Her scores on the first three tests are 76, 94, and 87. In order to average 81 for all five tests, what is the lowest score she could earn on one of the other two tests? (A) 48 (B) 52 (C) 66 (D) 70 (E) 74","answer":"A","major_category":"概率与统计","minor_category":"平均数","tags":"平均数;AMC 8","key_idea":"利用总和等于平均数乘数据个数建立关系。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-7"},{"year":2019,"contest":"AMC 8","form":"","problem_no":8,"source":"2019 AMC 8 Problem 8","statement":"Gilda has a bag of marbles. She gives 20% of them to her friend Pedro. Then Gilda gives 10% of what is left to another friend, Ebony. Finally, Gilda gives 25% of what is now left in the bag to her brother Jimmy. What percentage of her original bag of marbles does Gilda have left for herself? (A) 20 (B) 33(1)/(3) (C) 38 (D) 45 (E) 54","answer":"E","major_category":"算术与数感","minor_category":"百分比","tags":"百分比;AMC 8","key_idea":"把百分比转成乘法关系，追踪基准量的变化。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-8"},{"year":2019,"contest":"AMC 8","form":"","problem_no":9,"source":"2019 AMC 8 Problem 9","statement":"Alex and Felicia each have cats as pets. Alex buys cat food in cylindrical cans that are 6 cm in diameter and 12 cm high. Felicia buys cat food in cylindrical cans that are 12 cm in diameter and 6 cm high. What is the ratio of the volume of one of Alex's cans to the volume one of Felicia's cans? (A) 1:4 (B) 1:2 (C) 1:1 (D) 2:1 (E) 4:1","answer":"B","major_category":"几何与测量","minor_category":"体积","tags":"体积;比例","key_idea":"确定底面积和高，或比较相似立体的体积。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-9"},{"year":2019,"contest":"AMC 8","form":"","problem_no":10,"source":"2019 AMC 8 Problem 10","statement":"The diagram shows the number of students at soccer practice each weekday during last week. After computing the mean and median values, Coach discovers that there were actually 21 participants on Wednesday. Which of the following statements describes the change in the mean and median after the correction is made? [图形] (A) The mean increases by 1 and the median does not change (B) The mean increases by 1 and the median increases by 1 (C) The mean increases by 1 and the median increases by 5 (D) The mean increases by 5 and the median increases by 1 (E) The mean increases by 5 and the median increases by 5","answer":"B","major_category":"概率与统计","minor_category":"图表与数据","tags":"图表与数据;中位数","key_idea":"准确读取图表或数据结构，再计算所求统计量。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-10"},{"year":2019,"contest":"AMC 8","form":"","problem_no":11,"source":"2019 AMC 8 Problem 11","statement":"The eighth grade class at Lincoln Middle School has 93 students. Each student takes a math class, a foreign language class, or both. There are 70 eighth graders taking a math class, and there are 54 eighth graders taking a foreign language class. How many eighth graders take only a math class and not a foreign language class? (A) 16 (B) 23 (C) 31 (D) 39 (E) 70","answer":"D","major_category":"组合数学","minor_category":"容斥","tags":"容斥;AMC 8","key_idea":"用总数减重复或用集合交并关系计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-11"},{"year":2019,"contest":"AMC 8","form":"","problem_no":12,"source":"2019 AMC 8 Problem 12","statement":"The faces of a cube are painted in six different colors: red (R), white (W), green (G), brown [B], aqua [A], and purple (P). Three views of the cube are shown below. What is the color of the face opposite the aqua face? [图形] (A) red (B) white (C) green (D) brown (E) purple","answer":"A","major_category":"几何与测量","minor_category":"空间几何","tags":"空间几何;立方体","key_idea":"根据立体的面、棱、截面或展开图分析空间关系。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-12"},{"year":2019,"contest":"AMC 8","form":"","problem_no":13,"source":"2019 AMC 8 Problem 13","statement":"A palindrome is a number that has the same value when read from left to right or from right to left. (For example, 12321 is a palindrome.) Let N be the least three-digit integer which is not a palindrome but which is the sum of three distinct two-digit palindromes. What is the sum of the digits of N? (A) 2 (B) 3 (C) 4 (D) 5 (E) 6","answer":"A","major_category":"数论","minor_category":"数字问题","tags":"数字问题;数字","key_idea":"按位值、数字和或末位条件分析整数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-13"},{"year":2019,"contest":"AMC 8","form":"","problem_no":14,"source":"2019 AMC 8 Problem 14","statement":"Isabella has 6 coupons that can be redeemed for free ice cream cones at Pete's Sweet Treats. In order to make the coupons last, she decides that she will redeem one every 10 days until she has used them all. She knows that Pete's is closed on Sundays, but as she circles the 6 dates on her calendar, she realizes that no circled date falls on a Sunday. On what day of the week does Isabella redeem her first coupon? (A) Monday (B) Tuesday (C) Wednesday (D) Thursday (E) Friday","answer":"C","major_category":"数论","minor_category":"余数","tags":"余数;圆","key_idea":"在适当模数下计算并利用余数周期。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-14"},{"year":2019,"contest":"AMC 8","form":"","problem_no":15,"source":"2019 AMC 8 Problem 15","statement":"On a beach, 50 people are wearing sunglasses and 35 people are wearing caps. Some people are wearing both sunglasses and caps. If one of the people wearing a cap is selected at random, the probability that this person is also wearing sunglasses is (2)/(5). If instead, someone wearing sunglasses is selected at random, what is the probability that this person is also wearing a cap? (A) (14)/(85) (B) (7)/(25) (C) (2)/(5) (D) (4)/(7) (E) (7)/(10)","answer":"B","major_category":"概率与统计","minor_category":"概率","tags":"概率;AMC 8","key_idea":"确定等可能样本空间，计数有利结果并求比值。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-15"},{"year":2019,"contest":"AMC 8","form":"","problem_no":16,"source":"2019 AMC 8 Problem 16","statement":"Qiang drives 15 miles at an average speed of 30 miles per hour. How many additional miles will he have to drive at 55 miles per hour to average 50 miles per hour for the entire trip? (A) 45 (B) 62 (C) 90 (D) 110 (E) 135","answer":"D","major_category":"代数","minor_category":"方程","tags":"方程;平均数;速度","key_idea":"设未知数，把题目条件翻译成方程并筛选符合条件的解。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-16"},{"year":2019,"contest":"AMC 8","form":"","problem_no":17,"source":"2019 AMC 8 Problem 17","statement":"What is the value of the product ((1·3)/(2·2))((2·4)/(3·3))((3·5)/(4·4))...((97·99)/(98·98))((98·100)/(99·99))? (A) (1)/(2) (B) (50)/(99) (C) (9800)/(9801) (D) (100)/(99) (E) 50","answer":"B","major_category":"算术与数感","minor_category":"分数与小数","tags":"分数与小数;AMC 8","key_idea":"统一分数或小数表示后约分、比较或计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-17"},{"year":2019,"contest":"AMC 8","form":"","problem_no":18,"source":"2019 AMC 8 Problem 18","statement":"The faces of each of two fair dice are numbered 1, 2, 3, 5, 7, and 8. When the two dice are tossed, what is the probability that their sum will be an even number? (A) (4)/(9) (B) (1)/(2) (C) (5)/(9) (D) (3)/(5) (E) (2)/(3)","answer":"C","major_category":"概率与统计","minor_category":"概率","tags":"概率;AMC 8","key_idea":"确定等可能样本空间，计数有利结果并求比值。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-18"},{"year":2019,"contest":"AMC 8","form":"","problem_no":19,"source":"2019 AMC 8 Problem 19","statement":"In a tournament there are six teams that play each other twice. A team earns 3 points for a win, 1 point for a draw, and 0 points for a loss. After all the games have been played it turns out that the top three teams earned the same number of total points. What is the greatest possible number of total points for each of the top three teams? (A) 22 (B) 23 (C) 24 (D) 26 (E) 30","answer":"C","major_category":"组合数学","minor_category":"分类讨论","tags":"分类讨论;AMC 8","key_idea":"按互斥情形拆分条件，分别求解后合并。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-19"},{"year":2019,"contest":"AMC 8","form":"","problem_no":20,"source":"2019 AMC 8 Problem 20","statement":"How many different real numbers x satisfy the equation (x^2-5)^2=16? (A) 0 (B) 1 (C) 2 (D) 4 (E) 8","answer":"D","major_category":"代数","minor_category":"方程","tags":"方程;AMC 8","key_idea":"设未知数，把题目条件翻译成方程并筛选符合条件的解。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-20"},{"year":2019,"contest":"AMC 8","form":"","problem_no":21,"source":"2019 AMC 8 Problem 21","statement":"What is the area of the triangle formed by the lines y=5, y=1+x, and y=1-x? (A) 4 (B) 8 (C) 10 (D) 12 (E) 16","answer":"E","major_category":"几何与测量","minor_category":"坐标","tags":"坐标;三角形;面积","key_idea":"把图形条件转成坐标差、斜率、距离或面积。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-21"},{"year":2019,"contest":"AMC 8","form":"","problem_no":22,"source":"2019 AMC 8 Problem 22","statement":"A store increased the original price of a shirt by a certain percent and then decreased the new price by the same percent. Given that the resulting price was 84% of the original price, by what percent was the price increased and decreased? (A) 16 (B) 20 (C) 28 (D) 36 (E) 40","answer":"E","major_category":"算术与数感","minor_category":"百分比","tags":"百分比;AMC 8","key_idea":"把百分比转成乘法关系，追踪基准量的变化。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-22"},{"year":2019,"contest":"AMC 8","form":"","problem_no":23,"source":"2019 AMC 8 Problem 23","statement":"After Euclid High School's last basketball game, it was determined that (1)/(4) of the team's points were scored by Alexa and (2)/(7) were scored by Brittany. Chelsea scored 15 points. None of the other 7 team members scored more than 2 points. What was the total number of points scored by the other 7 team members? (A) 10 (B) 11 (C) 12 (D) 13 (E) 14","answer":"B","major_category":"数论","minor_category":"整除","tags":"整除;AMC 8","key_idea":"把条件写成整除关系并利用倍数结构筛选。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-23"},{"year":2019,"contest":"AMC 8","form":"","problem_no":24,"source":"2019 AMC 8 Problem 24","statement":"In triangle ABC, point D divides side AC so that AD:DC=1:2. Let E be the midpoint of BD and let F be the point of intersection of line BC and line AE. Given that the area of triangle ABC is 360, what is the area of triangle EBF? [图形] (A) 24 (B) 30 (C) 32 (D) 36 (E) 40","answer":"B","major_category":"几何与测量","minor_category":"三角形","tags":"三角形;面积","key_idea":"利用三角形的边、角、相似或面积关系求解。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-24"},{"year":2019,"contest":"AMC 8","form":"","problem_no":25,"source":"2019 AMC 8 Problem 25","statement":"Alice has 24 apples. In how many ways can she share them with Becky and Chris so that each of the three people has at least two apples? (A) 105 (B) 114 (C) 190 (D) 210 (E) 380","answer":"C","major_category":"组合数学","minor_category":"计数","tags":"计数;AMC 8","key_idea":"建立不重不漏的分类或递推计数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2019-amc-8-problem-25"}];
const filters={major:document.querySelector("#majorFilter"),minor:document.querySelector("#minorFilter"),search:document.querySelector("#searchInput")};
const cards=document.querySelector("#cards"),resultCount=document.querySelector("#resultCount"),currentSummary=document.querySelector("#currentSummary"),clearFilters=document.querySelector("#clearFilters");
const statTotal=document.querySelector("#statTotal"),statPart1=document.querySelector("#statPart1"),statPart2=document.querySelector("#statPart2"),statPart3=document.querySelector("#statPart3");
const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
function fill(select,values,current=select.value){select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");if(values.includes(current))select.value=current;}
function refreshOptions(){const cm=filters.major.value,cn=filters.minor.value;fill(filters.major,unique(problems.map(p=>p.major_category)),cm);const minorBase=problems.filter(p=>!filters.major.value||p.major_category===filters.major.value);fill(filters.minor,unique(minorBase.map(p=>p.minor_category)),cn);}
function matches(p){const q=filters.search.value.trim().toLowerCase();const hay=[p.problem_no,p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase();return(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q));}
function syncButtons(){document.querySelectorAll("[data-filter-major]").forEach(button=>{const major=button.dataset.filterMajor||"",minor=button.dataset.filterMinor||"";const active=filters.major.value===major&&(!minor||filters.minor.value===minor);button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active));});}
function render(){
  refreshOptions();
  const shown=problems.filter(matches).sort((a,b)=>Number(a.problem_no)-Number(b.problem_no));
  const partCounts=[shown.filter(p=>Number(p.problem_no)<=10).length,shown.filter(p=>Number(p.problem_no)>=11&&Number(p.problem_no)<=20).length,shown.filter(p=>Number(p.problem_no)>=21).length];
  statTotal.textContent=shown.length;statPart1.textContent=partCounts[0];statPart2.textContent=partCounts[1];statPart3.textContent=partCounts[2];
  resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`;
  const terms=[];if(filters.major.value)terms.push(filters.major.value);if(filters.minor.value)terms.push(filters.minor.value);if(filters.search.value.trim())terms.push(`搜索“${filters.search.value.trim()}”`);
  currentSummary.textContent=`当前筛选：${terms.length?terms.join(" · "):"全部分类"}`;
  syncButtons();
  cards.innerHTML=shown.length?shown.map(p=>`<a class="card problem-link" data-source="${esc(p.source)}" href="../problems/${esc(p.detail_slug)}/index.html" aria-label="查看 ${esc(p.source)} 的详细解答"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge answer">答案 ${esc(p.answer)}</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea"><strong>核心思路：</strong>${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").filter(Boolean).map(tag=>`<span class="badge">${esc(tag)}</span>`).join(" ")}</div><span class="detail-cta">查看解答 →</span></a>`).join(""):'<div class="empty">没有匹配的题目</div>';
  window.__AMC8_STATE__={year:String(problems[0]?.year??""),major:filters.major.value,minor:filters.minor.value,query:filters.search.value.trim(),visible:shown.length,partCounts};
}
Object.values(filters).forEach(control=>control.addEventListener("input",render));
document.addEventListener("click",event=>{const action=event.target.closest("[data-filter-major]");if(!action)return;filters.major.value=action.dataset.filterMajor||"";refreshOptions();filters.minor.value=action.dataset.filterMinor||"";filters.search.value="";render();});
clearFilters.addEventListener("click",()=>{Object.values(filters).forEach(control=>control.value="");render();});
render();
</script>
