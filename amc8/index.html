<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMC 8 题目分类总览</title>
  <style>
:root {
  --bg:#f7f4ee; --panel:#fff; --ink:#1e2832; --muted:#66727f;
  --line:#d8ddd8; --blue:#2166a5; --green:#4f7d48; --amber:#c58a1d;
  --red:#b3564a; --chip:#eef3f7; --navy:#17324a;
}
* { box-sizing:border-box; }
html,body { max-width:100%; overflow-x:hidden; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif; }
header { background:var(--navy); color:#fff; padding:28px 32px 20px; }
h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; }
header p { margin:0; color:#d7e4ef; }
main { padding:24px 32px 40px; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; min-width:0; }
.stat strong { display:block; font-size:26px; }
.stat span,.muted { color:var(--muted); }
.grid { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(360px,1.2fr); gap:16px; margin-bottom:16px; }
button,select,input { font:inherit; }
button { cursor:pointer; }
.controls { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)) minmax(120px,.7fr); gap:10px; margin-bottom:14px; }
label { display:grid; gap:6px; font-size:12px; color:var(--muted); }
select,input { min-height:38px; min-width:0; border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:#fff; color:var(--ink); }
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible { outline:3px solid rgba(33,102,165,.22); outline-offset:2px; }
.clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; min-width:0; }
.problem-link { color:inherit; text-decoration:none; transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease; }
.problem-link:hover { border-color:#9ab7ce; box-shadow:0 5px 16px rgba(23,50,74,.10); transform:translateY(-1px); }
.problem-link:focus-visible { outline:3px solid #6f9fc3; outline-offset:2px; }
.detail-cta { color:var(--blue); font-weight:700; font-size:13px; }
.top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; min-width:0; }
.source { font-weight:750; margin-right:auto; }
.badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; }
.badge.major { background:#e8f0dc; color:#35592f; }
.badge.answer { background:#f5e3df; color:#863f35; font-weight:750; }
.statement,.idea { line-height:1.55; font-size:14px; white-space:pre-wrap; }
.idea { border-left:3px solid var(--blue); padding-left:10px; color:#33414e; font-size:13px; }
.source,.statement,.idea,.badge,.muted { overflow-wrap:anywhere; word-break:break-word; }
.empty { border:1px dashed var(--line); border-radius:8px; padding:24px; color:var(--muted); text-align:center; background:#fff; }
.home-link { display:inline-block; margin-bottom:10px; color:#fff; text-underline-offset:3px; }
.summary { margin:2px 0 6px; color:#33414e; }
@media (max-width:980px) {
  main { padding:18px; }
  header { padding:24px 18px 18px; }
  .stats,.grid,.controls,.compare-head,.bar-row { grid-template-columns:1fr; }
  .compare-head { display:none; }
  .bar-row [data-label]::before { content:attr(data-label); display:block; margin-bottom:4px; color:var(--muted); font-size:11px; font-weight:600; }
}
@media (max-width:480px) {
  main { padding:14px 10px 28px; }
  header { padding:20px 12px 16px; }
  h1 { font-size:25px; }
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .stat,.panel { padding:13px; }
  .cards { grid-template-columns:minmax(0,1fr); }
}

.years { display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:8px; }
.year-card-wrap { display:grid; grid-template-columns:1fr auto; min-width:0; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; overflow:hidden; }
.year-card { border:0; background:transparent; padding:10px; display:flex; justify-content:space-between; align-items:center; gap:7px; min-width:0; text-align:left; }
.year-link { display:grid; place-items:center; padding:7px; border-left:1px solid var(--line); color:var(--blue); font-size:12px; text-decoration:none; }
.year-card-wrap:hover,.year-card-wrap.active { background:#eef6f1; border-color:#bed2bd; }
.year-card.active { background:#eef6f1; }
.year-card-wrap:has(.year-card.active) { background:#eef6f1; border-color:#8fb68c; box-shadow:0 0 0 2px rgba(79,125,72,.12); }
.compare-head,.bar-row { display:grid; grid-template-columns:minmax(120px,.7fr) minmax(220px,1fr) minmax(250px,1.2fr); gap:12px; align-items:center; }
.compare-head { color:var(--muted); font-size:12px; padding:0 8px 6px; }
.bar-row { width:100%; border:1px solid transparent; background:transparent; border-radius:6px; padding:8px; margin:7px 0; text-align:left; }
.bar-row:hover,.bar-row.active { background:#eef6f1; border-color:#bed2bd; }
.compare-cell { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; min-width:0; }
.compare-meta { color:var(--muted); font-size:12px; white-space:nowrap; }
.track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; }
.track span { display:block; height:100%; background:var(--blue); }
.part-cell { display:grid; gap:6px; min-width:0; }
.part-stack { display:flex; height:10px; border-radius:999px; overflow:hidden; background:#e8ece9; }
.part-segment { display:block; height:100%; }
.part-segment.p1 { background:var(--green); }
.part-segment.p2 { background:var(--amber); }
.part-segment.p3 { background:var(--red); }
.part-meta { display:flex; flex-wrap:wrap; gap:4px; color:var(--muted); font-size:11px; }
.part-pill { border:1px solid var(--line); border-radius:999px; padding:2px 6px; background:#fbfcfb; white-space:nowrap; }
@media (max-width:980px) {
  .compare-head { display:none; }
  .bar-row { grid-template-columns:minmax(0,1fr); }
  .bar-row > span,.compare-cell,.part-cell { min-width:0; width:100%; }
  .compare-cell { grid-template-columns:minmax(0,1fr) auto; }
  .part-cell { grid-template-columns:minmax(0,1fr); }
}
</style>

.stemhub-site-nav{max-width:1180px;margin:12px auto 0;padding:0 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.stemhub-site-nav a:hover,.stemhub-site-nav a:focus-visible{border-color:#2563eb;color:#1d4ed8;box-shadow:0 0 0 3px rgba(37,99,235,.14);outline:0}

</style>

airs. Let m and M be the least and greatest possible numbers of gold-gold pairs. What is m+M? (A) 12 (B) 14 (C) 16 (D) 18 (E) 20","answer":"C","major_category":"组合数学","minor_category":"构造","tags":"配对;极值;构造","key_idea":"把 13 个银格分配到 18 对中，分别最大化和最小化含银的格对数。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2025-amc-8-problem-15"},{"year":2025,"contest":"AMC 8","form":"","problem_no":16,"source":"2025 AMC 8 Problem 16","statement":"Choose five distinct integers from 1 to 10 and five from 11 to 20, with no two chosen numbers differing by 10. What is the sum of the ten chosen numbers? (A) 95 (B) 100 (C) 105 (D) 110 (E) 115","answer":"C","major_category":"组合数学","minor_category":"分类讨论","tags":"配对;不变量","key_idea":"把 k 与 k+10 配成十对；条件迫使每对恰选一个，再求总和不变量。","notes":"","detail_slug":"2025-amc-8-problem-16"},{"year":2025,"contest":"AMC 8","form":"","problem_no":17,"source":"2025 AMC 8 Problem 17","statement":"Cities A, B, C have populations 100, 120, 160. Commuting fractions are A->B=1/4, A->C=1/5, B->A=1/3, B->C=1/6, C->A=1/8, C->B=1/10; everyone else works where they live. How many people work in A? (A) 55 (B) 60 (C) 85 (D) 115 (E) 160","answer":"D","major_category":"算术与数感","minor_category":"比例","tags":"比例;流量;应用题","key_idea":"分别计算来自三座城市而在 A 工作的人数并相加。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 未收录本题；图中箭头数据由 AoPS Wiki 同年题页转写","detail_slug":"2025-amc-8-problem-17"},{"year":2025,"contest":"AMC 8","form":"","problem_no":18,"source":"2025 AMC 8 Problem 18","statement":"A radius-1 circle has all four corner regions between it and an inscribed square shaded. A radius-R circle has one quarter of the corresponding region shaded. The shaded areas are equal. What is R? (A) sqrt(2) (B) 2 (C) 2sqrt(2) (D) 4 (E) 4sqrt(2)","answer":"B","major_category":"几何与测量","minor_category":"圆","tags":"相似;面积缩放","key_idea":"对应区域面积按半径平方缩放；四分之一面积相等确定缩放倍数。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 未收录本题；题面和选项由 AoPS Wiki 同年题页补全","detail_slug":"2025-amc-8-problem-18"},{"year":2025,"contest":"AMC 8","form":"","problem_no":19,"source":"2025 AMC 8 Problem 19","statement":"A 15-mile road has consecutive 5-mile speed limits 25, 40, and 20 mph from A to B. Cars start simultaneously at A and B and drive toward each other at the local limit. How far from A do they meet? (A) 7.75 (B) 8 (C) 8.25 (D) 8.5 (E) 8.75","answer":"D","major_category":"代数","minor_category":"方程","tags":"分段速度;相遇问题","key_idea":"按分段行驶时间确定相遇时所在路段，再建立同时到达方程。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页","detail_slug":"2025-amc-8-problem-19"},{"year":2025,"contest":"AMC 8","form":"","problem_no":20,"source":"2025 AMC 8 Problem 20","statement":"Sarika, Dev, and Rajiv repeatedly take turns eating half of the cheese that remains, starting with Sarika. About what fraction of the original cheese does Sarika eat in total? (A) 4/7 (B) 3/5 (C) 2/3 (D) 3/4 (E) 7/8","answer":"A","major_category":"代数","minor_category":"数列","tags":"等比数列;无限和","key_idea":"Sarika 吃到的份额构成首项 1/2、公比 1/8 的等比级数。","notes":"","detail_slug":"2025-amc-8-problem-20"},{"year":2025,"contest":"AMC 8","form":"","problem_no":21,"source":"2025 AMC 8 Problem 21","statement":"Grades 1 through 7 are assigned once each to pods A-G. Connected pods must differ by at least 2. Edges are AB, AC, AG, AF, BC, BF, CD, CE, CF, DE, EF, and FG. What is the sum of grades at C, E, and F? (A) 12 (B) 13 (C) 14 (D) 15 (E) 16","answer":"A","major_category":"组合数学","minor_category":"构造","tags":"图标号;约束满足","key_idea":"从度数最高的节点和相邻差值限制入手构造唯一可行标号。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 未嵌入题图；连边由 AoPS Wiki 图形转写","detail_slug":"2025-amc-8-problem-21"},{"year":2025,"contest":"AMC 8","form":"","problem_no":22,"source":"2025 AMC 8 Problem 22","statement":"There are 35 coat hooks. Coats are equally spaced with the same positive number of empty hooks before, after, and between coats. How many different positive numbers of coats are possible? (A) 2 (B) 4 (C) 5 (D) 7 (E) 9","answer":"D","major_category":"数论","minor_category":"因数与倍数","tags":"整除;等间隔","key_idea":"若有 c 件外套、每段 e 个空钩，则 35=c+(c+1)e，转化为因数分解。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 的示意图为占位文本；题面和选项经 AoPS Wiki 核验","detail_slug":"2025-amc-8-problem-22"},{"year":2025,"contest":"AMC 8","form":"","problem_no":23,"source":"2025 AMC 8 Problem 23","statement":"How many four-digit numbers end in 99, are one less than a perfect square, and are the product of exactly two primes? (A) 0 (B) 1 (C) 2 (D) 3 (E) 4","answer":"B","major_category":"数论","minor_category":"质数","tags":"平方数;半素数;数字条件","key_idea":"由末两位 99 推出相邻平方的末两位，再检查候选数的质因数分解。","notes":"","detail_slug":"2025-amc-8-problem-23"},{"year":2025,"contest":"AMC 8","form":"","problem_no":24,"source":"2025 AMC 8 Problem 24","statement":"In trapezoid ABCD, base angles B and C are 60 degrees, legs AB and DC are equal, all side lengths are positive integers, and the perimeter is 30. How many non-congruent trapezoids satisfy the conditions? (A) 0 (B) 1 (C) 2 (D) 3 (E) 4","answer":"E","major_category":"几何与测量","minor_category":"四边形","tags":"等腰梯形;整数边;计数","key_idea":"把较长底边写成较短底边加两条腿的水平投影，再枚举整数周长解。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 未收录本题；题面和选项由 AoPS Wiki 同年题页补全","detail_slug":"2025-amc-8-problem-24"},{"year":2025,"contest":"AMC 8","form":"","problem_no":25,"source":"2025 AMC 8 Problem 25","statement":"In a 5-by-5 diamond grid, paths go from bottom to top using northeast or northwest steps. For every possible path, take the area between the path and the right boundary. What is the sum of all these areas? (A) 2520 (B) 3150 (C) 3840 (D) 4730 (E) 5050","answer":"B","major_category":"组合数学","minor_category":"计数","tags":"格路径;对称;面积总和","key_idea":"利用左右反射把每条路径与镜像配对，使每对面积和固定。","notes":"题面包含图形；图形细节已对照原题 PDF 与 AoPS 题页；源 PDF 末页未呈现 A-E 选项；题面、图形与选项按 AoPS Wiki 同年题页核验","detail_slug":"2025-amc-8-problem-25"}];
const filters = {
  year: document.querySelector("#yearFilter"),
  major: document.querySelector("#majorFilter"),
  minor: document.querySelector("#minorFilter"),
  search: document.querySelector("#searchInput"),
};
const cards = document.querySelector("#cards");
const resultCount = document.querySelector("#resultCount");
const currentSummary = document.querySelector("#currentSummary");
const clearFilters = document.querySelector("#clearFilters");
const majorBars = document.querySelector("#majorBars");
const majorPanelTitle = document.querySelector("#majorPanelTitle");
const statTotal = document.querySelector("#statTotal");
const statYears = document.querySelector("#statYears");
const statMajor = document.querySelector("#statMajor");
const statMinor = document.querySelector("#statMinor");
const majorOrder = ["算术与数感", "代数", "几何与测量", "数论", "组合数学", "概率与统计", "综合题"];
const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const unique = values => [...new Set(values.filter(value => value !== "" && value != null))].sort((a,b) => {
  const ai = majorOrder.includes(a) ? majorOrder.indexOf(a) : 999;
  const bi = majorOrder.includes(b) ? majorOrder.indexOf(b) : 999;
  return ai - bi || String(a).localeCompare(String(b), "zh-CN");
});
const pct = (part,total) => total ? `${(part / total * 100).toFixed(1)}%` : "0.0%";
function fill(select, values, current=select.value, allLabel="全部") {
  select.innerHTML = `<option value="">${esc(allLabel)}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  if (values.map(String).includes(String(current))) select.value = current;
}
function refreshOptions() {
  const current = Object.fromEntries(Object.entries(filters).map(([key,value]) => [key,value.value]));
  const years = unique(problems.map(p => String(p.year))).sort((a,b) => Number(a)-Number(b));
  fill(filters.year, years, current.year, "全部年份");
  let base = problems.filter(p => !filters.year.value || String(p.year) === filters.year.value);
  fill(filters.major, unique(base.map(p => p.major_category)), current.major, "全部");
  const minorBase = base.filter(p => !filters.major.value || p.major_category === filters.major.value);
  fill(filters.minor, unique(minorBase.map(p => p.minor_category)), current.minor, "全部");
}
function matches(p) {
  const q = filters.search.value.trim().toLowerCase();
  const hay = [p.year,p.problem_no,p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase();
  return (!filters.year.value || String(p.year) === filters.year.value)
    && (!filters.major.value || p.major_category === filters.major.value)
    && (!filters.minor.value || p.minor_category === filters.minor.value)
    && (!q || hay.includes(q));
}
function currentFilteredRows() { return problems.filter(matches); }
function syncButtons() {
  document.querySelectorAll("[data-year]").forEach(button => {
    const active = filters.year.value === (button.dataset.year || "");
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
  document.querySelectorAll("[data-major]").forEach(button => {
    const active = filters.major.value === button.dataset.major;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
  document.querySelectorAll("[data-minor]").forEach(button => {
    const active = filters.minor.value === button.dataset.minor;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
}
function renderStats(rows) {
  statTotal.textContent = rows.length;
  statYears.textContent = new Set(rows.map(p => p.year)).size;
  statMajor.textContent = new Set(rows.map(p => p.major_category)).size;
  statMinor.textContent = new Set(rows.map(p => p.minor_category)).size;
}
function partKey(problemNo) {
  const no = Number(problemNo);
  if (no <= 10) return "part1";
  if (no <= 20) return "part2";
  return "part3";
}
function renderCategoryRows(rows,dimension) {
  const counts = new Map();
  rows.forEach(p => {
    const key = dimension === "minor" ? p.minor_category : p.major_category;
    if (!counts.has(key)) counts.set(key,{total:0,part1:0,part2:0,part3:0});
    counts.get(key).total += 1;
    counts.get(key)[partKey(p.problem_no)] += 1;
  });
  const entries = [...counts.entries()].sort((a,b) => {
    if (dimension === "major") {
      const ai = majorOrder.includes(a[0]) ? majorOrder.indexOf(a[0]) : 999;
      const bi = majorOrder.includes(b[0]) ? majorOrder.indexOf(b[0]) : 999;
      return ai-bi || a[0].localeCompare(b[0],"zh-CN");
    }
    return a[0].localeCompare(b[0],"zh-CN");
  });
  return entries;
}
function renderMajorBars(rows) {
  const dimension = filters.major.value ? "minor" : "major";
  const entries = renderCategoryRows(rows,dimension);
  const scope = filters.year.value || "全部年份";
  majorPanelTitle.textContent = dimension === "minor"
    ? `${filters.major.value} - 二级分类与 Part 分布（${scope}）`
    : `一级分类与 Part 分布（${scope}）`;
  if (!entries.length) { majorBars.innerHTML='<div class="empty">当前筛选下没有分类统计</div>'; return; }
  majorBars.innerHTML = `<div class="compare-head"><span>${dimension === "minor" ? "二级分类" : "分类"}</span><span>题量占比</span><span>题号分段</span></div>` + entries.map(([category,c]) => `
    <button class="bar-row" type="button" ${dimension === "minor" ? `data-minor="${esc(category)}"` : `data-major="${esc(category)}"`}>
      <span>${esc(category)}</span>
      <span class="compare-cell" data-label="题量占比"><span class="track"><span style="width:${pct(c.total,rows.length)}"></span></span><span class="compare-meta">${c.total}题 / ${pct(c.total,rows.length)}</span></span>
      <span class="part-cell" data-label="题号分段" aria-label="Part 1 ${c.part1}题；Part 2 ${c.part2}题；Part 3 ${c.part3}题">
        <span class="part-stack"><span class="part-segment p1" style="width:${pct(c.part1,c.total)}"></span><span class="part-segment p2" style="width:${pct(c.part2,c.total)}"></span><span class="part-segment p3" style="width:${pct(c.part3,c.total)}"></span></span>
        <span class="part-meta"><span class="part-pill">P1 ${c.part1} / ${pct(c.part1,c.total)}</span><span class="part-pill">P2 ${c.part2} / ${pct(c.part2,c.total)}</span><span class="part-pill">P3 ${c.part3} / ${pct(c.part3,c.total)}</span></span>
      </span>
    </button>`).join("");
}
function renderCards(rows) {
  if (!rows.length) { cards.innerHTML='<div class="empty">没有匹配的题目</div>'; return; }
  cards.innerHTML = rows.map(p => `<a class="card problem-link" data-source="${esc(p.source)}" href="problems/${esc(p.detail_slug)}/index.html" aria-label="查看 ${esc(p.source)} 的详细解答"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge">${esc(p.year)}</span><span class="badge answer">答案 ${esc(p.answer)}</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea"><strong>核心思路：</strong>${esc(p.key_idea)}${p.notes ? `<br><strong>备注：</strong>${esc(p.notes)}` : ""}</div><div>${String(p.tags).split(";").filter(Boolean).map(tag => `<span class="badge">${esc(tag)}</span>`).join(" ")}</div><span class="detail-cta">查看解答 →</span></a>`).join("");
}
function render() {
  refreshOptions();
  const shown = currentFilteredRows().sort((a,b) => Number(a.year)-Number(b.year) || Number(a.problem_no)-Number(b.problem_no));
  resultCount.textContent = `当前显示 ${shown.length} / ${problems.length} 题`;
  const terms=[];
  if (filters.year.value) terms.push(`年份 ${filters.year.value}`);
  if (filters.major.value) terms.push(filters.major.value);
  if (filters.minor.value) terms.push(filters.minor.value);
  if (filters.search.value.trim()) terms.push(`搜索“${filters.search.value.trim()}”`);
  currentSummary.textContent = `当前筛选：${terms.length ? terms.join(" · ") : "全部年份 · 全部分类"}`;
  renderStats(shown); renderMajorBars(shown); syncButtons(); renderCards(shown);
  window.__AMC8_STATE__={year:filters.year.value,major:filters.major.value,minor:filters.minor.value,query:filters.search.value.trim(),visible:shown.length,partCounts:[shown.filter(p=>Number(p.problem_no)<=10).length,shown.filter(p=>Number(p.problem_no)>=11&&Number(p.problem_no)<=20).length,shown.filter(p=>Number(p.problem_no)>=21).length]};
}
Object.values(filters).forEach(control => control.addEventListener("input",render));
document.addEventListener("click",event => {
  const yearButton=event.target.closest("[data-year]");
  const majorButton=event.target.closest("[data-major]");
  const minorButton=event.target.closest("[data-minor]");
  if (yearButton) { const next=yearButton.dataset.year||""; filters.year.value=filters.year.value===next?"":next; render(); }
  if (majorButton) { filters.major.value=majorButton.dataset.major||""; filters.minor.value=""; render(); }
  if (minorButton) { filters.minor.value=minorButton.dataset.minor||""; render(); }
});
clearFilters.addEventListener("click",()=>{ Object.values(filters).forEach(control=>control.value=""); render(); });
render();
</script>
</body>
