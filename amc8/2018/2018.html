  <style>
:root {
  --bg:#f7f4ee; --panel:#fff; --ink:#1e2832; --muted:#66727f;
  --line:#d8ddd8; --blue:#2166a5; --green:#4f7d48; --amber:#c58a1d;
  --red:#b3564a; --chip:#eef3f7; --navy:#17324a;
}
* { box-sizing:border-box; }
html,body { max-width:100%; overflow-x:hidden; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif; }
header { background:var(--navy); color:#fff; padding:28px 32px 20px; }
h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; }
header p { margin:0; color:#d7e4ef; }
main { padding:24px 32px 40px; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; min-width:0; }
.stat strong { display:block; font-size:26px; }
.stat span,.muted { color:var(--muted); }
.grid { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(360px,1.2fr); gap:16px; margin-bottom:16px; }
button,select,input { font:inherit; }
button { cursor:pointer; }
.controls { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)) minmax(120px,.7fr); gap:10px; margin-bottom:14px; }
label { display:grid; gap:6px; font-size:12px; color:var(--muted); }
select,input { min-height:38px; min-width:0; border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:#fff; color:var(--ink); }
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible { outline:3px solid rgba(33,102,165,.22); outline-offset:2px; }
.clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; min-width:0; }
.problem-link { color:inherit; text-decoration:none; transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease; }
.problem-link:hover { border-color:#9ab7ce; box-shadow:0 5px 16px rgba(23,50,74,.10); transform:translateY(-1px); }
.problem-link:focus-visible { outline:3px solid #6f9fc3; outline-offset:2px; }
.detail-cta { color:var(--blue); font-weight:700; font-size:13px; }
.top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; min-width:0; }
.source { font-weight:750; margin-right:auto; }
.badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; }
.badge.major { background:#e8f0dc; color:#35592f; }
.badge.answer { background:#f5e3df; color:#863f35; font-weight:750; }
.statement,.idea { line-height:1.55; font-size:14px; white-space:pre-wrap; }
.idea { border-left:3px solid var(--blue); padding-left:10px; color:#33414e; font-size:13px; }
.source,.statement,.idea,.badge,.muted { overflow-wrap:anywhere; word-break:break-word; }
.empty { border:1px dashed var(--line); border-radius:8px; padding:24px; color:var(--muted); text-align:center; background:#fff; }
.home-link { display:inline-block; margin-bottom:10px; color:#fff; text-underline-offset:3px; }
.summary { margin:2px 0 6px; color:#33414e; }
@media (max-width:980px) {
  main { padding:18px; }
  header { padding:24px 18px 18px; }
  .stats,.grid,.controls,.compare-head,.bar-row { grid-template-columns:1fr; }
  .compare-head { display:none; }
  .bar-row [data-label]::before { content:attr(data-label); display:block; margin-bottom:4px; color:var(--muted); font-size:11px; font-weight:600; }
}
@media (max-width:480px) {
  main { padding:14px 10px 28px; }
  header { padding:20px 12px 16px; }
  h1 { font-size:25px; }
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .stat,.panel { padding:13px; }
  .cards { grid-template-columns:minmax(0,1fr); }
}

.grid { grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr); }
.controls { grid-template-columns:repeat(3,minmax(130px,1fr)) minmax(120px,.7fr); }
.bar-row { width:100%; display:grid; grid-template-columns:minmax(110px,.7fr) minmax(140px,1fr) 60px; gap:10px; align-items:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:7px; margin:7px 0; text-align:left; }
.bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
.track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; }
.track span { display:block; height:100%; background:var(--blue); }
.quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:8px; }
.quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; min-width:0; }
.year-nav { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:10px; }
@media (max-width:980px) {
  .grid,.controls,.bar-row { grid-template-columns:minmax(0,1fr); }
}
</style>

const problems=[{"year":2018,"contest":"AMC 8","form":"","problem_no":1,"source":"2018 AMC 8 Problem 1","statement":"An amusement park has a collection of scale models, with ratio 1: 20, of buildings and other sights from around the country. The height of the United States Capitol is 289 feet. What is the height in feet of its replica to the nearest whole number? (A) 14 (B) 15 (C) 16 (D) 18 (E) 20","answer":"A","major_category":"算术与数感","minor_category":"比例","tags":"比例;AMC 8","key_idea":"设共同份数或比例参数，将各数量写成同一参数的倍数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-1"},{"year":2018,"contest":"AMC 8","form":"","problem_no":2,"source":"2018 AMC 8 Problem 2","statement":"What is the value of the product (1+(1)/(1))·(1+(1)/(2))·(1+(1)/(3))·(1+(1)/(4))·(1+(1)/(5))·(1+(1)/(6))? (A) (7)/(6) (B) (4)/(3) (C) (7)/(2) (D) 7 (E) 8","answer":"D","major_category":"算术与数感","minor_category":"分数与小数","tags":"分数与小数;AMC 8","key_idea":"统一分数或小数表示后约分、比较或计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-2"},{"year":2018,"contest":"AMC 8","form":"","problem_no":3,"source":"2018 AMC 8 Problem 3","statement":"Students Arn, Bob, Cyd, Dan, Eve, and Fon are arranged in that order in a circle. They start counting: Arn first, then Bob, and so forth. When the number contains a 7 as a digit (such as 47) or is a multiple of 7 that person leaves the circle and the counting continues. Who is the last one present in the circle? (A) Arn (B) Bob (C) Cyd (D) Dan (E) Eve","answer":"D","major_category":"代数","minor_category":"模式规律","tags":"模式规律;圆;数字;排列","key_idea":"从重复或递推结构中确定周期和增长规律。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-3"},{"year":2018,"contest":"AMC 8","form":"","problem_no":4,"source":"2018 AMC 8 Problem 4","statement":"The twelve-sided figure shown has been drawn on 1 cm× 1 cm graph paper. What is the area of the figure in cm^2? [图形] (A) 12 (B) 12.5 (C) 13 (D) 13.5 (E) 14","answer":"C","major_category":"几何与测量","minor_category":"面积","tags":"面积;图表","key_idea":"分割、补形或作差，将目标区域化为基本图形面积。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-4"},{"year":2018,"contest":"AMC 8","form":"","problem_no":5,"source":"2018 AMC 8 Problem 5","statement":"What is the value of 1+3+5+...+2017+2019-2-4-6-...-2016-2018? (A) -1010 (B) -1009 (C) 1008 (D) 1009 (E) 1010","answer":"E","major_category":"算术与数感","minor_category":"四则运算","tags":"四则运算;AMC 8","key_idea":"按运算顺序化简数值表达式，并用选项回代核对。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-5"},{"year":2018,"contest":"AMC 8","form":"","problem_no":6,"source":"2018 AMC 8 Problem 6","statement":"On a trip to the beach, Anh traveled 50 miles on the highway and 10 miles on a coastal access road. He drove three times as fast on the highway as on the coastal road. If Anh spent 30 minutes driving on the coastal road, how many minutes did his entire trip take? (A) 50 (B) 70 (C) 80 (D) 90 (E) 100","answer":"C","major_category":"算术与数感","minor_category":"应用题","tags":"应用题;AMC 8","key_idea":"提取数量、速度、时间或费用关系并分步计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-6"},{"year":2018,"contest":"AMC 8","form":"","problem_no":7,"source":"2018 AMC 8 Problem 7","statement":"The 5 -digit number 2 0 1 8 U is divisible by 9. What is the remainder when this number is divided by 8? (A) 1 (B) 3 (C) 5 (D) 6 (E) 7","answer":"B","major_category":"数论","minor_category":"余数","tags":"余数;数字","key_idea":"在适当模数下计算并利用余数周期。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-7"},{"year":2018,"contest":"AMC 8","form":"","problem_no":8,"source":"2018 AMC 8 Problem 8","statement":"John Pork asked the members of his health class how many days last week they exercised for at least 30 minutes. The results are summarized in the following bar graph, where the heights of the bars represent the number of students. [图形] What was the mean number of days of exercise last week, rounded to the nearest hundredth, reported by the students in John Pork's class? (A) 3.50 (B) 3.57 (C) 4.36 (D) 4.50 (E) 5.00","answer":"C","major_category":"概率与统计","minor_category":"图表与数据","tags":"图表与数据;图表","key_idea":"准确读取图表或数据结构，再计算所求统计量。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-8"},{"year":2018,"contest":"AMC 8","form":"","problem_no":9,"source":"2018 AMC 8 Problem 9","statement":"Tyler is tiling the floor of his 12 foot by 16 foot living room. He plans to place one-foot by one-foot square tiles to form a border along the edges of the room and to fill in the rest of the floor with two-foot by two-foot square tiles. How many tiles will he use? (A) 48 (B) 87 (C) 91 (D) 96 (E) 120","answer":"B","major_category":"几何与测量","minor_category":"面积","tags":"面积;正方形","key_idea":"分割、补形或作差，将目标区域化为基本图形面积。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-9"},{"year":2018,"contest":"AMC 8","form":"","problem_no":10,"source":"2018 AMC 8 Problem 10","statement":"The harmonic mean of a set of non-zero numbers is the reciprocal of the average of the reciprocals of the numbers. What is the harmonic mean of 1, 2, and 4? (A) (3)/(7) (B) (7)/(12) (C) (12)/(7) (D) (7)/(4) (E) (7)/(3)","answer":"C","major_category":"概率与统计","minor_category":"平均数","tags":"平均数;AMC 8","key_idea":"利用总和等于平均数乘数据个数建立关系。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-10"},{"year":2018,"contest":"AMC 8","form":"","problem_no":11,"source":"2018 AMC 8 Problem 11","statement":"Abby, Bridget, and four classmates are seated at random in two rows of three. What is the probability that Abby and Bridget are adjacent in the same row or the same column? [图形] (A) (1)/(3) (B) (2)/(5) (C) (7)/(15) (D) (1)/(2) (E) (2)/(3)","answer":"C","major_category":"概率与统计","minor_category":"概率","tags":"概率;AMC 8","key_idea":"确定等可能样本空间，计数有利结果并求比值。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-11"},{"year":2018,"contest":"AMC 8","form":"","problem_no":12,"source":"2018 AMC 8 Problem 12","statement":"The clock in Sri's car, which is not accurate, gains time at a constant rate. One day as he begins shopping, he notes that his car clock and his watch (which is accurate) both say 12:00 noon. When he is done shopping, his watch says 12:30 and his car clock says 12:35. Later that day, Sri loses his watch. He looks at his car clock and it says 7:00. What is the actual time? (A) 5:50 (B) 6:00 (C) 6:30 (D) 6:55 (E) 8:10","answer":"B","major_category":"算术与数感","minor_category":"比例","tags":"比例;AMC 8","key_idea":"设共同份数或比例参数，将各数量写成同一参数的倍数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-12"},{"year":2018,"contest":"AMC 8","form":"","problem_no":13,"source":"2018 AMC 8 Problem 13","statement":"Laila took five math tests, each worth a maximum of 100 points. Laila's score on each test was an integer between 0 and 100, inclusive. Laila received the same score on the first four tests, and she received a higher score on the last test. Her average score on the five tests was 82. How many values are possible for Laila's score on the last test? (A) 4 (B) 5 (C) 9 (D) 10 (E) 18","answer":"A","major_category":"概率与统计","minor_category":"平均数","tags":"平均数;AMC 8","key_idea":"利用总和等于平均数乘数据个数建立关系。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-13"},{"year":2018,"contest":"AMC 8","form":"","problem_no":14,"source":"2018 AMC 8 Problem 14","statement":"Let N be the greatest five-digit number whose digits have a product of 120. What is the sum of the digits of N? (A) 15 (B) 16 (C) 17 (D) 18 (E) 20","answer":"D","major_category":"数论","minor_category":"数字问题","tags":"数字问题;数字","key_idea":"按位值、数字和或末位条件分析整数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-14"},{"year":2018,"contest":"AMC 8","form":"","problem_no":15,"source":"2018 AMC 8 Problem 15","statement":"In the diagram below, a diameter of each of the two smaller circles is a radius of the larger circle. If the two smaller circles have a combined area of 1 square unit, then what is the area of the shaded region, in square units? [图形] (A) (1)/(4) (B) (1)/(3) (C) (1)/(2) (D) 1 (E) (π)/(2)","answer":"D","major_category":"几何与测量","minor_category":"圆","tags":"圆;正方形;面积","key_idea":"利用半径、弧、扇形或圆与多边形的面积关系。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-15"},{"year":2018,"contest":"AMC 8","form":"","problem_no":16,"source":"2018 AMC 8 Problem 16","statement":"Professor Chang has nine different language books lined up on a bookshelf: two Arabic, three German, and four Spanish. How many ways are there to arrange the nine books on the shelf keeping the Arabic books together and keeping the Spanish books together? (A) 1440 (B) 2880 (C) 5760 (D) 182,440 (E) 362,880","answer":"C","major_category":"组合数学","minor_category":"排列组合","tags":"排列组合;排列","key_idea":"按位置或对象分组，处理相邻、捆绑等排列限制。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-16"},{"year":2018,"contest":"AMC 8","form":"","problem_no":17,"source":"2018 AMC 8 Problem 17","statement":"Bella begins to walk from her house toward her friend Ella's house. At the same time, Ella begins to ride her bicycle toward Bella's house. They each maintain a constant speed, and Ella rides 5 times as fast as Bella walks. The distance between their houses is 2 miles, which is 10,560 feet, and Bella covers 2 (1)/(2) feet with each step. How many steps will Bella take by the time she meets Ella? (A) 704 (B) 845 (C) 1056 (D) 1760 (E) 3520","answer":"A","major_category":"代数","minor_category":"方程","tags":"方程;速度","key_idea":"设未知数，把题目条件翻译成方程并筛选符合条件的解。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-17"},{"year":2018,"contest":"AMC 8","form":"","problem_no":18,"source":"2018 AMC 8 Problem 18","statement":"How many positive factors does 23,232 have? (A) 9 (B) 12 (C) 28 (D) 36 (E) 42","answer":"E","major_category":"数论","minor_category":"因数与倍数","tags":"因数与倍数;因数","key_idea":"进行质因数分解，利用因数、倍数或最小公倍数结构。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-18"},{"year":2018,"contest":"AMC 8","form":"","problem_no":19,"source":"2018 AMC 8 Problem 19","statement":"In a sign pyramid a cell gets a \"+\" if the two cells below it have the same sign, and it gets a \"-\" if the two cells below it have different signs. The diagram below illustrates a sign pyramid with four levels. How many possible ways are there to fill the four cells in the bottom row to produce a \"+\" at the top of the pyramid? [图形] (A) 2 (B) 4 (C) 8 (D) 12 (E) 16","answer":"C","major_category":"组合数学","minor_category":"计数","tags":"计数;AMC 8","key_idea":"建立不重不漏的分类或递推计数。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-19"},{"year":2018,"contest":"AMC 8","form":"","problem_no":20,"source":"2018 AMC 8 Problem 20","statement":"In triangle ABC, point E is on AB with AE=1 and EB=2. Point D is on AC so that DE ∥ BC and point F is on BC so that EF ∥ AC. What is the ratio of the area of CDEF to the area of triangle ABC? [图形] (A) (4)/(9) (B) (1)/(2) (C) (5)/(9) (D) (3)/(5) (E) (2)/(3)","answer":"A","major_category":"几何与测量","minor_category":"三角形","tags":"三角形;比例;面积","key_idea":"利用三角形的边、角、相似或面积关系求解。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-20"},{"year":2018,"contest":"AMC 8","form":"","problem_no":21,"source":"2018 AMC 8 Problem 21","statement":"How many positive three-digit integers have a remainder of 2 when divided by 6, a remainder of 5 when divided by 9, and a remainder of 7 when divided by 11? (A) 1 (B) 2 (C) 3 (D) 4 (E) 5","answer":"E","major_category":"数论","minor_category":"余数","tags":"余数;数字","key_idea":"在适当模数下计算并利用余数周期。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-21"},{"year":2018,"contest":"AMC 8","form":"","problem_no":22,"source":"2018 AMC 8 Problem 22","statement":"Point E is the midpoint of side CD in square ABCD, and BE meets diagonal AC at F. The area of quadrilateral AFED is 45. What is the area of ABCD? [图形] (A) 100 (B) 108 (C) 120 (D) 135 (E) 144","answer":"B","major_category":"几何与测量","minor_category":"面积","tags":"面积;正方形","key_idea":"分割、补形或作差，将目标区域化为基本图形面积。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-22"},{"year":2018,"contest":"AMC 8","form":"","problem_no":23,"source":"2018 AMC 8 Problem 23","statement":"From a regular octagon, a triangle is formed by connecting three randomly chosen vertices of the octagon. What is the probability that at least one of the sides of the triangle is also a side of the octagon? [图形] (A) (2)/(7) (B) (5)/(42) (C) (11)/(14) (D) (5)/(7) (E) (6)/(7)","answer":"D","major_category":"概率与统计","minor_category":"概率","tags":"概率;三角形","key_idea":"确定等可能样本空间，计数有利结果并求比值。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-23"},{"year":2018,"contest":"AMC 8","form":"","problem_no":24,"source":"2018 AMC 8 Problem 24","statement":"In the cube ABCDEFGH with opposite vertices C and E, J and I are the midpoints of edges FB and HD, respectively. Let R be the ratio of the area of the cross-section EJCI to the area of one of the faces of the cube. What is R^2? [图形] (A) (5)/(4) (B) (4)/(3) (C) (3)/(2) (D) (25)/(16) (E) (9)/(4)","answer":"C","major_category":"几何与测量","minor_category":"空间几何","tags":"空间几何;立方体;比例;面积","key_idea":"根据立体的面、棱、截面或展开图分析空间关系。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-24"},{"year":2018,"contest":"AMC 8","form":"","problem_no":25,"source":"2018 AMC 8 Problem 25","statement":"How many perfect cubes lie between 2^8+1 and 2^18+1, inclusive? (A) 4 (B) 9 (C) 10 (D) 57 (E) 58","answer":"E","major_category":"数论","minor_category":"因数与倍数","tags":"因数与倍数;立方体","key_idea":"进行质因数分解，利用因数、倍数或最小公倍数结构。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2018-amc-8-problem-25"}];
const filters={major:document.querySelector("#majorFilter"),minor:document.querySelector("#minorFilter"),search:document.querySelector("#searchInput")};
const cards=document.querySelector("#cards"),resultCount=document.querySelector("#resultCount"),currentSummary=document.querySelector("#currentSummary"),clearFilters=document.querySelector("#clearFilters");
const statTotal=document.querySelector("#statTotal"),statPart1=document.querySelector("#statPart1"),statPart2=document.querySelector("#statPart2"),statPart3=document.querySelector("#statPart3");
const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
function fill(select,values,current=select.value){select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");if(values.includes(current))select.value=current;}
function refreshOptions(){const cm=filters.major.value,cn=filters.minor.value;fill(filters.major,unique(problems.map(p=>p.major_category)),cm);const minorBase=problems.filter(p=>!filters.major.value||p.major_category===filters.major.value);fill(filters.minor,unique(minorBase.map(p=>p.minor_category)),cn);}
function matches(p){const q=filters.search.value.trim().toLowerCase();const hay=[p.problem_no,p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase();return(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q));}
function syncButtons(){document.querySelectorAll("[data-filter-major]").forEach(button=>{const major=button.dataset.filterMajor||"",minor=button.dataset.filterMinor||"";const active=filters.major.value===major&&(!minor||filters.minor.value===minor);button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active));});}
function render(){
  refreshOptions();
  const shown=problems.filter(matches).sort((a,b)=>Number(a.problem_no)-Number(b.problem_no));
  const partCounts=[shown.filter(p=>Number(p.problem_no)<=10).length,shown.filter(p=>Number(p.problem_no)>=11&&Number(p.problem_no)<=20).length,shown.filter(p=>Number(p.problem_no)>=21).length];
  statTotal.textContent=shown.length;statPart1.textContent=partCounts[0];statPart2.textContent=partCounts[1];statPart3.textContent=partCounts[2];
  resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`;
  const terms=[];if(filters.major.value)terms.push(filters.major.value);if(filters.minor.value)terms.push(filters.minor.value);if(filters.search.value.trim())terms.push(`搜索“${filters.search.value.trim()}”`);
  currentSummary.textContent=`当前筛选：${terms.length?terms.join(" · "):"全部分类"}`;
  syncButtons();
  cards.innerHTML=shown.length?shown.map(p=>`<a class="card problem-link" data-source="${esc(p.source)}" href="../problems/${esc(p.detail_slug)}/index.html" aria-label="查看 ${esc(p.source)} 的详细解答"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge answer">答案 ${esc(p.answer)}</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea"><strong>核心思路：</strong>${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").filter(Boolean).map(tag=>`<span class="badge">${esc(tag)}</span>`).join(" ")}</div><span class="detail-cta">查看解答 →</span></a>`).join(""):'<div class="empty">没有匹配的题目</div>';
  window.__AMC8_STATE__={year:String(problems[0]?.year??""),major:filters.major.value,minor:filters.minor.value,query:filters.search.value.trim(),visible:shown.length,partCounts};
}
Object.values(filters).forEach(control=>control.addEventListener("input",render));
document.addEventListener("click",event=>{const action=event.target.closest("[data-filter-major]");if(!action)return;filters.major.value=action.dataset.filterMajor||"";refreshOptions();filters.minor.value=action.dataset.filterMinor||"";filters.search.value="";render();});
clearFilters.addEventListener("click",()=>{Object.values(filters).forEach(control=>control.value="");render();});
render();
</script>
