  <style>
:root {
  --bg:#f7f4ee; --panel:#fff; --ink:#1e2832; --muted:#66727f;
  --line:#d8ddd8; --blue:#2166a5; --green:#4f7d48; --amber:#c58a1d;
  --red:#b3564a; --chip:#eef3f7; --navy:#17324a;
}
* { box-sizing:border-box; }
html,body { max-width:100%; overflow-x:hidden; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif; }
header { background:var(--navy); color:#fff; padding:28px 32px 20px; }
h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; }
header p { margin:0; color:#d7e4ef; }
main { padding:24px 32px 40px; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; min-width:0; }
.stat strong { display:block; font-size:26px; }
.stat span,.muted { color:var(--muted); }
.grid { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(360px,1.2fr); gap:16px; margin-bottom:16px; }
button,select,input { font:inherit; }
button { cursor:pointer; }
.controls { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)) minmax(120px,.7fr); gap:10px; margin-bottom:14px; }
label { display:grid; gap:6px; font-size:12px; color:var(--muted); }
select,input { min-height:38px; min-width:0; border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:#fff; color:var(--ink); }
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible { outline:3px solid rgba(33,102,165,.22); outline-offset:2px; }
.clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; min-width:0; }
.problem-link { color:inherit; text-decoration:none; transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease; }
.problem-link:hover { border-color:#9ab7ce; box-shadow:0 5px 16px rgba(23,50,74,.10); transform:translateY(-1px); }
.problem-link:focus-visible { outline:3px solid #6f9fc3; outline-offset:2px; }
.detail-cta { color:var(--blue); font-weight:700; font-size:13px; }
.top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; min-width:0; }
.source { font-weight:750; margin-right:auto; }
.badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; }
.badge.major { background:#e8f0dc; color:#35592f; }
.badge.answer { background:#f5e3df; color:#863f35; font-weight:750; }
.statement,.idea { line-height:1.55; font-size:14px; white-space:pre-wrap; }
.idea { border-left:3px solid var(--blue); padding-left:10px; color:#33414e; font-size:13px; }
.source,.statement,.idea,.badge,.muted { overflow-wrap:anywhere; word-break:break-word; }
.empty { border:1px dashed var(--line); border-radius:8px; padding:24px; color:var(--muted); text-align:center; background:#fff; }
.home-link { display:inline-block; margin-bottom:10px; color:#fff; text-underline-offset:3px; }
.summary { margin:2px 0 6px; color:#33414e; }
@media (max-width:980px) {
  main { padding:18px; }
  header { padding:24px 18px 18px; }
  .stats,.grid,.controls,.compare-head,.bar-row { grid-template-columns:1fr; }
  .compare-head { display:none; }
  .bar-row [data-label]::before { content:attr(data-label); display:block; margin-bottom:4px; color:var(--muted); font-size:11px; font-weight:600; }
}
@media (max-width:480px) {
  main { padding:14px 10px 28px; }
  header { padding:20px 12px 16px; }
  h1 { font-size:25px; }
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .stat,.panel { padding:13px; }
  .cards { grid-template-columns:minmax(0,1fr); }
}

.grid { grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr); }
.controls { grid-template-columns:repeat(3,minmax(130px,1fr)) minmax(120px,.7fr); }
.bar-row { width:100%; display:grid; grid-template-columns:minmax(110px,.7fr) minmax(140px,1fr) 60px; gap:10px; align-items:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:7px; margin:7px 0; text-align:left; }
.bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
.track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; }
.track span { display:block; height:100%; background:var(--blue); }
.quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:8px; }
.quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; min-width:0; }
.year-nav { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:10px; }
@media (max-width:980px) {
  .grid,.controls,.bar-row { grid-template-columns:minmax(0,1fr); }
}
</style>

const problems=[{"year":2022,"contest":"AMC 8","form":"","problem_no":1,"source":"2022 AMC 8 Problem 1","statement":"The Math Team designed a logo shaped like a multiplication symbol, shown below on a grid of 1-inch squares. What is the area of the logo in square inches? [图形] (A) 10 (B) 12 (C) 13 (D) 14 (E) 15","answer":"A","major_category":"几何与测量","minor_category":"面积","tags":"面积;正方形;网格","key_idea":"分割、补形或作差，将目标区域化为基本图形面积。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-1"},{"year":2022,"contest":"AMC 8","form":"","problem_no":2,"source":"2022 AMC 8 Problem 2","statement":"Consider these two operations: a ◆ b = a^2-b^2 a ★ b = (a - b)^2 What is the value of (5 ◆ 3) ★ 6? (A) -20 (B) 4 (C) 16 (D) 100 (E) 220","answer":"D","major_category":"代数","minor_category":"表达式","tags":"表达式;比例","key_idea":"按定义代入并利用代数结构化简表达式。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-2"},{"year":2022,"contest":"AMC 8","form":"","problem_no":3,"source":"2022 AMC 8 Problem 3","statement":"When three positive integers a, b, and c are multiplied together, their product is 100. Suppose a < b < c. In how many ways can the numbers be chosen? (A) 0 (B) 1 (C) 2 (D) 3 (E) 4","answer":"E","major_category":"数论","minor_category":"因数与倍数","tags":"因数与倍数;AMC 8","key_idea":"进行质因数分解，利用因数、倍数或最小公倍数结构。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-3"},{"year":2022,"contest":"AMC 8","form":"","problem_no":4,"source":"2022 AMC 8 Problem 4","statement":"The letter M in the figure below is first reflected over the line q and then reflected over the line p. What is the resulting image? [图形] (A) 图形选项 A (B) 图形选项 B (C) 图形选项 C (D) 图形选项 D (E) 图形选项 E","answer":"E","major_category":"几何与测量","minor_category":"图形变换","tags":"图形变换;AMC 8","key_idea":"逐步追踪反射、折叠、旋转后的对应位置。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；A-E 为图形选项；文本保留选项标签，具体图形见原题 PDF 或 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-4"},{"year":2022,"contest":"AMC 8","form":"","problem_no":5,"source":"2022 AMC 8 Problem 5","statement":"Anna and Bella are celebrating their birthdays together. Five years ago, when Bella turned 6 years old, she received a newborn kitten as a birthday present. Today the sum of the ages of the two children and the kitten is 30 years. How many years older than Bella is Anna? (A) 1 (B) 2 (C) 3 (D) 4 (E) 5","answer":"C","major_category":"代数","minor_category":"方程","tags":"方程;AMC 8","key_idea":"设未知数，把题目条件翻译成方程并筛选符合条件的解。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-5"},{"year":2022,"contest":"AMC 8","form":"","problem_no":6,"source":"2022 AMC 8 Problem 6","statement":"Three positive integers are equally spaced on a number line. The middle number is 15, and the largest number is 4 times the smallest number. What is the smallest of these three numbers? (A) 4 (B) 5 (C) 6 (D) 7 (E) 8","answer":"C","major_category":"代数","minor_category":"方程","tags":"方程;AMC 8","key_idea":"设未知数，把题目条件翻译成方程并筛选符合条件的解。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-6"},{"year":2022,"contest":"AMC 8","form":"","problem_no":7,"source":"2022 AMC 8 Problem 7","statement":"When the World Wide Web first became popular in the 1990 s, download speeds reached a maximum of about 56 kilobits per second. Approximately how many minutes would the download of a 4.2 -megabyte song have taken at that speed? (Note that there are 8000 kilobits in a megabyte.) (A) 0.6 (B) 10 (C) 1800 (D) 7200 (E) 36000","answer":"B","major_category":"算术与数感","minor_category":"单位换算","tags":"单位换算;速度","key_idea":"先统一单位，再进行数量计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-7"},{"year":2022,"contest":"AMC 8","form":"","problem_no":8,"source":"2022 AMC 8 Problem 8","statement":"What is the value of (1)/(3)·(2)/(4)·(3)/(5)...(18)/(20)·(19)/(21)·(20)/(22)? (A) (1)/(462) (B) (1)/(231) (C) (1)/(132) (D) (2)/(213) (E) (1)/(22)","answer":"B","major_category":"算术与数感","minor_category":"分数与小数","tags":"分数与小数;AMC 8","key_idea":"统一分数或小数表示后约分、比较或计算。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-8"},{"year":2022,"contest":"AMC 8","form":"","problem_no":9,"source":"2022 AMC 8 Problem 9","statement":"A cup of boiling water ( 212°F ) is placed to cool in a room whose temperature remains constant at 68°F. Suppose the difference between the water temperature and the room temperature is halved every 5 minutes. What is the water temperature, in degrees Fahrenheit, after 15 minutes? (A) 77 (B) 86 (C) 92 (D) 98 (E) 104","answer":"B","major_category":"代数","minor_category":"数列","tags":"数列;AMC 8","key_idea":"识别相邻项或项号之间的规律，再求指定项或总和。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-9"},{"year":2022,"contest":"AMC 8","form":"","problem_no":10,"source":"2022 AMC 8 Problem 10","statement":"One sunny day, Ling decided to take a hike in the mountains. She left her house at 8 am, drove at a constant speed of 45 miles per hour, and arrived at the hiking trail at 10 am. After hiking for 3 hours, Ling drove home at a constant speed of 60 miles per hour. Which of the following graphs best illustrates the distance between Ling’s car and her house over the course of her trip? [图形] (A) 图形选项 A (B) 图形选项 B (C) 图形选项 C (D) 图形选项 D (E) 图形选项 E","answer":"E","major_category":"概率与统计","minor_category":"图表与数据","tags":"图表与数据;图表;速度","key_idea":"准确读取图表或数据结构，再计算所求统计量。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；A-E 为图形选项；文本保留选项标签，具体图形见原题 PDF 或 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-10"},{"year":2022,"contest":"AMC 8","form":"","problem_no":11,"source":"2022 AMC 8 Problem 11","statement":"Henry the donkey has a very long piece of pasta. He takes a number of bites of pasta, each time eating 3 inches of pasta from the middle of one piece. In the end, he has 10 pieces of pasta whose total length is 17 inches. How long, in inches, was the piece of pasta he started with? (A) 34 (B) 38 (C) 41 (D) 44 (E) 47","answer":"D","major_category":"代数","minor_category":"方程","tags":"方程;AMC 8","key_idea":"设未知数，把题目条件翻译成方程并筛选符合条件的解。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-11"},{"year":2022,"contest":"AMC 8","form":"","problem_no":12,"source":"2022 AMC 8 Problem 12","statement":"The arrows on the two spinners shown below are spun. Let the number N equal 10 times the number on Spinner A, added to the number on Spinner B. What is the probability that N is a perfect square number? [图形] (A) (1)/(16) (B) (1)/(8) (C) (1)/(4) (D) (3)/(8) (E) (1)/(2)","answer":"B","major_category":"概率与统计","minor_category":"概率","tags":"概率;正方形","key_idea":"确定等可能样本空间，计数有利结果并求比值。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-12"},{"year":2022,"contest":"AMC 8","form":"","problem_no":13,"source":"2022 AMC 8 Problem 13","statement":"How many positive integers can fill the blank in the sentence below? “One positive integer is _____ more than twice another, and the sum of the two numbers is 28.” (A) 6 (B) 7 (C) 8 (D) 9 (E) 10","answer":"D","major_category":"代数","minor_category":"方程","tags":"方程;AMC 8","key_idea":"设未知数，把题目条件翻译成方程并筛选符合条件的解。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-13"},{"year":2022,"contest":"AMC 8","form":"","problem_no":14,"source":"2022 AMC 8 Problem 14","statement":"In how many ways can the letters in BEEKEEPER be rearranged so that two or more E s do not appear together? (A) 1 (B) 4 (C) 12 (D) 24 (E) 120","answer":"D","major_category":"组合数学","minor_category":"排列组合","tags":"排列组合;排列","key_idea":"按位置或对象分组，处理相邻、捆绑等排列限制。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-14"},{"year":2022,"contest":"AMC 8","form":"","problem_no":15,"source":"2022 AMC 8 Problem 15","statement":"Laszlo went online to shop for black pepper and found thirty different black pepper options varying in weight and price, shown in the scatter plot below. In ounces, what is the weight of the pepper that offers the lowest price per ounce? [图形] (A) 1 (B) 2 (C) 3 (D) 4 (E) 5","answer":"C","major_category":"概率与统计","minor_category":"图表与数据","tags":"图表与数据;AMC 8","key_idea":"准确读取图表或数据结构，再计算所求统计量。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-15"},{"year":2022,"contest":"AMC 8","form":"","problem_no":16,"source":"2022 AMC 8 Problem 16","statement":"Four numbers are written in a row. The average of the first two is 21, the average of the middle two is 26, and the average of the last two is 30. What is the average of the first and last of the numbers? (A) 24 (B) 25 (C) 26 (D) 27 (E) 28","answer":"B","major_category":"概率与统计","minor_category":"平均数","tags":"平均数;AMC 8","key_idea":"利用总和等于平均数乘数据个数建立关系。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-16"},{"year":2022,"contest":"AMC 8","form":"","problem_no":17,"source":"2022 AMC 8 Problem 17","statement":"If n is an even positive integer, the double factorial notation n!! represents the product of all the even integers from 2 to n. For example, 8!! = 2 · 4 · 6 · 8. What is the units digit of the following sum? 2!! + 4!! + 6!! +... + 2018!! + 2020!! + 2022!! (A) 0 (B) 2 (C) 4 (D) 6 (E) 8","answer":"B","major_category":"数论","minor_category":"数字问题","tags":"数字问题;数字;因数","key_idea":"按位值、数字和或末位条件分析整数。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-17"},{"year":2022,"contest":"AMC 8","form":"","problem_no":18,"source":"2022 AMC 8 Problem 18","statement":"The midpoints of the four sides of a rectangle are (-3,0), (2,0), (5,4), and (0,4). What is the area of the rectangle? (A) 20 (B) 25 (C) 40 (D) 50 (E) 80","answer":"C","major_category":"几何与测量","minor_category":"坐标","tags":"坐标;矩形;面积","key_idea":"把图形条件转成坐标差、斜率、距离或面积。","notes":"题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-18"},{"year":2022,"contest":"AMC 8","form":"","problem_no":19,"source":"2022 AMC 8 Problem 19","statement":"Mr. Ramos gave a test to his class of 20 students. The dot plot below shows the distribution of test scores. [图形] Later Mr. Ramos discovered that there was a scoring error on one of the questions. He regraded the tests, awarding some of the students 5 extra points, which increased the median test score to 85. What is the minimum number of students who received extra points? (Note that the median test score equals the average of the 2 scores in the middle if the 20 test scores are arranged in increasing order.) (A) 2 (B) 3 (C) 4 (D) 5 (E) 6","answer":"C","major_category":"概率与统计","minor_category":"图表与数据","tags":"图表与数据;平均数;中位数;排列","key_idea":"准确读取图表或数据结构，再计算所求统计量。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-19"},{"year":2022,"contest":"AMC 8","form":"","problem_no":20,"source":"2022 AMC 8 Problem 20","statement":"The grid below is to be filled with integers in such a way that the sum of the numbers in each row and the sum of the numbers in each column are the same. Four numbers are missing. The number x in the lower left corner is larger than the other three missing numbers. What is the smallest possible value of x? [图形] (A) -1 (B) 5 (C) 6 (D) 8 (E) 9","answer":"D","major_category":"代数","minor_category":"方程","tags":"方程;网格","key_idea":"设未知数，把题目条件翻译成方程并筛选符合条件的解。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-20"},{"year":2022,"contest":"AMC 8","form":"","problem_no":21,"source":"2022 AMC 8 Problem 21","statement":"Steph scored 15 baskets out of 20 attempts in the first half of a game, and 10 baskets out of 10 attempts in the second half. Candace took 12 attempts in the first half and 18 attempts in the second. In each half, Steph scored a higher percentage of baskets than Candace. Surprisingly they ended with the same overall percentage of baskets scored. How many more baskets did Candace score in the second half than in the first? [图形] (A) 7 (B) 8 (C) 9 (D) 10 (E) 11","answer":"C","major_category":"算术与数感","minor_category":"百分比","tags":"百分比;AMC 8","key_idea":"把百分比转成乘法关系，追踪基准量的变化。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-21"},{"year":2022,"contest":"AMC 8","form":"","problem_no":22,"source":"2022 AMC 8 Problem 22","statement":"A bus takes 2 minutes to drive from one stop to the next, and waits 1 minute at each stop to let passengers board. Zia takes 5 minutes to walk from one bus stop to the next. As Zia reaches a bus stop, if the bus is at the previous stop or has already left the previous stop, then she will wait for the bus. Otherwise she will start walking toward the next stop. Suppose the bus and Zia start at the same time toward the library, with the bus 3 stops behind. After how many minutes will Zia board the bus? (A) 17 (B) 19 (C) 20 (D) 21 (E) 23","answer":"A","major_category":"算术与数感","minor_category":"应用题","tags":"应用题;AMC 8","key_idea":"提取数量、速度、时间或费用关系并分步计算。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-22"},{"year":2022,"contest":"AMC 8","form":"","problem_no":23,"source":"2022 AMC 8 Problem 23","statement":"A triangle or circle is placed in each of the nine squares in a 3 -by- 3 grid. Shown below is a sample configuration with three triangle s in a line. [图形] How many configurations will have three triangle s in a line and three circle s in a line? (A) 39 (B) 42 (C) 78 (D) 84 (E) 96","answer":"D","major_category":"组合数学","minor_category":"计数","tags":"计数;三角形;圆;正方形","key_idea":"建立不重不漏的分类或递推计数。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-23"},{"year":2022,"contest":"AMC 8","form":"","problem_no":24,"source":"2022 AMC 8 Problem 24","statement":"The figure below shows a polygon ABCDEFGH, consisting of rectangles and right triangles. When cut out and folded on the dotted lines, the polygon forms a triangular prism. Suppose that AH = EF = 8 and GH = 14. What is the volume of the prism? [图形] (A) 112 (B) 128 (C) 192 (D) 240 (E) 288","answer":"C","major_category":"几何与测量","minor_category":"体积","tags":"体积;三角形;矩形","key_idea":"确定底面积和高，或比较相似立体的体积。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-24"},{"year":2022,"contest":"AMC 8","form":"","problem_no":25,"source":"2022 AMC 8 Problem 25","statement":"A cricket randomly hops between 4 leaves, on each turn hopping to one of the other 3 leaves with equal probability. After 4 hops, what is the probability that the cricket has returned to the leaf where it started? (A) (2)/(9) (B) (19)/(80) (C) (20)/(81) (D) (1)/(4) (E) (7)/(27)","answer":"E","major_category":"概率与统计","minor_category":"概率","tags":"概率;AMC 8","key_idea":"确定等可能样本空间，计数有利结果并求比值。","notes":"题面包含图形；纯文本以 [图形] 标记图形位置；图形细节已对照原题 PDF 与 AoPS 题页；题面与选项按 AoPS Wiki 同年 Problems 页面核验；答案按对应 Answer Key 核验","detail_slug":"2022-amc-8-problem-25"}];
const filters={major:document.querySelector("#majorFilter"),minor:document.querySelector("#minorFilter"),search:document.querySelector("#searchInput")};
const cards=document.querySelector("#cards"),resultCount=document.querySelector("#resultCount"),currentSummary=document.querySelector("#currentSummary"),clearFilters=document.querySelector("#clearFilters");
const statTotal=document.querySelector("#statTotal"),statPart1=document.querySelector("#statPart1"),statPart2=document.querySelector("#statPart2"),statPart3=document.querySelector("#statPart3");
const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
function fill(select,values,current=select.value){select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");if(values.includes(current))select.value=current;}
function refreshOptions(){const cm=filters.major.value,cn=filters.minor.value;fill(filters.major,unique(problems.map(p=>p.major_category)),cm);const minorBase=problems.filter(p=>!filters.major.value||p.major_category===filters.major.value);fill(filters.minor,unique(minorBase.map(p=>p.minor_category)),cn);}
function matches(p){const q=filters.search.value.trim().toLowerCase();const hay=[p.problem_no,p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase();return(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q));}
function syncButtons(){document.querySelectorAll("[data-filter-major]").forEach(button=>{const major=button.dataset.filterMajor||"",minor=button.dataset.filterMinor||"";const active=filters.major.value===major&&(!minor||filters.minor.value===minor);button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active));});}
function render(){
  refreshOptions();
  const shown=problems.filter(matches).sort((a,b)=>Number(a.problem_no)-Number(b.problem_no));
  const partCounts=[shown.filter(p=>Number(p.problem_no)<=10).length,shown.filter(p=>Number(p.problem_no)>=11&&Number(p.problem_no)<=20).length,shown.filter(p=>Number(p.problem_no)>=21).length];
  statTotal.textContent=shown.length;statPart1.textContent=partCounts[0];statPart2.textContent=partCounts[1];statPart3.textContent=partCounts[2];
  resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`;
  const terms=[];if(filters.major.value)terms.push(filters.major.value);if(filters.minor.value)terms.push(filters.minor.value);if(filters.search.value.trim())terms.push(`搜索“${filters.search.value.trim()}”`);
  currentSummary.textContent=`当前筛选：${terms.length?terms.join(" · "):"全部分类"}`;
  syncButtons();
  cards.innerHTML=shown.length?shown.map(p=>`<a class="card problem-link" data-source="${esc(p.source)}" href="../problems/${esc(p.detail_slug)}/index.html" aria-label="查看 ${esc(p.source)} 的详细解答"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge answer">答案 ${esc(p.answer)}</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea"><strong>核心思路：</strong>${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").filter(Boolean).map(tag=>`<span class="badge">${esc(tag)}</span>`).join(" ")}</div><span class="detail-cta">查看解答 →</span></a>`).join(""):'<div class="empty">没有匹配的题目</div>';
  window.__AMC8_STATE__={year:String(problems[0]?.year??""),major:filters.major.value,minor:filters.minor.value,query:filters.search.value.trim(),visible:shown.length,partCounts};
}
Object.values(filters).forEach(control=>control.addEventListener("input",render));
document.addEventListener("click",event=>{const action=event.target.closest("[data-filter-major]");if(!action)return;filters.major.value=action.dataset.filterMajor||"";refreshOptions();filters.minor.value=action.dataset.filterMinor||"";filters.search.value="";render();});
clearFilters.addEventListener("click",()=>{Object.values(filters).forEach(control=>control.value="");render();});
render();
</script>
