  <style>
    :root { --bg:#f7f4ee; --panel:#fff; --ink:#1d252c; --muted:#66727f; --line:#d9ded9; --blue:#2166a5; --chip:#eef3f7; }
    * { box-sizing:border-box; } body { margin:0; font-family:Inter,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink); }
    header { padding:28px 32px 20px; background:#17324a; color:white; } h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; } header p { margin:0; color:#d7e4ef; }
    main { padding:24px 32px 40px; } .stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
    .stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; } .stat strong { display:block; font-size:26px; } .stat span,.muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr); gap:16px; margin-bottom:16px; }
    button { font:inherit; cursor:pointer; } .bar-row { width:100%; display:grid; grid-template-columns:86px 1fr 60px; gap:10px; align-items:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:7px; margin:7px 0; text-align:left; }
    .bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
    .track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; } .track span { display:block; height:100%; background:var(--blue); }
    .quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; } .quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; }
    .controls { display:grid; grid-template-columns:repeat(5,minmax(130px,1fr)); gap:10px; margin-bottom:14px; } label { display:grid; gap:6px; font-size:12px; color:var(--muted); } select,input { min-height:38px; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
    .clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; } .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; }
    .top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; } .source { font-weight:750; margin-right:auto; } .badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; } .badge.major { background:#e8f0dc; color:#35592f; }
    .statement,.idea { line-height:1.55; font-size:14px; } .idea { border-left:3px solid var(--blue); padding-left:10px; color:#33414e; font-size:13px; }
    @media (max-width:980px) { main { padding:18px; } header { padding:24px 18px 18px; } .stats,.grid,.controls { grid-template-columns:1fr; } }

    const problems = [{"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "1", "source": "2008 AMC 10A Problem 1", "statement": "A bakery owner turns on his doughnut machine at 8:30 AM. At 11:10 AM the machine has com- pleted one third of the day’s job. At what time will the doughnut machine complete the job? (A) 1:50 PM (B) 3:00 PM (C) 3:30 PM (D) 4:30 PM (E) 5:50 PM", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "2", "source": "2008 AMC 10A Problem 2", "statement": "A square is drawn inside a rectangle. The ratio of the width of the rectangle to a side of the square is 2 : 1. The ratio of the rectangle’s length to its width is 2 : 1. What percent of the rectangle’s area is inside the square? (A) 12.5 (B) 25 (C) 50 (D) 75 (E) 87.5", "answer": "", "major_category": "几何", "minor_category": "面积与相似", "tags": "面积;比例", "key_idea": "抓住面积比例、相似关系或周长约束建立方程。", "notes": ""}, {"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "3", "source": "2008 AMC 10A Problem 3", "statement": "For the positive integer n, let ⟨n⟩ denote the sum of all the positive divisors of n with the ex- ception of n itself. For example, ⟨4⟩ = 1 + 2 = 3 and ⟨12⟩ = 1 + 2 + 3 + 4 + 6 = 16 What is ⟨⟨⟨6⟩⟩⟩? (A) 6 (B) 12 (C) 24 (D) 32 (E) 36", "answer": "", "major_category": "数论", "minor_category": "整数构造", "tags": "整数;构造", "key_idea": "用整数范围、构造和极值条件筛选可能值。", "notes": ""}, {"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "4", "source": "2008 AMC 10A Problem 4", "statement": "Suppose that 2 of 10 bananas are worth as much as 8 oranges. How many oranges are worth 3 as much is 1 of 5 bananas? 2 (A) 2 (B) 5 (C) 3 (D) 7 (E) 4 2 2", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "5", "source": "2008 AMC 10A Problem 5", "statement": "Which of the following is equal to the product 8 12 16 4n + 4 2008 · · · · · · · · ? 4 8 12 4n 2004 (A) 251 (B) 502 (C) 1004 (D) 2008 (E) 4016", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "6", "source": "2008 AMC 10A Problem 6", "statement": "A triathlete competes in a triathlon in which the swimming, biking, and running segments are all of the same length. The triathlete swims at a rate of 3 kilometers per hour, bikes at a rate of 20 kilometers per hour, and runs at a rate of 10 kilometers per hour. Which of the following is closest to the triathlete’s average speed, in kilometers per hour, for the entire race? (A) 3 (B) 4 (C) 5 (D) 6 (E) 7", "answer": "", "major_category": "概率与统计", "minor_category": "平均数与数据集", "tags": "平均数;数据", "key_idea": "把平均数、总和或中位数条件转化为代数约束。", "notes": ""}, {"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "7", "source": "2008 AMC 10A Problem 7", "statement": "The fraction (32008)2 − (32006)2 (32007)2 − (32005)2 simplifies to which of the following? (A) 1 (B) 9 (C) 3 (D) 9 (E) 9 4 2", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "8", "source": "2008 AMC 10A Problem 8", "statement": "Heather compares the price of a new computer at two different stores. Store A offers 15% off the sticker price followed by a $90 rebate, and store B offers 25% off the same sticker price with no rebate. Heather saves $15 by buying the computer at store A instead of store B. What is the sticker price of the computer, in dollars? (A) 750 (B) 900 (C) 1000 (D) 1050 (E) 1500", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "9", "source": "2008 AMC 10A Problem 9", "statement": "Suppose that 2x x − 3 6 is an integer. Which of the following statements must be true about x? (A) It is negative. (B) It is even, but not necessarily a multiple of 3. (C) It is a multiple of 3, but not necessarily even. (D) It is a multiple of 6, but not necessarily a multiple of 12. (E) It is a multiple of 12.", "answer": "", "major_category": "数论", "minor_category": "整数构造", "tags": "整数;构造", "key_idea": "用整数范围、构造和极值条件筛选可能值。", "notes": ""}, {"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "10", "source": "2008 AMC 10A Problem 10", "statement": "Each of the sides of a square S with area 16 is bisected, and a smaller square S is constructed 1 2 using the bisection points as vertices. The same process is carried out on S to construct an 2 even smaller square S . What is the area of S ? 3 3 (A) 1 (B) 1 (C) 2 (D) 3 (E) 4 2", "answer": "", "major_category": "几何", "minor_category": "面积与相似", "tags": "面积;比例", "key_idea": "抓住面积比例、相似关系或周长约束建立方程。", "notes": ""}, {"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "11", "source": "2008 AMC 10A Problem 11", "statement": "While Steve and LeRoy are fishing 1 mile from shore, their boat springs a leak, and water comes in at a constant rate of 10 gallons per minute. The boat will sink if it takes in more than 30 gallons of water. Steve starts rowing toward the shore at a constant rate of 4 miles per hour while LeRoy bails water out of the boat. What is the slowest rate, in gallons per minute, at which LeRoy can bail if they are to reach the shore without sinking? (A) 2 (B) 4 (C) 6 (D) 8 (E) 10", "answer": "", "major_category": "代数", "minor_category": "三角恒等式", "tags": "三角函数;恒等式", "key_idea": "用三角恒等式、角度关系或特殊角化简。", "notes": ""}, {"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "12", "source": "2008 AMC 10A Problem 12", "statement": "In a collection of red, blue, and green marbles, there are 25% more red marbles than blue mar- bles, and there are 60% more green marbles than red marbles. Suppose that there are r red marbles. What is the total number of marbles in that collection? (A) 2.85r (B) 3r (C) 3.4r (D) 3.85r (E) 4.25r", "answer": "", "major_category": "概率与统计", "minor_category": "组合概率", "tags": "概率;计数", "key_idea": "分别计数有利情况与总情况，再化为概率。", "notes": ""}, {"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "13", "source": "2008 AMC 10A Problem 13", "statement": "Doug can paint a room in 5 hours. Dave can paint the same room in 7 hours. Doug and Dave paint the room together and take a one-hour break for lunch. Let t be the total time, in hours, required for them to complete the job working together, including lunch. Which of the following equations is satisfied by t? (A) (cid:0) 1 + 1 (cid:1) (t + 1) = 1 (B) (cid:0) 1 + 1 (cid:1) t + 1 = 1 (C) (cid:0) 1 + 1 (cid:1) t = 1 (D) (cid:0) 1 5 + 1 7(cid:1) (t − 1) = 1 (E) (5 5 + 7) 7 t = 1 5 7 5 7", "answer": "", "major_category": "代数", "minor_category": "方程与不等式", "tags": "方程;不等式", "key_idea": "将题设转化为方程组或不等式并求解。", "notes": ""}, {"year": "2008", "contest": "AMC 10", "form": "A", "problem_no": "14", "source": "2008 AMC 10A Problem 14", "statement": "Older television screens have an aspect ratio of 4 : 3. That is, the ratio of the width to the height is 4 : 3. The aspect ratio of many movies is not 4 : 3, so they are sometimes shown on a television screen by ’letterboxing’ - darkening strips of equal height at the top and bottom of the screen, as shown. Suppose a movie has an aspect ratio of 2 : 1 and is shown on an older television screen with a 27-inch diagonal. What is the height, in inches, of each darkened strip? (A) 2 (B) 2.25 (C) 2.5 (D) 2.7 (E) 3", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "题面包含图形；自动分类依     function fill(select, values, current=select.value){ select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(""); if(values.includes(current)) select.value=current; }
    function refreshOptions(){ const cm=filters.major.value, cn=filters.minor.value; const base=problems.filter(p=>!filters.form.value||p.form===filters.form.value); fill(filters.major, unique(base.map(p=>p.major_category)), cm); const minorBase=base.filter(p=>!filters.major.value||p.major_category===filters.major.value); fill(filters.minor, unique(minorBase.map(p=>p.minor_category)), cn); }
    function matches(p){ const q=filters.search.value.trim().toLowerCase(); const hay=[p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase(); return (!filters.form.value||p.form===filters.form.value)&&(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q)); }
    function syncButtons(){ document.querySelectorAll("[data-filter-major]").forEach(el=>{ const major=el.dataset.filterMajor||"", minor=el.dataset.filterMinor||""; el.classList.toggle("active", filters.major.value===major && (!minor || filters.minor.value===minor)); }); }
    function render(){ refreshOptions(); const shown=problems.filter(matches).sort((a,b)=>a.form.localeCompare(b.form)||Number(a.problem_no)-Number(b.problem_no)); resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`; syncButtons(); cards.innerHTML=shown.map(p=>`<article class="card"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge">${esc(p.form)}卷</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea">${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").map(t=>`<span class="badge">${esc(t)}</span>`).join(" ")}</div></article>`).join(""); }
    Object.values(filters).forEach(el=>el.addEventListener("input",render));
    document.addEventListener("click",e=>{ const action=e.target.closest("[data-filter-major]"); if(!action) return; filters.major.value=action.dataset.filterMajor||""; refreshOptions(); filters.minor.value=action.dataset.filterMinor||""; filters.search.value=""; render(); });
    clearFilters.addEventListener("click",()=>{ Object.values(filters).forEach(el=>el.value=""); render(); });
    render();
  </script>
</body>
</html>
