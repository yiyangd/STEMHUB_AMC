    .stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; } .stat strong { display:block; font-size:26px; } .stat span,.muted { color:var(--muted); }

    .bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
    .track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; } .track span { display:block; height:100%; background:var(--blue); }
    .quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; } .quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; }
    .controls { display:grid; grid-template-columns:repeat(5,minmax(130px,1fr)); gap:10px; margin-bottom:14px; } label { display:grid; gap:6px; font-size:12px; color:var(--muted); } select,input { min-height:38px; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
    .clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; } .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; }
    .top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; } .source { font-weight:750; margin-right:auto; } .badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; } .badge.major { background:#e8f0dc; color:#35592f; }

egory": "几何变换", "tags": "变换;对称", "key_idea": "用旋转、反射、对称或展开方法简化路径和角度。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "A", "problem_no": "21", "source": "2013 AMC 10A Problem 21", "statement": "A group of 12 pirates agree to divide a treasure chest of gold coins among themselves as fol- lows. The k th pirate to take a share takes k of the coins that remain in the chest. The number 12 of coins initially in the chest is the smallest number for which this arrangement will allow each pirate to receive a positive whole number of coins. How many coins does the 12 th pirate receive? (A) 720 (B) 1296 (C) 1728 (D) 1925 (E) 3850", "answer": "", "major_category": "概率与统计", "minor_category": "平均数与数据集", "tags": "平均数;数据", "key_idea": "把平均数、总和或中位数条件转化为代数约束。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "A", "problem_no": "22", "source": "2013 AMC 10A Problem 22", "statement": "Six spheres of radius 1 are positioned so that their centers are at the vertices of a regular hexagon of side length 2. The six spheres are internally tangent to a larger sphere whose center is the center of the hexagon. An eighth sphere is externally tangent to the six smaller spheres and internally tangent to the larger sphere. What is the radius of this eighth sphere? √ √ (A) 2 (B) 3 (C) 5 (D) 3 (E) 2 2 3", "answer": "", "major_category": "几何", "minor_category": "空间几何", "tags": "空间几何;体积", "key_idea": "用截面、相似、体积或空间距离关系建模。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "A", "problem_no": "23", "source": "2013 AMC 10A Problem 23", "statement": "In △ABC, AB = 86, and AC = 97. A circle with center A and radius AB intersects BC at points B and X. Moreover BX and CX have integer lengths. What is BC? (A) 11 (B) 28 (C) 33 (D) 61 (E) 72", "answer": "", "major_category": "几何", "minor_category": "圆与曲线", "tags": "圆;曲线", "key_idea": "利用圆、切线、曲线方程或几何约束求关键量。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "A", "problem_no": "24", "source": "2013 AMC 10A Problem 24", "statement": "Central High School is competing against Northern High School in a backgammon match. Each school has three players, and the contest rules require that each player play two games against each of the other’s school’s players. The match takes place in six rounds, with three games played simultaneously in each round. In how many different ways can the match be scheduled? (A) 540 (B) 600 (C) 720 (D) 810 (E) 900", "answer": "", "major_category": "代数", "minor_category": "三角恒等式", "tags": "三角函数;恒等式", "key_idea": "用三角恒等式、角度关系或特殊角化简。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "A", "problem_no": "25", "source": "2013 AMC 10A Problem 25", "statement": "All diagonals are drawn in a regular octagon. At how many distinct points in the interior of the octagon (not on the boundary) do two or more diagonals intersect? (A) 49 (B) 65 (C) 70 (D) 96 (E) 128", "answer": "", "major_category": "几何", "minor_category": "三角形", "tags": "三角形;角度", "key_idea": "运用三角形边角关系、三角函数或面积公式。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "1", "source": "2013 AMC 10B Problem 1", "statement": "What is 2+4+6 − 1+3+5 ? 1+3+5 2+4+6 (A) − 1 (B) 5 (C) 7 (D) 49 (E) 43 36 12 20 3", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "2", "source": "2013 AMC 10B Problem 2", "statement": "Mr Green measures his rectangular garden by walking two of the sides and finds that it is 15 steps by 20 steps. Each or Mr Green’s steps is two feet long. Mr Green expect half a pound of potatoes per square foot from his garden. How many pounds of potatoes does Mr Green expect from his garden? (A) 600 (B) 800 (C) 1000 (D) 1200 (E) 1400", "answer": "", "major_category": "几何", "minor_category": "三角形", "tags": "三角形;角度", "key_idea": "运用三角形边角关系、三角函数或面积公式。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "3", "source": "2013 AMC 10B Problem 3", "statement": "On a particular January day, the high temperature in Lincoln, Nebraska, was 16 degrees higher than the low temperature, and the average of the high and low temperatures was 3◦. In degrees, what was the low temperature in Lincoln that day? (A) − 13 (B) − 8 (C) − 5 (D) 3 (E) 11", "answer": "", "major_category": "概率与统计", "minor_category": "平均数与数据集", "tags": "平均数;数据", "key_idea": "把平均数、总和或中位数条件转化为代数约束。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "4", "source": "2013 AMC 10B Problem 4", "statement": "When counting from 3 to 201, 53 is the 51 st number counted. When counting backwards from 201 to 3, 53 is the n th number counted. What is n? (A) 146 (B) 147 (C) 148 (D) 149 (E) 150", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "5", "source": "2013 AMC 10B Problem 5", "statement": "Positive integers a and b are each less than 6. What is the smallest possible value for 2 · a − a · b? (A) − 20 (B) − 15 (C) − 10 (D) 0 (E) 2", "answer": "", "major_category": "数论", "minor_category": "整数构造", "tags": "整数;构造", "key_idea": "用整数范围、构造和极值条件筛选可能值。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "6", "source": "2013 AMC 10B Problem 6", "statement": "The average age of 33 fifth-graders is 11. The average age of 55 of their parents is 33. What is the average age of all of these parents and fifth-graders? (A) 22 (B) 23.25 (C) 24.75 (D) 26.25 (E) 28", "answer": "", "major_category": "概率与统计", "minor_category": "平均数与数据集", "tags": "平均数;数据", "key_idea": "把平均数、总和或中位数条件转化为代数约束。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "7", "source": "2013 AMC 10B Problem 7", "statement": "Six points are equally spaced around a circle of radius 1. Three of these points are the vertices of a triangle that is neither equilateral nor isosceles. What is the area of this triangle? √ √ √ (A) 3 (B) 3 (C) 1 (D) 2 (E) 2 3 2", "answer": "", "major_category": "几何", "minor_category": "圆与曲线", "tags": "圆;曲线", "key_idea": "利用圆、切线、曲线方程或几何约束求关键量。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "8", "source": "2013 AMC 10B Problem 8", "statement": "Ray’s car averages 40 miles per gallon of gasoline, and Tom’s car averages 10 miles per gallon of gasoline. Ray and Tom each drive the same number of miles. What is the cars’ combined rate of miles per gallon of gasoline? (A) 10 (B) 16 (C) 25 (D) 30 (E) 40", "answer": "", "major_category": "概率与统计", "minor_category": "平均数与数据集", "tags": "平均数;数据", "key_idea": "把平均数、总和或中位数条件转化为代数约束。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "9", "source": "2013 AMC 10B Problem 9", "statement": "Three positive integers are each greater than 1, have a product of 27000, and are pairwise rela- tively prime. What is their sum? (A) 100 (B) 137 (C) 156 (D) 160 (E) 165", "answer": "", "major_category": "数论", "minor_category": "质因数与整除", "tags": "质因数;整除", "key_idea": "分解质因数并检查整除条件。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "10", "source": "2013 AMC 10B Problem 10", "statement": "A basketball team’s players were successful on 50% of their two-point shots and 40% of their three-point shots, which resulted in 54 points. They attempted 50% more two-point shots than three-point shots. How many three-point shots did they attempt? (A) 10 (B) 15 (C) 20 (D) 25 (E) 30", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "11", "source": "2013 AMC 10B Problem 11", "statement": "Real numbers x and y satisfy the equation x2 + y2 = 10x − 6y − 34. What is x + y? (A) 1 (B) 2 (C) 3 (D) 6 (E) 8", "answer": "", "major_category": "代数", "minor_category": "方程与不等式", "tags": "方程;不等式", "key_idea": "将题设转化为方程组或不等式并求解。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "12", "source": "2013 AMC 10B Problem 12", "statement": "Let S be the set of sides and diagonals of a regular pentagon. A pair of elements of S are selected at random without replacement. What is the probability that the two chosen segments have the same length? (A) 2 (B) 4 (C) 1 (D) 5 (E) 4 5 9 2 9 5", "answer": "", "major_category": "概率与统计", "minor_category": "组合概率", "tags": "概率;计数", "key_idea": "分别计数有利情况与总情况，再化为概率。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "13", "source": "2013 AMC 10B Problem 13", "statement": "Jo and Blair take turns counting from 1 to one more than the last number said by the other person. Jo starts by saying ”1”, so Blair follows by saying ”1, 2”. Jo then says ”1, 2, 3”, and so on. What is the 53rd number said? (A) 2 (B) 3 (C) 5 (D) 6 (E) 8", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "14", "source": "2013 AMC 10B Problem 14", "statement": "Define a♣b = a2b − ab2. Which of the following describes the set of points (x, y) for which x♣y = y♣x? (A) a finite set of points (B) one line (C) two parallel lines (D two intersecting lines (E) three lines", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "15", "source": "2013 AMC 10B Problem 15", "statement": "A wire is cut into two pieces, one of length a and the other of length b. The piece of length a is bent to form an equilateral triangle, and the piece of length b is bent to form a regular hexagon. The triangle and the hexagon have equal area. What is a ? b √ √ √ (A) 1 (B) 6 (C) 3 (D 2 (E) 3 2 2 2", "answer": "", "major_category": "几何", "minor_category": "面积与相似", "tags": "面积;比例", "key_idea": "抓住面积比例、相似关系或周长约束建立方程。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "16", "source": "2013 AMC 10B Problem 16", "statement": "In △ABC, medians AD and CE intersect at P , P E = 1.5, P D = 2, and DE = 2.5. What is the area of AEDC? C D P A B E (A) 13 (B) 13.5 (C) 14 (D) 14.5 (E) 15", "answer": "", "major_category": "概率与统计", "minor_category": "平均数与数据集", "tags": "平均数;数据", "key_idea": "把平均数、总和或中位数条件转化为代数约束。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "17", "source": "2013 AMC 10B Problem 17", "statement": "Alex has 75 red tokens and 75 blue tokens. There is a booth where Alex can give two red tokens and receive in return a silver token and a blue token, and another booth where Alex can give three blue tokens and receive in return a silver token and a red token. Alex continues to exchange tokens until no more exchanges are possible. How many silver tokens will Alex have at the end? (A) 62 (B) 82 (C) 83 (D 102 (E) 103", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "18", "source": "2013 AMC 10B Problem 18", "statement": "The number 2013 has the property that its units digit is the sum of its other digits, that is 2 + 0 + 1 = 3. How many integers less than 2013 but greater than 1000 share this property? (A) 33 (B) 34 (C) 45 (D) 46 (E) 58", "answer": "", "major_category": "数论", "minor_category": "进制与数字", "tags": "数字;进制", "key_idea": "分析数字、位值或进制表示带来的整数约束。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "19", "source": "2013 AMC 10B Problem 19", "statement": "The real numbers c, b, a form an arithmetic sequence with a ≥ b ≥ c ≥ 0. The quadratic ax2 + bx + c has exactly one root. What is this root? √ √ √ √ (A) − 7 − 4 3 (B) − 2 − 3 (C) − 1 (D) − 2 + 3 (E) − 7 + 4 3", "answer": "", "major_category": "代数", "minor_category": "数列与递推", "tags": "数列;递推", "key_idea": "从递推式或数列结构中找显式式、周期或求和规律。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "20", "source": "2013 AMC 10B Problem 20", "statement": "The number 2013 is expressed in the form a !a ! · · · a ! 1 2 m 2013 = , b !b ! · · · b ! 1 2 n where a ≥ a ≥ · · · ≥ a and b ≥ b ≥ · · · ≥ b are positive integers and a + b is as small 1 2 m 1 2 n 1 1 as possible. What is |a − b |? 1 1 (A) 1 (B) 2 (C) 3 (D 4 (E) 5", "answer": "", "major_category": "数论", "minor_category": "整数构造", "tags": "整数;构造", "key_idea": "用整数范围、构造和极值条件筛选可能值。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "21", "source": "2013 AMC 10B Problem 21", "statement": "Two non-decreasing sequences of nonnegative integers have different first terms. Each se- quence has the property that each term beginning with the third is the sum of the previous two terms, and the seventh term of each sequence is N . What is the smallest possible value of N ? (A) 55 (B) 89 (C) 104 (D 144 (E) 273", "answer": "", "major_category": "组合数学", "minor_category": "递推与序列计数", "tags": "递推;序列", "key_idea": "建立状态递推或寻找周期规律计数。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "22", "source": "2013 AMC 10B Problem 22", "statement": "The regular octagon ABCDEF GH has its center at J . Each of the vertices and the center are to be associated with one of the digits 1 through 9, with each digit used once, in such a way that the sums of the numbers on the lines AJ E, BJ F , CJ G, and DJ H are equal. In how many ways can this be done? (A) 384 (B) 576 (C) 1152 (D) 1680 (E) 3546 A B H C J G D F E", "answer": "", "major_category": "组合数学", "minor_category": "排列组合", "tags": "排列组合;计数", "key_idea": "用分组、排列组合或容斥完成计数。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "23", "source": "2013 AMC 10B Problem 23", "statement": "In triangle ABC, AB = 13, BC = 14, and CA = 15. Distinct points D, E, and F lie on segments BC, CA, and DE, respectively, such that AD ⊥ BC, DE ⊥ AC, and AF ⊥ BF . The length of segment DF can be written as m , where m and n are relatively prime positive integers. What is n m + n? (A) 18 (B) 21 (C) 24 (D 27 (E) 30", "answer": "", "major_category": "几何", "minor_category": "三角形", "tags": "三角形;角度", "key_idea": "运用三角形边角关系、三角函数或面积公式。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "24", "source": "2013 AMC 10B Problem 24", "statement": "A positive integer n is nice if there is a positive integer m with exactly four positive divisors (including 1 and m) such that the sum of the four divisors is equal to n. How many numers in the set {2010, 2011, 2012, . . . , 2019} are nice? (A) 1 (B) 2 (C) 3 (D 4 (E) 5", "answer": "", "major_category": "数论", "minor_category": "整数构造", "tags": "整数;构造", "key_idea": "用整数范围、构造和极值条件筛选可能值。", "notes": ""}, {"year": "2013", "contest": "AMC 10", "form": "B", "problem_no": "25", "source": "2013 AMC 10B Problem 25", "statement": "Bernardo chooses a three-digit positive integer N and writes both its base-5 and base-6 repre- sentations on a blackboard. Later LeRoy sees the two numbers Bernardo has written. Treat- ing the two numbers as base-10 integers, he adds them to obtain an integer S. For exam- ple, if N = 749, Bernardo writes the numbers 10,444 and 3,245, and LeRoy obtains the sum S = 13, 689. For how many choices of N are the two rightmost digits of S, in order, the same as those of 2N ? (A) 5 (B) 10 (C) 15 (D 20 (E) 25 –", "answer": "", "major_category": "数论", "minor_category": "进制与数字", "tags": "数字;进制", "key_idea": "分析数字、位值或进制表示带来的整数约束。", "notes": ""}];
    const filters = { form:document.querySelector("#formFilter"), major:document.querySelector("#majorFilter"), minor:document.querySelector("#minorFilter"), search:document.querySelector("#searchInput") };
    const cards=document.querySelector("#cards"), resultCount=document.querySelector("#resultCount"), clearFilters=document.querySelector("#clearFilters");
    const esc=v=>String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
    function fill(select, values, current=select.value){ select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(""); if(values.includes(current)) select.value=current; }
    function refreshOptions(){ const cm=filters.major.value, cn=filters.minor.value; const base=problems.filter(p=>!filters.form.value||p.form===filters.form.value); fill(filters.major, unique(base.map(p=>p.major_category)), cm); const minorBase=base.filter(p=>!filters.major.value||p.major_category===filters.major.value); fill(filters.minor, unique(minorBase.map(p=>p.minor_category)), cn); }
    function matches(p){ const q=filters.search.value.trim().toLowerCase(); const hay=[p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase(); return (!filters.form.value||p.form===filters.form.value)&&(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q)); }
    function syncButtons(){ document.querySelectorAll("[data-filter-major]").forEach(el=>{ const major=el.dataset.filterMajor||"", minor=el.dataset.filterMinor||""; el.classList.toggle("active", filters.major.value===major && (!minor || filters.minor.value===minor)); }); }
    function render(){ refreshOptions(); const shown=problems.filter(matches).sort((a,b)=>a.form.localeCompare(b.form)||Number(a.problem_no)-Number(b.problem_no)); resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`; syncButtons(); cards.innerHTML=shown.map(p=>`<article class="card"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge">${esc(p.form)}卷</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea">${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").map(t=>`<span class="badge">${esc(t)}</span>`).join(" ")}</div></article>`).join(""); }
    Object.values(filters).forEach(el=>el.addEventListener("input",render));
    document.addEventListener("click",e=>{ const action=e.target.closest("[data-filter-major]"); if(!action) return; filters.major.value=action.dataset.filterMajor||""; refreshOptions(); filters.minor.value=action.dataset.filterMinor||""; filters.search.value=""; render(); });
    clearFilters.addEventListener("click",()=>{ Object.values(filters).forEach(el=>el.value=""); render(); });
    render();
  </script>
