at is BD ? √ √ √ √ BO (A) 2 (B) 1 (C) 3 (D) 2 (E) 3 3 2 3 2 2", "answer": "", "major_category": "几何", "minor_category": "圆与曲线", "tags": "圆;曲线", "key_idea": "利用圆、切线、曲线方程或几何约束求关键量。", "notes": ""}, {"year": "2009", "contest": "AMC 10", "form": "B", "problem_no": "17", "source": "2009 AMC 10B Problem 17", "statement": "Five unit squares are arranged in the coordinate plane as shown, with the lower left corner at the origin. The slanted line, extending from (a, 0) to (3, 3), divides the entire region into two regions of equal area. What is a? y (3, 3) (a, 0) x (A) 1 (B) 3 (C) 2 (D) 3 (E) 4 2 5 3 4 5", "answer": "", "major_category": "组合数学", "minor_category": "排列组合", "tags": "排列组合;计数", "key_idea": "用分组、排列组合或容斥完成计数。", "notes": "题面包含图形"}, {"year": "2009", "contest": "AMC 10", "form": "B", "problem_no": "18", "source": "2009 AMC 10B Problem 18", "statement": "Rectangle ABCD has AB = 8 and BC = 6. Point M is the midpoint of diagonal AC, and E is on AB with M E ⊥ AC. What is the area of △AM E? (A) 65 (B) 25 (C) 9 (D) 75 (E) 85 8 3 8 8", "answer": "", "major_category": "几何", "minor_category": "面积与相似", "tags": "面积;比例", "key_idea": "抓住面积比例、相似关系或周长约束建立方程。", "notes": ""}, {"year": "2009", "contest": "AMC 10", "form": "B", "problem_no": "19", "source": "2009 AMC 10B Problem 19", "statement": "A particular 12-hour digital clock displays the hour and minute of a day. Unfortunately, whenever it is supposed to display a 1, it mistakenly displays a 9. For example, when it is 1:16 PM the clock incorrectly shows 9:96 PM. What fraction of the day will the clock show the correct time? (A) 1 (B) 5 (C) 3 (D) 5 (E) 9 2 8 4 6 10", "answer": "", "major_category": "数论", "minor_category": "进制与数字", "tags": "数字;进制", "key_idea": "分析数字、位值或进制表示带来的整数约束。", "notes": ""}, {"year": "2009", "contest": "AMC 10", "form": "B", "problem_no": "20", "source": "2009 AMC 10B Problem 20", "statement": "Triangle ABC has a right angle at B, AB = 1, and BC = 2. The bisector of ∠BAC meets BC at D. What is BD? A", "answer": "", "major_category": "几何", "minor_category": "三角形", "tags": "三角形;角度", "key_idea": "运用三角形边角关系、三角函数或面积公式。", "notes": ""}, {"year": "2009", "contest": "AMC 10", "form": "B", "problem_no": "21", "source": "2009 AMC 10B Problem 21", "statement": "What is the remainder when 30 + 31 + 32 + . . . + 32009 is divided by 8? (A) 0 (B) 1 (C) 2 (D) 4 (E) 6", "answer": "", "major_category": "数论", "minor_category": "整除与同余", "tags": "同余;余数", "key_idea": "把条件转化为同余或余数分类讨论。", "notes": ""}, {"year": "2009", "contest": "AMC 10", "form": "B", "problem_no": "22", "source": "2009 AMC 10B Problem 22", "statement": "A cubical cake with edge length 2 inches is iced on the sides and the top. It is cut vertically into three pieces as shown in this top view, where M is the midpoint of a top edge. The piece whose top is triangle B contains c cubic inches of cake and s square inches of icing. What is c + s? A B M C √ √ √ (A) 24 (B) 32 (C) 8 + 5 (D) 5 + 16 5 (E) 10 + 5 5 5 5 5", "answer": "", "major_category": "几何", "minor_category": "三角形", "tags": "三角形;角度", "key_idea": "运用三角形边角关系、三角函数或面积公式。", "notes": "题面包含图形"}, {"year": "2009", "contest": "AMC 10", "form": "B", "problem_no": "23", "source": "2009 AMC 10B Problem 23", "statement": "Rachel and Robert run on a circular track. Rachel runs counterclockwise and completes a lap every 90 seconds, and Robert runs clockwise and completes a lap every 80 seconds. Both start from the start line at the same time. At some random time between 10 minutes and 11 minutes after they begin to run, a photographer standing inside the track takes a picture that shows one- fourth of the track, centered on the starting line. What is the probability that both Rachel and Robert are in the picture? (A) 1 (B) 1 (C) 3 (D) 1 (E) 5 16 8 16 4 16", "answer": "", "major_category": "概率与统计", "minor_category": "组合概率", "tags": "概率;计数", "key_idea": "分别计数有利情况与总情况，再化为概率。", "notes": ""}, {"year": "2009", "contest": "AMC 10", "form": "B", "problem_no": "24", "source": "2009 AMC 10B Problem 24", "statement": "The keystone arch is an ancient architectural feature. It is composed of congruent isosceles trapezoids fitted together along the non-parallel sides, as shown. The bottom sides of the two end trapezoids are horizontal. In an arch made with 9 trapezoids, let x be the angle measure in degrees of the larger interior angle of the trapezoid. What is x? (A) 100 (B) 102 (C) 104 (D) 106 (E) 108", "answer": "", "major_category": "几何", "minor_category": "三角形", "tags": "三角形;角度", "key_idea": "运用三角形边角关系、三角函数或面积公式。", "notes": "题面包含图形"}, {"year": "2009", "contest": "AMC 10", "form": "B", "problem_no": "25", "source": "2009 AMC 10B Problem 25", "statement": "Each face of a cube is given a single narrow stripe painted from the center of one edge to the center of its opposite edge. The choice of the edge pairing is made at random and independently for each face. What is the probability that there is a continuous stripe encircling the cube? (A) 1 (B) 3 (C) 1 (D) 3 (E) 1 8 16 4 8 2 –", "answer": "", "major_category": "概率与统计", "minor_category": "独立性", "tags": "独立事件;概率", "key_idea": "把事件关系转化为计数或比例条件。", "notes": ""}];
    const filters = { form:document.querySelector("#formFilter"), major:document.querySelector("#majorFilter"), minor:document.querySelector("#minorFilter"), search:document.querySelector("#searchInput") };
    const cards=document.querySelector("#cards"), resultCount=document.querySelector("#resultCount"), clearFilters=document.querySelector("#clearFilters");
    const esc=v=>String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
    function fill(select, values, current=select.value){ select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(""); if(values.includes(current)) select.value=current; }
    function refreshOptions(){ const cm=filters.major.value, cn=filters.minor.value; const base=problems.filter(p=>!filters.form.value||p.form===filters.form.value); fill(filters.major, unique(base.map(p=>p.major_category)), cm); const minorBase=base.filter(p=>!filters.major.value||p.major_category===filters.major.value); fill(filters.minor, unique(minorBase.map(p=>p.minor_category)), cn); }
    function matches(p){ const q=filters.search.value.trim().toLowerCase(); const hay=[p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase(); return (!filters.form.value||p.form===filters.form.value)&&(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q)); }
    function syncButtons(){ document.querySelectorAll("[data-filter-major]").forEach(el=>{ const major=el.dataset.filterMajor||"", minor=el.dataset.filterMinor||""; el.classList.toggle("active", filters.major.value===major && (!minor || filters.minor.value===minor)); }); }
    function render(){ refreshOptions(); const shown=problems.filter(matches).sort((a,b)=>a.form.localeCompare(b.form)||Number(a.problem_no)-Number(b.problem_no)); resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`; syncButtons(); cards.innerHTML=shown.map(p=>`<article class="card"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge">${esc(p.form)}卷</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea">${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").map(t=>`<span class="badge">${esc(t)}</span>`).join(" ")}</div></article>`).join(""); }
    Object.values(filters).forEach(el=>el.addEventListener("input",render));
    document.addEventListener("click",e=>{ const action=e.target.closest("[data-filter-major]"); if(!action) return; filters.major.value=action.dataset.filterMajor||""; refreshOptions(); filters.minor.value=action.dataset.filterMinor||""; filters.search.value=""; render(); });
    clearFilters.addEventListener("click",()=>{ Object.values(filters).forEach(el=>el.value=""); render(); });
    render();
  </script>
