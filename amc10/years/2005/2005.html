t of the money she earned on her weekend job to buy several equally-priced CDs. She used one fifth of her money to buy one third of the CDs. What fraction of her money will she have left after she buys all the CDs? (A) 1 (B) 1 (C) 2 (D) 2 (E) 4 5 3 5 3 5", "answer": "", "major_category": "代数", "minor_category": "三角恒等式", "tags": "三角函数;恒等式", "key_idea": "用三角恒等式、角度关系或特殊角化简。", "notes": ""}, {"year": "2005", "contest": "AMC 10", "form": "B", "problem_no": "6", "source": "2005 AMC 10B Problem 6", "statement": "At the beginning of the school year, Lisa’s goal was to earn an A on at least 80% of her 50 quizzes for the year. She earned an A on 22 of the first 30 quizzes. If she is to achieve her goal, on at most how many of the remaining quizzes can she earn a grade lower than an A? (A) 1 (B) 2 (C) 3 (D) 4 (E) 5", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2005", "contest": "AMC 10", "form": "B", "problem_no": "7", "source": "2005 AMC 10B Problem 7", "statement": "A circle is inscribed in a square, then a square is inscribed in this circle, and finally, a circle is inscribed in this square. What is the ratio of the area of the smaller circle to the area of the larger square? (A) π (B) π (C) 3π (D) π (E) π 16 8 16 4 2", "answer": "", "major_category": "几何", "minor_category": "圆与曲线", "tags": "圆;曲线", "key_idea": "利用圆、切线、曲线方程或几何约束求关键量。", "notes": ""}, {"year": "2005", "contest": "AMC 10", "form": "B", "problem_no": "8", "source": "2005 AMC 10B Problem 8", "statement": "An 8-foot by 10-foot floor is tiled with square tiles of size 1 foot by 1 foot. Each tile has a pattern consisting of four white quarter circles of radius 1/2 foot centered at each corner of the tile. The remaining portion of the tile is shaded. How many square feet of the floor are shaded? (A) 80 − 20π (B) 60 − 10π (C) 80 − 10π (D) 60 + 10π (E) 80 + 10π", "answer": "", "major_category": "几何", "minor  "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2005", "contest": "AMC 10", "form": "B", "problem_no": "18", "source": "2005 AMC 10B Problem 18", "statement": "All of David’s telephone numbers have the form 555 − abc − def g, where a, b, c, d, e, f , and g are distinct digits and in increasing order, and none is either 0 or 1. How many different telephone numbers can David have? (A) 1 (B) 2 (C) 7 (D) 8 (E) 9", "answer": "", "major_category": "数论", "minor_category": "进制与数字", "tags": "数字;进制", "key_idea": "分析数字、位值或进制表示带来的整数约束。", "notes": ""}, {"year": "2005", "contest": "AMC 10", "form": "B", "problem_no": "19", "source": "2005 AMC 10B Problem 19", "statement": "On a certain math exam, 10% of the students got 70 points, 25% got 80 points, 20% got 85 points, 15% got 90 points, and the rest got 95 points. What is the difference between the mean and the median score on this exam? (A) 0 (B) 1 (C) 2 (D) 4 (E) 5", "answer": "", "major_category": "概率与统计", "minor_category": "平均数与数据集", "tags": "平均数;数据", "key_idea": "把平均数、总和或中位数条件转化为代数约束。", "notes": ""}, {"year": "2005", "contest": "AMC 10", "form": "B", "problem_no": "20", "source": "2005 AMC 10B Problem 20", "statement": "What is the average (mean) of all 5-digit numbers that can be formed by using each of the digits 1, 3, 5, 7, and 8 exactly once? (A) 48000 (B) 49999.5 (C) 53332.8 (D) 55555 (E) 56432.8", "answer": "", "major_category": "概率与统计", "minor_category": "平均数与数据集", "tags": "平均数;数据", "key_idea": "把平均数、总和或中位数条件转化为代数约束。", "notes": ""}, {"year": "2005", "contest": "AMC 10", "form": "B", "problem_no": "21", "source": "2005 AMC 10B Problem 21", "statement": "Forty slips are placed into a hat, each bearing a number 1, 2, 3, 4, 5, 6, 7, 8, 9, or 10, with each number entered on four slips. Four slips are drawn from the hat at random and without replace- ment. Let p be the probability that all four slips bear the same number. Let q be the probability that two of the slips bear a number a and the other two bear a number b ̸= a. What is the value of q/p? (A) 162 (B) 180 (C) 324 (D) 360 (E) 720", "answer": "", "major_category": "概率与统计", "minor_category": "组合概率", "tags": "概率;计数", "key_idea": "分别计数有利情况与总情况，再化为概率。", "notes": ""}, {"year": "2005", "contest": "AMC 10", "form": "B", "problem_no": "22", "source": "2005 AMC 10B Problem 22", "statement": "For how many positive integers n less than or equal to 24 is n! evenly divisible by 1 + 2 + · · · + n? (A) 8 (B) 12 (C) 16 (D) 17 (E) 21", "answer": "", "major_category": "数论", "minor_category": "质因数与整除", "tags": "质因数;整除", "key_idea": "分解质因数并检查整除条件。", "notes": ""}, {"year": "2005", "contest": "AMC 10", "form": "B", "problem_no": "23", "source": "2005 AMC 10B Problem 23", "statement": "In trapezoid ABCD we have AB parallel to DC, E as the midpoint of BC, and F as the midpoint of DA. The area of ABEF is twice the area of F ECD. What is AB/DC? (A) 2 (B) 3 (C) 5 (D) 6 (E) 8", "answer": "", "major_category": "几何", "minor_category": "面积与相似", "tags": "面积;比例", "key_idea": "抓住面积比例、相似关系或周长约束建立方程。", "notes": ""}, {"year": "2005", "contest": "AMC 10", "form": "B", "problem_no": "24", "source": "2005 AMC 10B Problem 24", "statement": "Let x and y be two-digit integers such that y is obtained by reversing the digits of x. The integers x and y satisfy x2 − y2 = m2 for some positive integer m. What is x + y + m? (A) 88 (B) 112 (C) 116 (D) 144 (E) 154", "answer": "", "major_category": "数论", "minor_category": "进制与数字", "tags": "数字;进制", "key_idea": "分析数字、位值或进制表示带来的整数约束。", "notes": ""}, {"year": "2005", "contest": "AMC 10", "form": "B", "problem_no": "25", "source": "2005 AMC 10B Problem 25", "statement": "A subset B of the set of integers from 1 to 100, inclusive, has the property that no two elements of B sum to 125. What is the maximum possible number of elements in B? (A) 50 (B) 51 (C) 62 (D) 65 (E) 68 –", "answer": "", "major_category": "数论", "minor_category": "整数构造", "tags": "整数;构造", "key_idea": "用整数范围、构造和极值条件筛选可能值。", "notes": ""}];
    const filters = { form:document.querySelector("#formFilter"), major:document.querySelector("#majorFilter"), minor:document.querySelector("#minorFilter"), search:document.querySelector("#searchInput") };
    const cards=document.querySelector("#cards"), resultCount=document.querySelector("#resultCount"), clearFilters=document.querySelector("#clearFilters");
    const esc=v=>String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
    function fill(select, values, current=select.value){ select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(""); if(values.includes(current)) select.value=current; }
    function refreshOptions(){ const cm=filters.major.value, cn=filters.minor.value; const base=problems.filter(p=>!filters.form.value||p.form===filters.form.value); fill(filters.major, unique(base.map(p=>p.major_category)), cm); const minorBase=base.filter(p=>!filters.major.value||p.major_category===filters.major.value); fill(filters.minor, unique(minorBase.map(p=>p.minor_category)), cn); }
    function matches(p){ const q=filters.search.value.trim().toLowerCase(); const hay=[p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase(); return (!filters.form.value||p.form===filters.form.value)&&(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q)); }
    function syncButtons(){ document.querySelectorAll("[data-filter-major]").forEach(el=>{ const major=el.dataset.filterMajor||"", minor=el.dataset.filterMinor||""; el.classList.toggle("active", filters.major.value===major && (!minor || filters.minor.value===minor)); }); }
    function render(){ refreshOptions(); const shown=problems.filter(matches).sort((a,b)=>a.form.localeCompare(b.form)||Number(a.problem_no)-Number(b.problem_no)); resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`; syncButtons(); cards.innerHTML=shown.map(p=>`<article class="card"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge">${esc(p.form)}卷</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea">${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").map(t=>`<span class="badge">${esc(t)}</span>`).join(" ")}</div></article>`).join(""); }
    Object.values(filters).forEach(el=>el.addEventListener("input",render));
    document.addEventListener("click",e=>{ const action=e.target.closest("[data-filter-major]"); if(!action) return; filters.major.value=action.dataset.filterMajor||""; refreshOptions(); filters.minor.value=action.dataset.filterMinor||""; filters.search.value=""; render(); });
    clearFilters.addEventListener("click",()=>{ Object.values(filters).forEach(el=>el.value=""); render(); });
    render();
  </script>
