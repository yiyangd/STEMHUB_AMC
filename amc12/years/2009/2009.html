    button { font:inherit; cursor:pointer; } .bar-row { width:100%; display:grid; grid-template-columns:86px 1fr 60px; gap:10px; align-items:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:7px; margin:7px 0; text-align:left; }
    .bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
    .track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; } .track span { display:block; height:100%; background:var(--blue); }
    .quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; } .quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; }
    .controls { display:grid; grid-template-columns:repeat(5,minmax(130px,1fr)); gap:10px; margin-bottom:14px; } label { display:grid; gap:6px; font-size:12px; color:var(--muted); } select,input { min-height:38px; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
    .clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; } .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; }

, "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2009", "contest": "AMC 12", "form": "B", "problem_no": "17", "source": "2009 AMC 12B Problem 17", "statement": "Each face of a cube is given a single narrow stripe painted from the center of one edge to the center of its opposite edge. The choice of the edge pairing is made at random and independently for each face. What is the probability that there is a continuous stripe encircling the cube? (A) 1 (B) 3 (C) 1 (D) 3 (E) 1 8 16 4 8 2", "answer": "", "major_category": "概率与统计", "minor_category": "独立性", "tags": "独立事件;概率", "key_idea": "把事件关系转化为计数或比例条件。", "notes": ""}, {"year": "2009", "contest": "AMC 12", "form": "B", "problem_no": "18", "source": "2009 AMC 12B Problem 18", "statement": "Rachel and Robert run on a circular track. Rachel runs counterclockwise and completes a lap every 90 seconds, and Robert runs clockwise and completes a lap every 80 seconds. Both start from the start line at the same time. At some random time between 10 minutes and 11 minutes after they begin to run, a photographer standing inside the track takes a picture that shows one- fourth of the track, centered on the starting line. What is the probability that both Rachel and Robert are in the picture? (A) 1 (B) 1 (C) 3 (D) 1 (E) 5 16 8 16 4 16", "answer": "", "major_category": "概率与统计", "minor_category": "组合概率", "tags": "概率;计数", "key_idea": "分别计数有利情况与总情况，再化为概率。", "notes": ""}, {"year": "2009", "contest": "AMC 12", "form": "B", "problem_no": "19", "source": "2009 AMC 12B Problem 19", "statement": "For each positive integer n, let f (n) = n4 − 360n2 + 400. What is the sum of all values of f (n) that are prime numbers? (A) 794 (B) 796 (C) 798 (D) 800 (E) 802", "answer": "", "major_category": "数论", "minor_category": "质因数与整除", "tags": "质因数;整除", "key_idea": "分解质因数并检查整除条件。", "notes": ""}, {"year": "2009", "contest": "AMC 12", "form": "B", "problem_no": "20", "source": "2009 AMC 12B Problem 20", "statement": "A convex polyhedron Q has vertices V , V , . . . , V , and 100 edges. The polyhedron is cut by 1 2 n planes P , P , . . . , P in such a way that plane P cuts only those edges that meet at vertex V . 1 2 n k k In addition, no two planes intersect inside or on Q. The cuts produce n pyramids and a new polyhedron R. How many edges does R have? (A) 200 (B) 2n (C) 300 (D) 400 (E) 4n", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2009", "contest": "AMC 12", "form": "B", "problem_no": "21", "source": "2009 AMC 12B Problem 21", "statement": "Ten women sit in 10 seats in a line. All of the 10 get up and then reseat themselves using all 10 seats, each sitting in the seat she was in before or a seat next to the one she occupied before. In how many ways can the women be reseated? (A) 89 (B) 90 (C) 120 (D) 210 (E) 2238", "answer": "", "major_category": "组合数学", "minor_category": "排列组合", "tags": "排列组合;计数", "key_idea": "用分组、排列组合或容斥完成计数。", "notes": ""}, {"year": "2009", "contest": "AMC 12", "form": "B", "problem_no": "22", "source": "2009 AMC 12B Problem 22", "statement": "Parallelogram ABCD has area 1,000,000. Vertex A is at (0, 0) and all other vertices are in the first quadrant. Vertices B and D are lattice points on the lines y = x and y = kx for some integer k > 1, respectively. How many such parallelograms are there? (A) 49 (B) 720 (C) 784 (D) 2009 (E) 2048", "answer": "", "major_category": "几何", "minor_category": "面积与相似", "tags": "面积;比例", "key_idea": "抓住面积比例、相似关系或周长约束建立方程。", "notes": ""}, {"year": "2009", "contest": "AMC 12", "form": "B", "problem_no": "23", "source": "2009 AMC 12B Problem 23", "statement": "A region S in the complex plane is defined by S = {x + iy : −1 ≤ x ≤ 1, −1 ≤ y ≤ 1}. A complex number z = x + iy is chosen uniformly at random from S. What is the probability that (cid:0) 3 + 3 i (cid:1) z is also in S? 4 4 (A) 1 (B) 2 (C) 3 (D) 7 (E) 7 2 3 4 9 8", "answer": "", "major_category": "概率与统计", "minor_category": "组合概率", "tags": "概率;计数", "key_idea": "分别计数有利情况与总情况，再化为概率。", "notes": ""}, {"year": "2009", "contest": "AMC 12", "form": "B", "problem_no": "24", "source": "2009 AMC 12B Problem 24", "statement": "For how many values of x in [0, π] is sin 1(sin 6x) = cos 1(cos x)? − − Note: The functions sin 1 = arcsin and cos 1 = arccos denote inverse trigonometric functions. − − (A) 3 (B) 4 (C) 5 (D) 6 (E) 7", "answer": "", "major_category": "代数", "minor_category": "三角恒等式", "tags": "三角函数;恒等式", "key_idea": "用三角恒等式、角度关系或特殊角化简。", "notes": ""}, {"year": "2009", "contest": "AMC 12", "form": "B", "problem_no": "25", "source": "2009 AMC 12B Problem 25", "statement": "The set G is defined by the points (x, y) with integer coordinates, 3 ≤ |x| ≤ 7, 3 ≤ |y| ≤ 7. How many squares of side at least 6 have their four vertices in G? 7 3 7 3 3 7 − − 3 − 7 − (A) 125 (B) 150 (C) 175 (D) 200 (E) 225 –", "answer": "", "major_category": "几何", "minor_category": "坐标几何", "tags": "坐标;几何", "key_idea": "建立坐标或使用距离、斜率、面积公式求解。", "notes": ""}];
    const filters = { form:document.querySelector("#formFilter"), major:document.querySelector("#majorFilter"), minor:document.querySelector("#minorFilter"), search:document.querySelector("#searchInput") };
    const cards=document.querySelector("#cards"), resultCount=document.querySelector("#resultCount"), clearFilters=document.querySelector("#clearFilters");
    const esc=v=>String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
    function fill(select, values, current=select.value){ select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(""); if(values.includes(current)) select.value=current; }
    function refreshOptions(){ const cm=filters.major.value, cn=filters.minor.value; const base=problems.filter(p=>!filters.form.value||p.form===filters.form.value); fill(filters.major, unique(base.map(p=>p.major_category)), cm); const minorBase=base.filter(p=>!filters.major.value||p.major_category===filters.major.value); fill(filters.minor, unique(minorBase.map(p=>p.minor_category)), cn); }
    function matches(p){ const q=filters.search.value.trim().toLowerCase(); const hay=[p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase(); return (!filters.form.value||p.form===filters.form.value)&&(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q)); }
    function syncButtons(){ document.querySelectorAll("[data-filter-major]").forEach(el=>{ const major=el.dataset.filterMajor||"", minor=el.dataset.filterMinor||""; el.classList.toggle("active", filters.major.value===major && (!minor || filters.minor.value===minor)); }); }
    function render(){ refreshOptions(); const shown=problems.filter(matches).sort((a,b)=>a.form.localeCompare(b.form)||Number(a.problem_no)-Number(b.problem_no)); resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`; syncButtons(); cards.innerHTML=shown.map(p=>`<article class="card"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge">${esc(p.form)}卷</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea">${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").map(t=>`<span class="badge">${esc(t)}</span>`).join(" ")}</div></article>`).join(""); }
    Object.values(filters).forEach(el=>el.addEventListener("input",render));
    document.addEventListener("click",e=>{ const action=e.target.closest("[data-filter-major]"); if(!action) return; filters.major.value=action.dataset.filterMajor||""; refreshOptions(); filters.minor.value=action.dataset.filterMinor||""; filters.search.value=""; render(); });
    clearFilters.addEventListener("click",()=>{ Object.values(filters).forEach(el=>el.value=""); render(); });
    render();
