  <style>
    :root { --bg:#f7f4ee; --panel:#fff; --ink:#1d252c; --muted:#66727f; --line:#d9ded9; --blue:#2166a5; --chip:#eef3f7; }
    * { box-sizing:border-box; } body { margin:0; font-family:Inter,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink); }
    header { padding:28px 32px 20px; background:#17324a; color:white; } h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; } header p { margin:0; color:#d7e4ef; }
    main { padding:24px 32px 40px; } .stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
    .stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; } .stat strong { display:block; font-size:26px; } .stat span,.muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr); gap:16px; margin-bottom:16px; }
    button { font:inherit; cursor:pointer; } .bar-row { width:100%; display:grid; grid-template-columns:86px 1fr 60px; gap:10px; align-items:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:7px; margin:7px 0; text-align:left; }
    .bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
    .track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; } .track span { display:block; height:100%; background:var(--blue); }
    .quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; } .quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; }
    .controls { display:grid; grid-template-columns:repeat(5,minmax(130px,1fr)); gap:10px; margin-bottom:14px; } label { display:grid; gap:6px; font-size:12px; color:var(--muted); } select,input { min-height:38px; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
    .clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; } .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; }
    .top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; } .source { font-weight:750; margin-right:auto; } .badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; } .badge.major { background:#e8f0dc; color:#35592f; }
    .statement,.idea { line-height:1.55; font-size:14px; } .idea { border-left:3px solid var(--blue); padding-left:10px; color:#33414e; font-size:13px; }
    @media (max-width:980px) { main { padding:18px; } header { padding:24px 18px 18px; } .stats,.grid,.controls { grid-template-columns:1fr; } }

  <script>
    const problems = [{"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "1", "source": "2018 AMC 12A Problem 1", "statement": "A large urn contains 100 balls, of which 36% are red and the rest are blue. How many of the blue balls must be removed so that the percentage of red balls in the urn will be 72%? (No red balls are to be removed.) (A) 28 (B) 32 (C) 36 (D) 50 (E) 64", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "2", "source": "2018 AMC 12A Problem 2", "statement": "While exploring a cave, Carl comes across a collection of 5-pound rocks worth $14 each, 4- pound rocks worth $11 each, and 1-pound rocks worth $2 each. There are at least 20 of each size. He can carry at most 18 pounds. What is the maximum value, in dollars, of the rocks he can carry out of the cave? (A) 48 (B) 49 (C) 50 (D) 51 (E) 52", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "3", "source": "2018 AMC 12A Problem 3", "statement": "How many ways can a student schedule 3 mathematics courses – algebra, geometry, and number theory – in a 6-period day if no two mathematics courses can be taken in consecutive periods? (What courses the student takes during the other 3 periods is of no concern here.) (A) 3 (B) 6 (C) 12 (D) 18 (E) 24", "answer": "", "major_category": "组合数学", "minor_category": "排列组合", "tags": "排列组合;计数", "key_idea": "用分组、排列组合或容斥完成计数。", "notes": ""}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "4", "source": "2018 AMC 12A Problem 4", "statement": "Alice, Bob, and Charlie were on a hike and were wondering how far away the nearest town was. When Alice said, ”We are at least 6 miles away,” Bob replied, ”We are at most 5 miles away.” Charlie then remarked, ”Actually the nearest town is at most 4 miles away.” It turned out that none of the three statements were true. Let d be the distance in miles to the nearest town. Which of the following intervals is the set of all possible values of d? (A) (0, 4) (B) (4, 5) (C) (4, 6) (D) (5, 6) (E) (5, ∞)", "answer": "", "major_category": "代数", "minor_category": "三角恒等式", "tags": "三角函数;恒等式", "key_idea": "用三角恒等式、角度关系或特殊角化简。", "notes": ""}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "5", "source": "2018 AMC 12A Problem 5", "statement": "What is the sum of all possible values of k for which the polynomials x2 − 3x + 2 and x2 − 5x + k have a root in common? (A) 3 (B) 4 (C) 5 (D) 6 (E) 10", "answer": "", "major_category": "代数", "minor_category": "多项式与根", "tags": "多项式;根", "key_idea": "结合韦达定理、整数根或多项式结构求解。", "notes": ""}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "6", "source": "2018 AMC 12A Problem 6", "statement": "For positive integers m and n such that m + 10 < n + 1, both the mean and the median of the set {m, m + 4, m + 10, n + 1, n + 2, 2n} are equal to n. What is m + n? (A) 20 (B) 21 (C) 22 (D) 23 (E) 24", "answer": "", "major_category": "概率与统计", "minor_category": "平均数与数据集", "tags": "平均数;数据", "key_idea": "把平均数、总和或中位数条件转化为代数约束。", "notes": ""}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "7", "source": "2018 AMC 12A Problem 7", "statement": "For how many (not necessarily positive) integer values of n is the value of 4000· (cid:0) 2 (cid:1)n an integer? 5 (A) 3 (B) 4 (C) 6 (D) 8 (E) 9", "answer": "", "major_category": "数论", "minor_category": "整数构造", "tags": "整数;构造", "key_idea": "用整数范围、构造和极值条件筛选可能值。", "notes": ""}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "8", "source": "2018 AMC 12A Problem 8", "statement": "All of the triangles in the diagram below are similar to iscoceles triangle ABC, in which AB = AC. Each of the 7 smallest triangles has area 1, and (cid:52)ABC has area 40. What is the area of trapezoid DBCE? A D E B C (A) 16 (B) 18 (C) 20 (D) 22 (E) 24", "answer": "", "major_category": "几何", "minor_category": "面积与相似", "tags": "面积;比例", "key_idea": "抓住面积比例、相似关系或周长约束建立方程。", "notes": "题面包含图形"}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "9", "source": "2018 AMC 12A Problem 9", "statement": "Which of the following describes the largest subset of values of y within the closed interval [0, π] for which sin(x + y) ≤ sin(x) + sin(y) for every x between 0 and π, inclusive? (A) y = 0 (B) 0 ≤ y ≤ π (C) 0 ≤ y ≤ π (D) 0 ≤ 4 2 y ≤ 3π (E) 0 ≤ y ≤ π 4", "answer": "", "major_category": "代数", "minor_category": "三角恒等式", "tags": "三角函数;恒等式", "key_idea": "用三角恒等式、角度关系或特殊角化简。", "notes": ""}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "10", "source": "2018 AMC 12A Problem 10", "statement": "How many ordered pairs of real numbers (x, y) satisfy the following system of equations? x + 3y = 3 (cid:12) (cid:12) (cid:12)|x| − |y|(cid:12) = 1 (A) 1 (B) 2 (C) 3 (D) 4 (E) 8", "answer": "", "major_category": "代数", "minor_category": "方程与不等式", "tags": "方程;不等式", "key_idea": "将题设转化为方程组或不等式并求解。", "notes": ""}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "11", "source": "2018 AMC 12A Problem 11", "statement": "A paper triangle with sides of lengths 3, 4, and 5 inches, as shown, is folded so that point A falls on point B. What is the length in inches of the crease? B 5", "answer": "", "major_category": "几何", "minor_category": "三角形", "tags": "三角形;角度", "key_idea": "运用三角形边角关系、三角函数或面积公式。", "notes": "题面包含图形"}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "12", "source": "2018 AMC 12A Problem 12", "statement": "Let S be a set of 6 integers taken from {1, 2, . . . , 12} with the property that if a and b are el- ements of S with a < b, then b is not a multiple of a. What is the least possible value of an element in S? (A) 2 (B) 3 (C) 4 (D) 5 (E) 7", "answer": "", "major_category": "数论", "minor_category": "整数构造", "tags": "整数;构造", "key_idea": "用整数范围、构造和极值条件筛选可能值。", "notes": ""}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "13", "source": "2018 AMC 12A Problem 13", "statement": "How many nonnegative integers can be written in the form a · 37 + a · 36 + a · 35 + a · 34 + a · 33 + a · 32 + a · 31 + a · 30, 7 6 5 4 3 2 1 0 where a ∈ {−1, 0, 1} for 0 ≤ i ≤ 7? i (A) 512 (B) 729 (C) 1094 (D) 3281 (E) 59, 048", "answer": "", "major_category": "数论", "minor_category": "整数构造", "tags": "整数;构造", "key_idea": "用整数范围、构造和极值条件筛选可能值。", "notes": ""}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "14", "source": "2018 AMC 12A Problem 14", "statement": "The solution to the equation log 4 = log 8, where x is a positive real number other than 1 3x 2x 3 or 1 , can be written as p where p and q are relatively prime positive integers. What is p + q? 2 q (A) 5 (B) 13 (C) 17 (D) 31 (E) 35", "answer": "", "major_category": "数论", "minor_category": "质因数与整除", "tags": "质因数;整除", "key_idea": "分解质因数并检查整除条件。", "notes": ""}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "15", "source": "2018 AMC 12A Problem 15", "statement": "A scanning code consists of a 7 × 7 grid of squares, with some of its squares colored black and the rest colored white. There must be at least one square of each color in this grid of 49 squares. A scanning code is called symmetric if its look does not change when the entire square is rotated by a multiple of 90◦ counterclockwise around its center, nor when it is re- flected across a line joining opposite corners or a line joining midpoints of opposite sides. What is the total number of possible symmetric scanning codes? (A) 510 (B) 1022 (C) 8190 (D) 8192 (E) 65,534", "answer": "", "major_category": "组合数学", "minor_category": "图形计数", "tags": "网格;计数", "key_idea": "把图形限制转化为状态或结构计数。", "notes": "题面包含图形"}, {"year": "2018", "contest": "AMC 12", "form": "A", "problem_no": "16", "source": "2018 AMC 12A Problem 16", "s     function refreshOptions(){ const cm=filters.major.value, cn=filters.minor.value; const base=problems.filter(p=>!filters.form.value||p.form===filters.form.value); fill(filters.major, unique(base.map(p=>p.major_category)), cm); const minorBase=base.filter(p=>!filters.major.value||p.major_category===filters.major.value); fill(filters.minor, unique(minorBase.map(p=>p.minor_category)), cn); }
    function matches(p){ const q=filters.search.value.trim().toLowerCase(); const hay=[p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase(); return (!filters.form.value||p.form===filters.form.value)&&(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q)); }
    function syncButtons(){ document.querySelectorAll("[data-filter-major]").forEach(el=>{ const major=el.dataset.filterMajor||"", minor=el.dataset.filterMinor||""; el.classList.toggle("active", filters.major.value===major && (!minor || filters.minor.value===minor)); }); }
    function render(){ refreshOptions(); const shown=problems.filter(matches).sort((a,b)=>a.form.localeCompare(b.form)||Number(a.problem_no)-Number(b.problem_no)); resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`; syncButtons(); cards.innerHTML=shown.map(p=>`<article class="card"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge">${esc(p.form)}卷</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea">${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").map(t=>`<span class="badge">${esc(t)}</span>`).join(" ")}</div></article>`).join(""); }
    Object.values(filters).forEach(el=>el.addEventListener("input",render));
    document.addEventListener("click",e=>{ const action=e.target.closest("[data-filter-major]"); if(!action) return; filters.major.value=action.dataset.filterMajor||""; refreshOptions(); filters.minor.value=action.dataset.filterMinor||""; filters.search.value=""; render(); });
    clearFilters.addEventListener("click",()=>{ Object.values(filters).forEach(el=>el.value=""); render(); });
    render();
  </script>
</body>
</html>
