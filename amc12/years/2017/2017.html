  <style>
    :root { --bg:#f7f4ee; --panel:#fff; --ink:#1d252c; --muted:#66727f; --line:#d9ded9; --blue:#2166a5; --chip:#eef3f7; }
    * { box-sizing:border-box; } body { margin:0; font-family:Inter,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink); }
    header { padding:28px 32px 20px; background:#17324a; color:white; } h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; } header p { margin:0; color:#d7e4ef; }
    main { padding:24px 32px 40px; } .stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
    .stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; } .stat strong { display:block; font-size:26px; } .stat span,.muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr); gap:16px; margin-bottom:16px; }
    button { font:inherit; cursor:pointer; } .bar-row { width:100%; display:grid; grid-template-columns:86px 1fr 60px; gap:10px; align-items:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:7px; margin:7px 0; text-align:left; }
    .bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
    .track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; } .track span { display:block; height:100%; background:var(--blue); }
    .quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; } .quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; }
    .controls { display:grid; grid-template-columns:repeat(5,minmax(130px,1fr)); gap:10px; margin-bottom:14px; } label { display:grid; gap:6px; font-size:12px; color:var(--muted); } select,input { min-height:38px; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
    .clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; } .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; }
    .top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; } .source { font-weight:750; margin-right:auto; } .badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; } .badge.major { background:#e8f0dc; color:#35592f; }
    .statement,.idea { line-height:1.55; font-size:14px; } .idea { border-left:3px solid var(--blue); padding-left:10px; color:#33414e; font-size:13px; }
    @media (max-width:980px) { main { padding:18px; } header { padding:24px 18px 18px; } .stats,.grid,.controls { grid-template-columns:1fr; } }

  <script>
    const problems = [{"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "1", "source": "2017 AMC 12A Problem 1", "statement": "Pablo buys popsicles for his friends. The store sells single popsicles for $1 each, 3-popsicle boxes for $2, and 5-popsicle boxes for $3. What is the greatest number of popsicles that Pablo can buy with $8? (A) 8 (B) 11 (C) 12 (D) 13 (E) 15", "answer": "", "major_category": "代数", "minor_category": "三角恒等式", "tags": "三角函数;恒等式", "key_idea": "用三角恒等式、角度关系或特殊角化简。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "2", "source": "2017 AMC 12A Problem 2", "statement": "The sum of two nonzero real numbers is 4 times their product. What is the sum of the reciprocals of the two numbers? (A) 1 (B) 2 (C) 4 (D) 8 (E) 12", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "3", "source": "2017 AMC 12A Problem 3", "statement": "Ms. Carroll promised that anyone who got all the multiple choice questions right on the up- coming exam would receive an A on the exam. Which of these statements necessarily follows logically? (A) If Lewis did not receive an A, then he got all of the multiple choice questions wrong. (B) If Lewis did not receive an A, then he got at least one of the multiple choice questions wrong. (C) If Lewis got at least one of the multiple choice questions wrong, then he did not receive an A. (D) If Lewis received an A, then he got all of the multiple choice questions right. (E) If Lewis received an A, then he got at least one of the multiple choice questions right.", "answer": "", "major_category": "代数", "minor_category": "对数与指数", "tags": "对数;指数", "key_idea": "使用换底、指数规律或对数恒等式化简。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "4", "source": "2017 AMC 12A Problem 4", "statement": "Jerry and Silvia wanted to go from the southwest corner of a square field to the northeast corner. Jerry walked due east and then due north to reach the goal, but Silvia headed northeast and reached the goal walking in a straight line. Which of the following is closest to how much shorter Silvia’s trip was, compared to Jerry’s trip? (A) 30% (B) 40% (C) 50% (D) 60% (E) 70%", "answer": "", "major_category": "几何", "minor_category": "三角形", "tags": "三角形;角度", "key_idea": "运用三角形边角关系、三角函数或面积公式。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "5", "source": "2017 AMC 12A Problem 5", "statement": "At a gathering of 30 people, there are 20 people who all know each other and 10 people who know no one. People who know each other hug, and people who do not know each other shake hands. How many handshakes occur? (A) 240 (B) 245 (C) 290 (D) 480 (E) 490", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "6", "source": "2017 AMC 12A Problem 6", "statement": "Joy has 30 thin rods, one each of every integer length from 1 cm through 30 cm. She places the rods with lengths 3 cm, 7 cm, and 15 cm on a table. She then wants to choose a fourth rod that she can put with these three to form a quadrilateral with positive area. How many of the remaining rods can she choose as the fourth rod? (A) 16 (B) 17 (C) 18 (D) 19 (E) 20", "answer": "", "major_category": "几何", "minor_category": "面积与相似", "tags": "面积;比例", "key_idea": "抓住面积比例、相似关系或周长约束建立方程。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "7", "source": "2017 AMC 12A Problem 7", "statement": "Define a function on the positive integers recursively by f (1) = 2, f (n) = f (n − 1) + 1 if n is even, and f (n) = f (n − 2) + 2 if n is odd and greater than 1. What is f (2017)? (A) 2017 (B) 2018 (C) 4034 (D) 4035 (E) 4036", "answer": "", "major_category": "数论", "minor_category": "整数构造", "tags": "整数;构造", "key_idea": "用整数范围、构造和极值条件筛选可能值。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "8", "source": "2017 AMC 12A Problem 8", "statement": "The region consisting of all points in three-dimensional space within 3 units of line segment AB has volume 216π. What is the length AB? (A) 6 (B) 12 (C) 18 (D) 20 (E) 24", "answer": "", "major_category": "几何", "minor_category": "三角形", "tags": "三角形;角度", "key_idea": "运用三角形边角关系、三角函数或面积公式。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "9", "source": "2017 AMC 12A Problem 9", "statement": "Let S be the set of points (x, y) in the coordinate plane such that two of the three quantities 3, x + 2, and y − 4 are equal and the third of the three quantities is no greater than this common value. Which of the following is a correct description of S? (A) a single point (B) two intersecting lines (C) three lines whose pairwise intersections are three distinct points (D) a triangle (E) three rays with a common endpoint", "answer": "", "major_category": "几何", "minor_category": "坐标几何", "tags": "坐标;几何", "key_idea": "建立坐标或使用距离、斜率、面积公式求解。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "10", "source": "2017 AMC 12A Problem 10", "statement": "Chloe´ chooses a real number uniformly at random from the interval [0, 2017]. Independently, Laurent chooses a real number uniformly at random from the interval [0, 4034]. What is the prob- ability that Laurent’s number is greater than Chloe´ ’s number? (A) 1 (B) 2 (C) 3 (D) 5 (E) 7 2 3 4 6 8", "answer": "", "major_category": "概率与统计", "minor_category": "独立性", "tags": "独立事件;概率", "key_idea": "把事件关系转化为计数或比例条件。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "11", "source": "2017 AMC 12A Problem 11", "statement": "Claire adds the degree measures of the interior angles of a convex polygon and arrives at a sum of 2017. She then discovers that she forgot to include one angle. What is the degree measure of the forgotten angle? (A) 37 (B) 63 (C) 117 (D) 143 (E) 163", "answer": "", "major_category": "几何", "minor_category": "三角形", "tags": "三角形;角度", "key_idea": "运用三角形边角关系、三角函数或面积公式。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "12", "source": "2017 AMC 12A Problem 12", "statement": "There are 10 horses, named Horse 1, Horse 2, . . ., Horse 10. They get their names from how many minutes it takes them to run one lap around a circular race track: Horse k runs one lap in exactly k minutes. At time 0 all the horses are together at the starting point on the track. The horses start running in the same direction, and they keep running around the circular track at their constant speeds. The least time S > 0, in minutes, at which all 10 horses will again simultaneously be at the starting point is S = 2520. Let T > 0 be the least time, in minutes, such that at least 5 of the horses are again at the starting point. What is the sum of the digits of T ? (A) 2 (B) 3 (C) 4 (D) 5 (E) 6", "answer": "", "major_category": "数论", "minor_category": "进制与数字", "tags": "数字;进制", "key_idea": "分析数字、位值或进制表示带来的整数约束。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "13", "source": "2017 AMC 12A Problem 13", "statement": "Driving at a constant speed, Sharon usually takes 180 minutes to drive from her house to her mother’s house. One day Sharon begins the drive at her usual speed, but after driving 1 of the 3 way, she hits a bad snowstorm and reduces her speed by 20 miles per hour. This time the trip takes her a total of 276 minutes. How many miles is it from Sharon’s house to her mother’s house? (A) 132 (B) 135 (C) 138 (D) 141 (E) 144", "answer": "", "major_category": "代数", "minor_category": "三角恒等式", "tags": "三角函数;恒等式", "key_idea": "用三角恒等式、角度关系或特殊角化简。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "A", "problem_no": "14", "source": "2017 AMC 12A Problem 14", "statement": "Alic egory": "代数", "minor_category": "多项式与根", "tags": "多项式;根", "key_idea": "结合韦达定理、整数根或多项式结构求解。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "B", "problem_no": "24", "source": "2017 AMC 12B Problem 24", "statement": "Quadrilateral ABCD has right angles at B and C, △ABC ∼ △BCD, and AB > BC. There is a point E in the interior of ABCD such that △ABC ∼ △CEB and the area of △AED is 17 times the area of △CEB. What is AB ? BC √ √ √ √ √ (A) 1 + 2 (B) 2 + 2 (C) 17 (D) 2 + 5 (E) 1 + 2 3", "answer": "", "major_category": "几何", "minor_category": "面积与相似", "tags": "面积;比例", "key_idea": "抓住面积比例、相似关系或周长约束建立方程。", "notes": ""}, {"year": "2017", "contest": "AMC 12", "form": "B", "problem_no": "25", "source": "2017 AMC 12B Problem 25", "statement": "A set of n people participate in an online video basketball tournament. Each person may be a member of any number of 5-player teams, but no two teams may have exactly the same 5 members. The site statistics show a curious fact: The average, over all subsets of size 9 of the set of n participants, of the number of complete teams whose members are among those 9 people is equal to the reciprocal of the average, over all subsets of size 8 of the set of n participants, of the number of complete teams whose members are among those 8 people. How many values n, 9 ≤ n ≤ 2017, can be the number of participants? (A) 477 (B) 482 (C) 487 (D) 557 (E) 562 –", "answer": "", "major_category": "概率与统计", "minor_category": "平均数与数据集", "tags": "平均数;数据", "key_idea": "把平均数、总和或中位数条件转化为代数约束。", "notes": ""}];
    const filters = { form:document.querySelector("#formFilter"), major:document.querySelector("#majorFilter"), minor:document.querySelector("#minorFilter"), search:document.querySelector("#searchInput") };
    const cards=document.querySelector("#cards"), resultCount=document.querySelector("#resultCount"), clearFilters=document.querySelector("#clearFilters");
    const esc=v=>String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
    function fill(select, values, current=select.value){ select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(""); if(values.includes(current)) select.value=current; }
    function refreshOptions(){ const cm=filters.major.value, cn=filters.minor.value; const base=problems.filter(p=>!filters.form.value||p.form===filters.form.value); fill(filters.major, unique(base.map(p=>p.major_category)), cm); const minorBase=base.filter(p=>!filters.major.value||p.major_category===filters.major.value); fill(filters.minor, unique(minorBase.map(p=>p.minor_category)), cn); }
    function matches(p){ const q=filters.search.value.trim().toLowerCase(); const hay=[p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase(); return (!filters.form.value||p.form===filters.form.value)&&(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q)); }
    function syncButtons(){ document.querySelectorAll("[data-filter-major]").forEach(el=>{ const major=el.dataset.filterMajor||"", minor=el.dataset.filterMinor||""; el.classList.toggle("active", filters.major.value===major && (!minor || filters.minor.value===minor)); }); }
    function render(){ refreshOptions(); const shown=problems.filter(matches).sort((a,b)=>a.form.localeCompare(b.form)||Number(a.problem_no)-Number(b.problem_no)); resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`; syncButtons(); cards.innerHTML=shown.map(p=>`<article class="card"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge">${esc(p.form)}卷</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea">${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").map(t=>`<span class="badge">${esc(t)}</span>`).join(" ")}</div></article>`).join(""); }
    Object.values(filters).forEach(el=>el.addEventListener("input",render));
    document.addEventListener("click",e=>{ const action=e.target.closest("[data-filter-major]"); if(!action) return; filters.major.value=action.dataset.filterMajor||""; refreshOptions(); filters.minor.value=action.dataset.filterMinor||""; filters.search.value=""; render(); });
    clearFilters.addEventListener("click",()=>{ Object.values(filters).forEach(el=>el.value=""); render(); });
    render();
  </script>
