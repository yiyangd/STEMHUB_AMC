<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2024 AMC 12 题目分类筛选</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --panel: #ffffff;
      --ink: #1d252c;
      --muted: #66727f;
      --line: #d9ded9;
      --blue: #2166a5;
      --green: #4f7d48;
      --red: #b64e43;
      --gold: #b98525;
      --chip: #eef3f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 28px 32px 20px;
      background: #17324a;
      color: white;
    }
    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: 0;
    }
    header p {
      margin: 0;
      color: #d7e4ef;
      max-width: 960px;
      line-height: 1.55;
    }
    main { padding: 24px 32px 40px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .stat strong {
      display: block;
      font-size: 26px;
      margin-bottom: 4px;
    }
    .stat span { color: var(--muted); font-size: 13px; }
    .dashboard {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(360px, 1.2fr);
      gap: 18px;
      margin-bottom: 18px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 86px 1fr 96px;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
      font-size: 13px;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 6px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: left;
      font: inherit;
      transition: background .15s ease, border-color .15s ease;
    }
    .bar-row:hover, .bar-row.active {
      background: #f1f6f2;
      border-color: #c9d9c4;
    }
    .bar-track {
      height: 10px;
      background: #e8ece9;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--blue);
    }
    .bar-value { color: var(--muted); text-align: right; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 6px;
      text-align: left;
    }
    th { color: var(--muted); font-weight: 650; }
    .table-action {
      cursor: pointer;
      transition: background .15s ease;
    }
    .table-action:hover, .table-action.active {
      background: #f1f6f2;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .quick-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfb;
      color: var(--ink);
      padding: 8px 10px;
      text-align: left;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }
    .quick-chip strong {
      color: var(--blue);
      font-size: 12px;
    }
    .quick-chip:hover, .quick-chip.active {
      border-color: #aac7db;
      background: #edf6fb;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(5, minmax(130px, 1fr));
      gap: 10px;
      margin: 18px 0;
      align-items: end;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    select, input {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--ink);
      background: white;
      font: inherit;
    }
    .clear-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #24384b;
      color: white;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }
    .clear-button:hover {
      background: #172838;
    }
    .result-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin: 12px 0;
      color: var(--muted);
      font-size: 14px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 15px;
      display: grid;
      gap: 10px;
    }
    .card-top {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .source {
      font-weight: 750;
      margin-right: auto;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--chip);
      font-size: 12px;
      color: #354250;
    }
    .badge.major { background: #e8f0dc; color: #35592f; }
    .statement {
      line-height: 1.55;
      font-size: 14px;
    }
    .idea {
      border-left: 3px solid var(--blue);
      padding-left: 10px;
      color: #33414e;
      line-height: 1.5;
      font-size: 13px;
    }
    .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .empty {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 8px;
    }
    @media (max-width: 980px) {
      main { padding: 18px; }
      header { padding: 24px 18px 18px; }
      .stats, .dashboard, .controls { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 74px 1fr 84px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>2024 AMC 12 题目分类筛选</h1>
    <p>基于 2024 AMC 12 A 卷与 B 卷共 50 题整理。每道题只归入一个一级分类和一个二级分类；源 PDF 未提供答案表，因此答案字段留空。</p>
  </header>
  <main>
    <section class="stats">
      <div class="stat"><strong>50</strong><span>总题量</span></div>
      <div class="stat"><strong>25</strong><span>A 卷题量</span></div>
      <div class="stat"><strong>25</strong><span>B 卷题量</span></div>
      <div class="stat"><strong>5</strong><span>一级分类</span></div>
    </section>

    <section class="dashboard">
      <div class="panel">
        <h2>一级分类分布</h2>
        
            <button class="bar-row category-action" type="button" data-filter-major="代数" aria-label="筛选代数题目">
              <div class="bar-label">代数</div>
              <div class="bar-track"><div class="bar-fill" style="width:38.0%"></div></div>
              <div class="bar-value">19题 · 38.0%</div>
            </button>
            <button class="bar-row category-action" type="button" data-filter-major="几何" aria-label="筛选几何题目">
              <div class="bar-label">几何</div>
              <div class="bar-track"><div class="bar-fill" style="width:24.0%"></div></div>
              <div class="bar-value">12题 · 24.0%</div>
            </button>
            <button class="bar-row category-action" type="button" data-filter-major="数论" aria-label="筛选数论题目">
              <div class="bar-label">数论</div>
              <div class="bar-track"><div class="bar-fill" style="width:18.0%"></div></div>
              <div class="bar-value">9题 · 18.0%</div>
            </button>
            <button class="bar-row category-action" type="button" data-filter-major="组合数学" aria-label="筛选组合数学题目">
              <div class="bar-label">组合数学</div>
              <div class="bar-track"><div class="bar-fill" style="width:6.0%"></div></div>
              <div class="bar-value">3题 · 6.0%</div>
            </button>
            <button class="bar-row category-action" type="button" data-filter-major="概率与统计" aria-label="筛选概率与统计题目">
              <div class="bar-label">概率与统计</div>
              <div class="bar-track"><div class="bar-fill" style="width:14.0%"></div></div>
              <div class="bar-value">7题 · 14.0%</div>
            </button>
      </div>
      <div class="panel">
        <h2>A/B 卷题型占比</h2>
        <table>
          <thead><tr><th>一级分类</th><th>A题量</th><th>A占比</th><th>B题量</th><th>B占比</th></tr></thead>
          <tbody><tr class="table-action" data-filter-major="代数" title="点击筛选代数">
                  <td>代数</td><td>11</td><td>44.0%</td><td>8</td><td>32.0%</td>
                </tr><tr class="table-action" data-filter-major="几何" title="点击筛选几何">
                  <td>几何</td><td>5</td><td>20.0%</td><td>7</td><td>28.0%</td>
                </tr><tr class="table-action" data-filter-major="数论" title="点击筛选数论">
                  <td>数论</td><td>5</td><td>20.0%</td><td>4</td><td>16.0%</td>
                </tr><tr class="table-action" data-filter-major="组合数学" title="点击筛选组合数学">
                  <td>组合数学</td><td>1</td><td>4.0%</td><td>2</td><td>8.0%</td>
                </tr><tr class="table-action" data-filter-major="概率与统计" title="点击筛选概率与统计">
                  <td>概率与统计</td><td>3</td><td>12.0%</td><td>4</td><td>16.0%</td>
                </tr></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>二级分类快速入口</h2>
      <div class="quick-grid">
        <button class="quick-chip" type="button" data-filter-major="代数" data-filter-minor="三角恒等式">
                  <span>代数 / 三角恒等式</span><strong>3</strong>
                </button><button class="quick-chip" type="button" data-filter-major="代数" data-filter-minor="函数与图像">
                  <span>代数 / 函数与图像</span><strong>3</strong>
                </button><button class="quick-chip" type="button" data-filter-major="代数" data-filter-minor="复数">
                  <span>代数 / 复数</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="代数" data-filter-minor="多项式与根">
                  <span>代数 / 多项式与根</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="代数" data-filter-minor="数列与递推">

                  <span>代数 / 方程与不等式</span><strong>3</strong>
                </button><button class="quick-chip" type="button" data-filter-major="代数" data-filter-minor="线性模型">
                  <span>代数 / 线性模型</span><strong>2</strong>
                </button><button class="quick-chip" type="button" data-filter-major="代数" data-filter-minor="运算与化简">
                  <span>代数 / 运算与化简</span><strong>3</strong>
                </button><button class="quick-chip" type="button" data-filter-major="几何" data-filter-minor="三角形">
                  <span>几何 / 三角形</span><strong>4</strong>
                </button><button class="quick-chip" type="button" data-filter-major="几何" data-filter-minor="几何变换">
                  <span>几何 / 几何变换</span><strong>2</strong>
                </button><button class="quick-chip" type="button" data-filter-major="几何" data-filter-minor="向量几何">
                  <span>几何 / 向量几何</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="几何" data-filter-minor="圆与四边形">
                  <span>几何 / 圆与四边形</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="几何" data-filter-minor="坐标几何">
                  <span>几何 / 坐标几何</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="几何" data-filter-minor="空间几何">
                  <span>几何 / 空间几何</span><strong>2</strong>
                </button><button class="quick-chip" type="button" data-filter-major="几何" data-filter-minor="面积与相似">
                  <span>几何 / 面积与相似</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="数论" data-filter-minor="勾股数组">
                  <span>数论 / 勾股数组</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="数论" data-filter-minor="平方数">
                  <span>数论 / 平方数</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="数论" data-filter-minor="整数构造">
                  <span>数论 / 整数构造</span><strong>3</strong>
                </button><button class="quick-chip" type="button" data-filter-major="数论" data-filter-minor="整除与同余">
                  <span>数论 / 整除与同余</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="数论" data-filter-minor="质因数分解">
                  <span>数论 / 质因数分解</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="数论" data-filter-minor="进制">
                  <span>数论 / 进制</span><strong>2</strong>
                </button><button class="quick-chip" type="button" data-filter-major="组合数学" data-filter-minor="周期与递推计数">
                  <span>组合数学 / 周期与递推计数</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="组合数学" data-filter-minor="图形计数">
                  <span>组合数学 / 图形计数</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="组合数学" data-filter-minor="排列组合">
                  <span>组合数学 / 排列组合</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="概率与统计" data-filter-minor="代数概率">
                  <span>概率与统计 / 代数概率</span><strong>1</strong>
                </button><button class="quick-chip" type="button" data-filter-major="概率与统计" data-filter-minor="几何概率">
                  <span>概率与统计 / 几何概率</span><strong>2</strong>
                </button><button class="quick-chip" type="button" data-filter-major="概率与统计" data-filter-minor="平均数与数据集">

                </button><button class="quick-chip" type="button" data-filter-major="概率与统计" data-filter-minor="组合概率">

                </button>
      </div>
    </section>

    <section class="panel">
      <h2>筛选题目</h2>
      <div class="controls">
        <label>卷别
          <select id="formFilter"><option value="">全部</option><option value="A">A卷</option><option value="B">B卷</option></select>
        </label>
        <label>一级分类
          <select id="majorFilter"><option value="">全部</option></select>
        </label>
        <label>二级分类
          <select id="minorFilter"><option value="">全部</option></select>
        </label>
        <label>搜索
          <input id="searchInput" placeholder="题号、标签、关键词">
        </label>
        <button id="clearFilters" class="clear-button" type="button">清除筛选</button>
      </div>
      <div class="result-head">
        <div id="resultCount"></div>
        <div>点击统计条或二级分类按钮可快速切换题目</div>
      </div>
      <div id="cards" class="cards"></div>
    </section>
  </main>

", "notes": "题面包含两个正三角形旋转形成的六边形图。"}, {"year": 2024, "contest": "AMC 12", "form": "B", "problem_no": 20, "source": "2024 AMC 12B Problem 20", "statement": "Suppose A,B,C are points with AB=40 and AC=42. Let x be the length from A to the midpoint of BC, and f(x) be the area of triangle ABC. The domain is (p,q), and maximum r occurs at x=s. What is p+q+r+s?", "answer": "", "major_category": "几何", "minor_category": "三角形", "tags": "中线;面积;最值;三角形不等式", "key_idea": "用中线长度与第三边关系确定 x 的范围，并求面积最大时的构型。", "notes": ""}, {"year": 2024, "contest": "AMC 12", "form": "B", "problem_no": 21, "source": "2024 AMC 12B Problem 21", "statement": "The smallest angles of three different primitive Pythagorean right triangles sum to 90 degrees. Two are 3-4-5 and 5-12-13. What is the perimeter of the third triangle?", "answer": "", "major_category": "数论", "minor_category": "勾股数组", "tags": "勾股数组;三角函数;角和", "key_idea": "用小角的正切值和角和公式确定第三个勾股三角形。", "notes": ""}, {"year": 2024, "contest": "AMC 12", "form": "B", "problem_no": 22, "source": "2024 AMC 12B Problem 22", "statement": "Let triangle ABC have integer side lengths and angle B = 2 angle A. What is the least possible perimeter?", "answer": "", "major_category": "几何", "minor_category": "三角形", "tags": "倍角;整数边;正弦定理", "key_idea": "由 B=2A 和正弦定理推出边长关系，再搜索最小整数周长。", "notes": ""}, {"year": 2024, "contest": "AMC 12", "form": "B", "problem_no": 23, "source": "2024 AMC 12B Problem 23", "statement": "A right pyramid has regular octagon ABCDEFGH with side length 1 as its base and apex V. Segments AV and DV are perpendicular. What is the square of the height?", "answer": "", "major_category": "几何", "minor_category": "空间几何", "tags": "正八边形;棱锥;空间垂直;高度", "key_idea": "把底面中心到顶点距离与侧棱向量垂直条件结合，解出高度平方。", "notes": ""}, {"year": 2024, "contest": "AMC 12", "form": "B", "problem_no": 24, "source": "2024 AMC 12B Problem 24", "statement": "How many ordered triples (a,b,c) of positive integers with a<=b<=c<=9 can be altitudes of a nondegenerate triangle with integer inradius?", "answer": "", "major_category": "几何", "minor_category": "三角形", "tags": "三角形;高;内切圆;整数枚举", "key_idea": "用面积与高、内切圆半径的关系把高度条件转化为可枚举的边长/半周长条件。", "notes": "主要解法是三角形几何关系，带有有限枚举。"}, {"year": 2024, "contest": "AMC 12", "form": "B", "problem_no": 25, "source": "2024 AMC 12B Problem 25", "statement": "Pablo decorates each of 6 identical white balls with striped/dotted pattern and red/blue color, using fair coins for the 12 decisions. A ball is selected randomly. What is the numerator m of the probability that the events selected ball is red and selected ball is striped are independent?", "answer": "", "major_category": "概率与统计", "minor_category": "独立性", "tags": "独立事件;随机配置;计数;二元表", "key_idea": "把结果看作 2x2 列联表，独立性等价于行列乘积条件，再计数所有配置。", "notes": ""}];
    const filters = {
      form: document.querySelector("#formFilter"),
      major: document.querySelector("#majorFilter"),
      minor: document.querySelector("#minorFilter"),
      search: document.querySelector("#searchInput"),
    };
    const cards = document.querySelector("#cards");
    const resultCount = document.querySelector("#resultCount");
    const clearFilters = document.querySelector("#clearFilters");

    function unique(values) {
      return [...new Set(values.filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), "zh-CN"));
    }

    function fillSelect(select, values, keep = "") {
      const current = keep || select.value;
      select.innerHTML = '<option value="">全部</option>' + values.map(v => `<option value="${escapeAttr(v)}">${escapeHtml(v)}</option>`).join("");
      if (values.includes(current)) select.value = current;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function escapeAttr(value) { return escapeHtml(value); }

    function refreshOptions() {
      const selectedForm = filters.form.value;
      const selectedMajor = filters.major.value;
      const selectedMinor = filters.minor.value;
      const base = problems.filter(p => !selectedForm || p.form === selectedForm);
      const majors = unique(base.map(p => p.major_category));
      fillSelect(filters.major, majors, selectedMajor);
      if (selectedMajor && !majors.includes(selectedMajor)) filters.major.value = "";
      const minorBase = base.filter(p => !filters.major.value || p.major_category === filters.major.value);
      const minors = unique(minorBase.map(p => p.minor_category));
      fillSelect(filters.minor, minors, selectedMinor);
      if (selectedMinor && !minors.includes(selectedMinor)) filters.minor.value = "";
    }

    function matches(p) {
      const q = filters.search.value.trim().toLowerCase();
      const haystack = [p.source, p.statement, p.major_category, p.minor_category, p.tags, p.key_idea, p.notes].join(" ").toLowerCase();
      return (!filters.form.value || p.form === filters.form.value)
        && (!filters.major.value || p.major_category === filters.major.value)
        && (!filters.minor.value || p.minor_category === filters.minor.value)
        && (!q || haystack.includes(q));
    }

    function syncActiveButtons() {
      document.querySelectorAll("[data-filter-major]").forEach(el => {
        const major = el.dataset.filterMajor || "";
        const minor = el.dataset.filterMinor || "";
        const active = filters.major.value === major && (!minor || filters.minor.value === minor);
        el.classList.toggle("active", active);
      });
    }

    function applyCategoryFilter(major, minor = "") {
      filters.major.value = major;
      filters.search.value = "";
      refreshOptions();
      filters.minor.value = minor;
      render();
      document.querySelector("#resultCount").scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetFilters() {
      filters.form.value = "";
      filters.major.value = "";
      filters.minor.value = "";
      filters.search.value = "";
      render();
    }

    function render() {
      refreshOptions();
      const shown = problems.filter(matches).sort((a, b) => a.form.localeCompare(b.form) || a.problem_no - b.problem_no);
      resultCount.textContent = `当前显示 ${shown.length} / ${problems.length} 题`;
      syncActiveButtons();
      if (!shown.length) {
        cards.innerHTML = '<div class="empty">没有匹配的题目</div>';
        return;
      }
      cards.innerHTML = shown.map(p => `
        <article class="card">
          <div class="card-top">
            <div class="source">${escapeHtml(p.source)}</div>
            <span class="badge major">${escapeHtml(p.major_category)}</span>
            <span class="badge">${escapeHtml(p.minor_category)}</span>
          </div>
          <div class="statement">${escapeHtml(p.statement)}</div>
          <div class="idea">${escapeHtml(p.key_idea)}${p.notes ? `<br><strong>备注：</strong>${escapeHtml(p.notes)}` : ""}</div>
          <div class="tags">${String(p.tags).split(";").map(t => `<span class="badge">${escapeHtml(t)}</span>`).join("")}</div>
        </article>
      `).join("");
    }

    Object.values(filters).forEach(el => el.addEventListener("input", render));
    document.addEventListener("click", event => {
      const action = event.target.closest("[data-filter-major]");
      if (!action) return;
      applyCategoryFilter(action.dataset.filterMajor || "", action.dataset.filterMinor || "");
    });
    clearFilters.addEventListener("click", resetFilters);
    render();
  </script>
</body>
</html>
