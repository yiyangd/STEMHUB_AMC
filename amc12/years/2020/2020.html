<!doctype html>

  <title>2020 AMC 12 题目分类筛选</title>
  <style>
    :root { --bg:#f7f4ee; --panel:#fff; --ink:#1d252c; --muted:#66727f; --line:#d9ded9; --blue:#2166a5; --chip:#eef3f7; }
    * { box-sizing:border-box; } body { margin:0; font-family:Inter,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink); }
    header { padding:28px 32px 20px; background:#17324a; color:white; } h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; } header p { margin:0; color:#d7e4ef; }
    main { padding:24px 32px 40px; } .stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
    .stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; } .stat strong { display:block; font-size:26px; } .stat span,.muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr); gap:16px; margin-bottom:16px; }
    button { font:inherit; cursor:pointer; } .bar-row { width:100%; display:grid; grid-template-columns:86px 1fr 60px; gap:10px; align-items:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:7px; margin:7px 0; text-align:left; }
    .bar-row:hover,.bar-row.active,.quick-chip:hover,.quick-chip.active { background:#eef6f1; border-color:#bed2bd; }
    .track { height:10px; border-radius:999px; background:#e8ece9; overflow:hidden; } .track span { display:block; height:100%; background:var(--blue); }
    .quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; } .quick-chip { display:flex; justify-content:space-between; gap:10px; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#fbfcfb; padding:8px 10px; text-align:left; }
    .controls { display:grid; grid-template-columns:repeat(5,minmax(130px,1fr)); gap:10px; margin-bottom:14px; } label { display:grid; gap:6px; font-size:12px; color:var(--muted); } select,input { min-height:38px; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
    .clear { min-height:38px; border:1px solid var(--line); border-radius:6px; background:#24384b; color:#fff; padding:8px 12px; align-self:end; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; } .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; display:grid; gap:10px; }
    .top { display:flex; flex-wrap:wrap; gap:7px; align-items:center; } .source { font-weight:750; margin-right:auto; } .badge { display:inline-flex; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--chip); font-size:12px; } .badge.major { background:#e8f0dc; color:#35592f; }
    .statement,.idea { line-height:1.55; font-size:14px; } .idea { border-left:3px solid var(--blue); padding-left:10px; color:#33414e; font-size:13px; }
    @media (max-width:980px) { main { padding:18px; } header { padding:24px 18px 18px; } .stats,.grid,.controls { grid-template-columns:1fr; } }
  </style>
</head>

ilter-major="组合数学" data-filter-minor="排列组合"><span>组合数学 / 排列组合</span><strong>3</strong></button><button class="quick-chip" data-filter-major="组合数学" data-filter-minor="递推与序列计数"><span>组合数学 / 递推与序列计数</span><strong>3</strong></button><button class="quick-chip" data-filter-major="概率与统计" data-filter-minor="几何概率"><span>概率与统计 / 几何概率</span><strong>3</strong></button><button class="quick-chip" data-filter-major="概率与统计" data-filter-minor="平均数与数据集"><span>概率与统计 / 平均数与数据集</span><strong>1</strong></button><button class="quick-chip" data-filter-major="概率与统计" data-filter-minor="独立性"><span>概率与统计 / 独立性</span><strong>2</strong></button><button class="quick-chip" data-filter-major="概率与统计" data-filter-minor="组合概率"><span>概率与统计 / 组合概率</span><strong>2</strong></button></div></div></section>

  <script>
    const problems = [{"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "1", "source": "2020 AMC 12A Problem 1", "statement": "Carlos took 70% of a whole pie. Maria took one third of the remainder. What portion of the whole pie was left? (A) 10% (B) 15% (C) 20% (D) 30% (E) 35%", "answer": "", "major_category": "数论", "minor_category": "整除与同余", "tags": "同余;余数", "key_idea": "把条件转化为同余或余数分类讨论。", "notes": ""}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "2", "source": "2020 AMC 12A Problem 2", "statement": "The acronym AMC is shown in the rectangular grid below with grid lines spaced 1 unit apart. In units, what is the sum of the lengths of the line segments that form the acronym AMC? √ √ √ (A) 17 (B) 15 + 2 2 (C) 13 + 4 2 (D) 11 + 6 2 (E) 21", "answer": "", "major_category": "组合数学", "minor_category": "图形计数", "tags": "网格;计数", "key_idea": "把图形限制转化为状态或结构计数。", "notes": "题面包含图形"}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "3", "source": "2020 AMC 12A Problem 3", "statement": "A driver travels for 2 hours at 60 miles per hour, during which her car gets 30 miles per gallon of gasoline. She is paid $0.50 per mile, and her only expense is gasoline at $2.00 per gallon. What is her net rate of pay, in dollars per hour, after this expense? (A) 20 (B) 22 (C) 24 (D) 25 (E) 26", "answer": "", "major_category": "代数", "minor_category": "运算与化简", "tags": "代数;化简", "key_idea": "通过代数化简、配对或基本运算降低计算量。", "notes": "自动分类依据较弱，按代数主线暂归类"}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "4", "source": "2020 AMC 12A Problem 4", "statement": "How many 4-digit positive integers (that is, integers between 1000 and 9999, inclusive) having only even digits are divisible by 5? (A) 80 (B) 100 (C) 125 (D) 200 (E) 500", "answer": "", "major_category": "数论", "minor_category": "进制与数字", "tags": "数字;进制", "key_idea": "分析数字、位值或进制表示带来的整数约束。", "notes": ""}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "5", "source": "2020 AMC 12A Problem 5", "statement": "The 25 integers from −10 to 14, inclusive, can be arranged to form a 5-by-5 square in which the sum of the numbers in each row, the sum of the numbers in each column, and the sum of the numbers along each of the main diagonals are all the same. What is the value of this common sum? (A) 2 (B) 5 (C) 10 (D) 25 (E) 50", "answer": "", "major_category": "组合数学", "minor_category": "排列组合", "tags": "排列组合;计数", "key_idea": "用分组、排列组合或容斥完成计数。", "notes": ""}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "6", "source": "2020 AMC 12A Problem 6", "statement": "In the plane figure shown below, 3 of the unit squares have been shaded. What is the least number of additional unit squares that must be shaded so that the resulting figure has two lines of symmetry? (A) 4 (B) 5 (C) 6 (D) 7 (E) 8", "answer": "", "major_category": "几何", "minor_category": "几何变换", "tags": "变换;对称", "key_idea": "用旋转、反射、对称或展开方法简化路径和角度。", "notes": "题面包含图形"}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "7", "source": "2020 AMC 12A Problem 7", "statement": "Seven cubes, whose volumes are 1, 8, 27, 64, 125, 216, and 343 cubic units, are stacked vertically to form a tower in which the volumes of the cubes decrease from bottom to top. Except for the bottom cube, the bottom face of each cube lies completely on top of the cube below it. What is the total surface area of the tower (including the bottom) in square units? (A) 644 (B) 658 (C) 664 (D) 720 (E) 749", "answer": "", "major_category": "几何", "minor_category": "空间几何", "tags": "空间几何;体积", "key_idea": "用截面、相似、体积或空间距离关系建模。", "notes": "题面包含图形"}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "8", "source": "2020 AMC 12A Problem 8", "statement": "What is the median of the following list of 4040 numbers? 1, 2, 3, ..., 2020, 12, 22, 32, ..., 20202 (A) 1974.5 (B) 1975.5 (C) 1976.5 (D) 1977.5 (E) 1978.5", "answer": "", "major_category": "概率与统计", "minor_category": "平均数与数据集", "tags": "平均数;数据", "key_idea": "把平均数、总和或中位数条件转化为代数约束。", "notes": ""}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "9", "source": "2020 AMC 12A Problem 9", "statement": "How many solutions does the equation tan (2x) = cos ( x ) have on the interval [0, 2π]? 2 (A) 1 (B) 2 (C) 3 (D) 4 (E) 5", "answer": "", "major_category": "代数", "minor_category": "三角恒等式", "tags": "三角函数;恒等式", "key_idea": "用三角恒等式、角度关系或特殊角化简。", "notes": ""}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "10", "source": "2020 AMC 12A Problem 10", "statement": "There is a unique positive integer n such that log (log n) = log (log n). 2 16 4 4 What is the sum of the digits of n? (A) 4 (B) 7 (C) 8 (D) 11 (E) 13", "answer": "", "major_category": "数论", "minor_category": "进制与数字", "tags": "数字;进制", "key_idea": "分析数字、位值或进制表示带来的整数约束。", "notes": ""}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "11", "source": "2020 AMC 12A Problem 11", "statement": "A frog sitting at the point (1, 2) begins a sequence of jumps, where each jump is parallel to one of the coordinate axes and has length 1, and the direction of each jump (up, down, right, or left) is chosen independently at random. The sequence ends when the frog reaches a side of the square with vertices (0, 0), (0, 4), (4, 4), and (4, 0). What is the probability that the sequence of jumps ends on a vertical side of the square? (A) 1 (B) 5 (C) 2 (D) 3 (E) 7 2 8 3 4 8", "answer": "", "major_category": "概率与统计", "minor_category": "几何概率", "tags": "几何概率;面积", "key_idea": "将随机位置参数化，用面积或长度比例计算概率。", "notes": ""}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "12", "source": "2020 AMC 12A Problem 12", "statement": "Line ℓ in the coordinate plane has the equation 3x − 5y + 40 = 0. This line is rotated 45◦ coun- terclockwise about the point (20, 20) to obtain line k. What is the x-coordinate of the x-intercept of line k? (A) 10 (B) 15 (C) 20 (D) 25 (E) 30", "answer": "", "major_category": "几何", "minor_category": "坐标几何", "tags": "坐标;几何", "key_idea": "建立坐标或使用距离、斜率、面积公式求解。", "notes": ""}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "13", "source": "2020 AMC 12A Problem 13", "statement": "There are integers a, b, and c, each greater than 1, such that (cid:114) (cid:113) √ √ a N b N c N = 36 N 25 for all N > 1. What is b? (A) 2 (B) 3 (C) 4 (D) 5 (E) 6", "answer": "", "major_category": "数论", "minor_category": "整数构造", "tags": "整数;构造", "key_idea": "用整数范围、构造和极值条件筛选可能值。", "notes": ""}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "14", "source": "2020 AMC 12A Problem 14", "statement": "Regular octagon ABCDEF GH has area n. Let m be the area of quadrilateral ACEG. What is m ? n √ √ √ √ (A) 2 (B) 2 (C) 3 (D) 3 2 (E) 2 2 4 2 4 5 3", "answer": "", "major_category": "几何", "minor_category": "面积与相似", "tags": "面积;比例", "key_idea": "抓住面积比例、相似关系或周长约束建立方程。", "notes": ""}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "15", "source": "2020 AMC 12A Problem 15", "statement": "In the complex plane, let A be the set of solutions to z3 − 8 = 0 and let B be the set of solutions to z3 − 8z2 − 8z + 64 = 0. What is the greatest distance between a point of A and a point of B? √ √ √ (A) 2 3 (B) 6 (C) 9 (D) 2 21 (E) 9 + 3", "answer": "", "major_category": "代数", "minor_category": "三角恒等式", "tags": "三角函数;恒等式", "key_idea": "用三角恒等式、角度关系或特殊角化简。", "notes": ""}, {"year": "2020", "contest": "AMC 12", "form": "A", "problem_no": "16", "source": "2020 AMC 12A Problem 16", "statement": "A point is chosen at random within the square in the coordinate plane whose vertices are (0, 0), (2020, 0), (2020, 2020), and (0, 2020). The probability that the point is within d units of a lattice point is 1 . (A point (x, y) is a lattice point if x and y are both integers.) What is d to the nearest 2 tenth? (A) 0.3 (B) 0.4 (C) 0.5 (D) 0.6 (E) 0.7", "answer": "", "major_category": "概率与统计", "minor_category": "几何概率", "tags": "几何概率;面积", "key_idea": "将随机位置参数化，用面积或长度比例计算概率。", "notes": ""     function fill(select, values, current=select.value){ select.innerHTML='<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(""); if(values.includes(current)) select.value=current; }
    function refreshOptions(){ const cm=filters.major.value, cn=filters.minor.value; const base=problems.filter(p=>!filters.form.value||p.form===filters.form.value); fill(filters.major, unique(base.map(p=>p.major_category)), cm); const minorBase=base.filter(p=>!filters.major.value||p.major_category===filters.major.value); fill(filters.minor, unique(minorBase.map(p=>p.minor_category)), cn); }
    function matches(p){ const q=filters.search.value.trim().toLowerCase(); const hay=[p.source,p.statement,p.major_category,p.minor_category,p.tags,p.key_idea,p.notes].join(" ").toLowerCase(); return (!filters.form.value||p.form===filters.form.value)&&(!filters.major.value||p.major_category===filters.major.value)&&(!filters.minor.value||p.minor_category===filters.minor.value)&&(!q||hay.includes(q)); }
    function syncButtons(){ document.querySelectorAll("[data-filter-major]").forEach(el=>{ const major=el.dataset.filterMajor||"", minor=el.dataset.filterMinor||""; el.classList.toggle("active", filters.major.value===major && (!minor || filters.minor.value===minor)); }); }
    function render(){ refreshOptions(); const shown=problems.filter(matches).sort((a,b)=>a.form.localeCompare(b.form)||Number(a.problem_no)-Number(b.problem_no)); resultCount.textContent=`当前显示 ${shown.length} / ${problems.length} 题`; syncButtons(); cards.innerHTML=shown.map(p=>`<article class="card"><div class="top"><div class="source">${esc(p.source)}</div><span class="badge">${esc(p.form)}卷</span><span class="badge major">${esc(p.major_category)}</span><span class="badge">${esc(p.minor_category)}</span></div><div class="statement">${esc(p.statement)}</div><div class="idea">${esc(p.key_idea)}${p.notes?`<br><strong>备注：</strong>${esc(p.notes)}`:""}</div><div>${String(p.tags).split(";").map(t=>`<span class="badge">${esc(t)}</span>`).join(" ")}</div></article>`).join(""); }
    Object.values(filters).forEach(el=>el.addEventListener("input",render));
    document.addEventListener("click",e=>{ const action=e.target.closest("[data-filter-major]"); if(!action) return; filters.major.value=action.dataset.filterMajor||""; refreshOptions(); filters.minor.value=action.dataset.filterMinor||""; filters.search.value=""; render(); });
    clearFilters.addEventListener("click",()=>{ Object.values(filters).forEach(el=>el.value=""); render(); });
    render();
  </script>
</body>
</html>
